<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщество — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:44px 18px 90px}.back{color:#6d3fc0;text-decoration:none}.hero,.panel{background:#fff;border:1px solid #e3e3e8;border-radius:15px;padding:20px}.hero{margin-top:16px}.hero-top{display:flex;gap:16px;align-items:center}.bigicon{width:76px;height:76px;border-radius:18px;background:#f4effb;display:flex;align-items:center;justify-content:center;font-size:40px}.hero h1{margin:0 0 5px}.muted{color:#777;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;background:#6d3fc0;color:#fff}.btn.secondary{background:#f2ecfb;color:#6d3fc0}.btn.danger{background:#fff0f0;color:#a33b3b}.layout{display:grid;grid-template-columns:1fr 340px;gap:15px;margin-top:15px}.panel h2{margin:0 0 12px;font-size:19px}.member,.app{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eee}.member:first-child,.app:first-child{border-top:0}.role{font-size:10px;font-weight:800;color:#6d3fc0}.smallbtn{border:1px solid #ddd;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:11px}.form{display:grid;gap:8px}.form input,.form textarea,.form select{width:100%;border:1px solid #ddd;border-radius:8px;padding:9px;font:inherit}.form textarea{min-height:90px}.manage{display:none}.manage.show{display:block}.empty{color:#888;font-size:13px}.request{margin-top:12px}.request textarea{width:100%;min-height:70px;border:1px solid #ddd;border-radius:8px;padding:9px;font:inherit}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero-top{align-items:flex-start}.bigicon{width:60px;height:60px;font-size:32px}}
</style></head><body><main><a class="back" href="communities.html">← Все сообщества</a><section class="hero" id="hero">Загрузка…</section><div class="layout"><section class="panel"><h2>Участники</h2><div id="members"></div></section><aside><section class="panel manage" id="appsPanel"><h2>Заявки</h2><div id="apps"></div></section><section class="panel manage" id="editPanel" style="margin-top:15px"><h2>Управление</h2><div class="form"><input id="eName" maxlength="80"><input id="eIcon" maxlength="16"><input id="eTopic" maxlength="120"><textarea id="eDescription" maxlength="1500"></textarea><select id="eJoin"><option value="open">Свободное вступление</option><option value="request">По заявке</option></select><button class="btn" onclick="save()">Сохранить</button><button class="btn danger" onclick="closeCommunity()">Закрыть сообщество</button></div></section></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");const id=Number(new URLSearchParams(location.search).get("id"));let model=null,followState={subscribed:false,followers:0};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const dt=v=>new Date(v).toLocaleDateString("ru-RU");
function friendly(e){const m=String(e?.message||e||"");if(m.includes("Already in organization"))return"Вы уже состоите в другой организации.";if(m.includes("Applicant already in organization"))return"Этот гражданин уже состоит в другой организации.";if(m.includes("Owner cannot leave"))return"Основатель не может выйти из собственного сообщества.";return m}
function roleName(r){return r==="owner"?"Основатель":r==="admin"?"Администратор":"Участник"}
function render(){const x=model;document.title=x.name+" — Нерия";hero.innerHTML='<div class="hero-top"><div class="bigicon">'+esc(x.icon||"🏠")+'</div><div><div class="role">'+(x.type==="club"?"КЛУБ":"ОРГАНИЗАЦИЯ")+'</div><h1>'+esc(x.name)+'</h1><div class="muted">'+esc(x.topic||"Без тематики")+' · '+Number(x.member_count||0)+' участников · '+Number(followState.followers||0)+' подписчиков · создано '+dt(x.created_at)+'</div></div></div><p class="muted">'+esc(x.description||"Описание пока не заполнено.")+'</p><div class="actions"><button class="btn '+(followState.subscribed?'secondary':'')+'" onclick="toggleFollow()">'+(followState.subscribed?'✓ Вы подписаны':'＋ Подписаться')+'</button>'+actionButtons(x)+'</div>';
members.innerHTML=(x.members||[]).map(m=>'<div class="member"><div><b>'+esc(m.nickname)+'</b> · №'+String(m.number).padStart(6,"0")+'<div class="role">'+roleName(m.role)+'</div></div>'+(x.can_manage&&m.role!=="owner"?'<div>'+(x.my_role==="owner"?'<button class="smallbtn" onclick="setRole('+Number(m.number)+',\''+(m.role==="admin"?"member":"admin")+'\')">'+(m.role==="admin"?"Снять админа":"Сделать админом")+'</button> ':'')+'<button class="smallbtn" onclick="removeMember('+Number(m.number)+')">Исключить</button></div>':'')+'</div>').join("")||'<div class="empty">Нет участников.</div>';
appsPanel.classList.toggle("show",!!x.can_manage);editPanel.classList.toggle("show",!!x.can_manage);apps.innerHTML=(x.applications||[]).map(a=>'<div class="app"><div><b>'+esc(a.nickname)+'</b> · №'+String(a.number).padStart(6,"0")+'<div class="muted">'+esc(a.message||"Без сообщения")+'</div></div><div><button class="smallbtn" onclick="review('+Number(a.id)+',\'accepted\')">Принять</button> <button class="smallbtn" onclick="review('+Number(a.id)+',\'rejected\')">Отклонить</button></div></div>').join("")||'<div class="empty">Новых заявок нет.</div>';
eName.value=x.name;eIcon.value=x.icon;eTopic.value=x.topic;eDescription.value=x.description;eJoin.value=x.join_mode}
function actionButtons(x){if(x.my_role)return x.my_role==="owner"?'<a class="btn secondary" href="square.html">Публиковать на Площади</a>':'<button class="btn danger" onclick="leave()">Выйти</button>'+(x.can_manage?' <a class="btn secondary" href="square.html">Публиковать на Площади</a>':'');if(x.my_pending)return '<button class="btn secondary" onclick="cancelApp()">Отменить заявку</button>';if(x.join_mode==="open")return '<button class="btn" onclick="join()">Вступить</button>';return '<button class="btn" onclick="showRequest()">Подать заявку</button><div class="request" id="requestBox" style="display:none"><textarea id="requestText" maxlength="700" placeholder="Коротко напишите, почему хотите вступить"></textarea><button class="btn" onclick="join()">Отправить заявку</button></div>'}
function showRequest(){document.getElementById("requestBox").style.display="block"}
async function load(){if(!id){hero.textContent="Сообщество не найдено.";return}const [{data,error},{data:fs}]=await Promise.all([sb.rpc("community_detail",{p_community_id:id}),sb.rpc("subscription_community_state",{p_community_id:id})]);if(error){hero.textContent=friendly(error);return}model=data;followState=fs||{subscribed:false,followers:0};render()}
async function toggleFollow(){const {data,error}=await sb.rpc("subscription_toggle_community",{p_community_id:id});if(error){alert(friendly(error));return}followState=data||followState;render()}
async function join(){const msg=document.getElementById("requestText")?.value||"";const {error}=await sb.rpc("community_join",{p_community_id:id,p_message:msg});if(error){alert(friendly(error));return}load()}
async function cancelApp(){await sb.rpc("community_cancel_application",{p_community_id:id});load()}
async function leave(){if(!confirm("Выйти из сообщества?"))return;const {error}=await sb.rpc("community_leave",{p_community_id:id});if(error){alert(friendly(error));return}load()}
async function review(app,decision){const {error}=await sb.rpc("community_review_application",{p_application_id:app,p_decision:decision});if(error){alert(friendly(error));return}load()}
async function setRole(num,role){const {error}=await sb.rpc("community_set_member_role",{p_community_id:id,p_citizen_number:num,p_role:role});if(error){alert(friendly(error));return}load()}
async function removeMember(num){if(!confirm("Исключить участника?"))return;const {error}=await sb.rpc("community_remove_member",{p_community_id:id,p_citizen_number:num});if(error){alert(friendly(error));return}load()}
async function save(){const {error}=await sb.rpc("community_update",{p_community_id:id,p_name:eName.value.trim(),p_topic:eTopic.value.trim(),p_description:eDescription.value.trim(),p_join_mode:eJoin.value,p_icon:eIcon.value.trim()});if(error){alert(friendly(error));return}load()}
async function closeCommunity(){if(!confirm("Закрыть сообщество? Оно исчезнет из списка, а участники потеряют доступ."))return;const {error}=await sb.rpc("community_close",{p_community_id:id});if(error){alert(friendly(error));return}location.href="communities.html"}
load();
</script></body></html>
