<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Инициатива — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:980px;margin:auto;padding:44px 18px 90px}.back{color:#6d3fc0;text-decoration:none}.hero,.panel{background:#fff;border:1px solid #e3e3e8;border-radius:15px;padding:20px}.hero{margin-top:16px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.7px;color:#6d3fc0}.hero h1{font-size:32px;margin:7px 0}.muted{color:#777;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#6d3fc0;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#f2ecfb;color:#6d3fc0}.btn.danger{background:#fff0f0;color:#a33}.layout{display:grid;grid-template-columns:1fr 340px;gap:14px;margin-top:14px}.panel h2{margin:0 0 12px;font-size:19px}.member,.app{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eee}.member:first-child,.app:first-child{border-top:0}.role{font-size:10px;color:#6d3fc0;font-weight:800}.small{border:1px solid #ddd;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:11px}.form{display:grid;gap:8px}.form input,.form textarea,.form select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit}.form textarea{min-height:90px}.empty{color:#888;font-size:13px}.request textarea{width:100%;min-height:70px;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit}.updates{display:grid;gap:9px}.update{border:1px solid #ece8f1;border-radius:11px;padding:13px;background:#fcfbfd}.update.milestone{border-color:#dbc9ef;background:#faf6ff}.update.status{background:#f7f7f8;border-style:dashed}.update-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.update h3{font-size:14px;margin:0}.update p{font-size:12px;color:#686870;line-height:1.5;margin:6px 0 0;white-space:pre-wrap}.update-meta{font-size:10px;color:#909099;margin-top:6px}.update-compose{display:grid;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #eee}.update-compose input,.update-compose textarea,.update-compose select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit}.update-compose textarea{min-height:80px;resize:vertical}.update-compose .btn{justify-self:start}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head><body><main><a class="back" href="initiatives.html">← Инициативы</a><section class="hero" id="hero">Загрузка…</section><section class="panel" id="updatesPanel" style="display:none;margin-top:14px"><h2>Ход проекта</h2><div id="updateComposer"></div><div class="updates" id="updates"></div></section><div class="layout"><section class="panel"><h2 id="peopleTitle">Участники</h2><div id="people"></div></section><aside><section class="panel" id="appsPanel" style="display:none"><h2>Заявки</h2><div id="apps"></div></section><section class="panel" id="managePanel" style="display:none;margin-top:14px"><h2>Управление</h2><div class="form" id="manageForm"></div></section></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");const qs=new URLSearchParams(location.search),type=qs.get("type")==="event"?"event":"project",id=Number(qs.get("id"));let model=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const fmt=v=>new Date(v).toLocaleString("ru-RU");
const categoryLabel=x=>({creative:"Творчество",media:"Медиа",community:"Сообщество",game:"Игры",education:"Образование",tech:"Технологии",other:"Другое"}[x]||x);
async function load(){if(!id){hero.textContent="Инициатива не найдена.";return}const rpc=type==="project"?"citizen_project_detail":"citizen_event_detail";const arg=type==="project"?{p_project_id:id}:{p_event_id:id};const {data,error}=await sb.rpc(rpc,arg);if(error){hero.textContent=error.message;return}model=data;render()}
function render(){if(type==="project"){updatesPanel.style.display="block";renderProject()}else{updatesPanel.style.display="none";renderEvent()}}
function renderProject(){const x=model;document.title=x.title+" — Нерия";hero.innerHTML='<div class="eyebrow">'+categoryLabel(x.category).toUpperCase()+'</div><h1>'+esc(x.title)+'</h1><div class="muted">'+esc(x.summary||"")+'</div><p class="muted">'+esc(x.description||"Описание пока не заполнено.")+'</p><div class="muted">Автор: '+esc(x.owner_nickname)+' · №'+String(x.owner_number).padStart(6,"0")+(x.community_name?' · от '+esc(x.community_name):'')+'</div><div class="actions">'+projectActions(x)+'</div>';peopleTitle.textContent="Команда";people.innerHTML=(x.members||[]).map(m=>'<div class="member"><div><b>'+esc(m.nickname)+'</b> · №'+String(m.number).padStart(6,"0")+'<div class="role">'+(m.role==="owner"?"Автор проекта":"Участник")+'</div></div></div>').join("")||'<div class="empty">Команды пока нет.</div>';appsPanel.style.display=x.is_owner?"block":"none";apps.innerHTML=(x.applications||[]).map(a=>'<div class="app"><div><b>'+esc(a.nickname)+'</b><div class="muted">'+esc(a.message||"Без сообщения")+'</div></div><div><button class="small" onclick="review('+Number(a.id)+',\'accepted\')">Принять</button> <button class="small" onclick="review('+Number(a.id)+',\'rejected\')">Отклонить</button></div></div>').join("")||'<div class="empty">Заявок нет.</div>';renderUpdates(x);managePanel.style.display=x.is_owner?"block":"none";if(x.is_owner)manageForm.innerHTML='<input id="mTitle" maxlength="100" value="'+esc(x.title)+'"><input id="mSummary" maxlength="220" value="'+esc(x.summary||"")+'"><textarea id="mDescription" maxlength="2500">'+esc(x.description||"")+'</textarea><select id="mCategory">'+["creative","media","community","game","education","tech","other"].map(v=>'<option value="'+v+'" '+(x.category===v?"selected":"")+'>'+categoryLabel(v)+'</option>').join("")+'</select><select id="mJoin"><option value="open" '+(x.join_mode==="open"?"selected":"")+'>Свободное вступление</option><option value="request" '+(x.join_mode==="request"?"selected":"")+'>По заявке</option><option value="closed" '+(x.join_mode==="closed"?"selected":"")+'>Закрытое</option></select><select id="mStatus"><option value="recruiting" '+(x.status==="recruiting"?"selected":"")+'>Набирает команду</option><option value="active" '+(x.status==="active"?"selected":"")+'>В работе</option><option value="completed" '+(x.status==="completed"?"selected":"")+'>Завершён</option><option value="archived" '+(x.status==="archived"?"selected":"")+'>Архив</option></select><button class="btn" onclick="saveProject()">Сохранить</button>'}
function renderUpdates(x){const list=x.updates||[];updateComposer.innerHTML=x.is_owner?'<div class="update-compose"><select id="uType"><option value="update">📝 Новость проекта</option><option value="milestone">⭐ Важный этап</option></select><input id="uTitle" maxlength="120" placeholder="Короткий заголовок"><textarea id="uBody" maxlength="1800" placeholder="Что изменилось, что уже сделано или что происходит сейчас"></textarea><button class="btn" onclick="addProjectUpdate()">Опубликовать</button></div>':'';updates.innerHTML=list.length?list.map(u=>'<article class="update '+esc(u.type)+'"><div class="update-top"><div><h3>'+(u.type==="milestone"?"⭐ ":u.type==="status"?"↻ ":"📝 ")+esc(u.title)+'</h3><div class="update-meta">'+fmt(u.created_at)+(u.author_nickname?' · '+esc(u.author_nickname):' · Системная запись')+'</div></div>'+(u.can_delete?'<button class="small" onclick="deleteProjectUpdate('+Number(u.id)+')">Удалить</button>':'')+'</div>'+(u.body?'<p>'+esc(u.body)+'</p>':'')+'</article>').join(""):'<div class="empty">У проекта пока нет обновлений. Здесь появится его история работы.</div>'}
async function addProjectUpdate(){const title=document.getElementById("uTitle")?.value.trim()||"",body=document.getElementById("uBody")?.value.trim()||"",kind=document.getElementById("uType")?.value||"update";if(title.length<2){alert("Введите заголовок обновления.");return}const {error}=await sb.rpc("citizen_project_add_update",{p_project_id:id,p_update_type:kind,p_title:title,p_body:body});if(error){alert(error.message);return}load()}
async function deleteProjectUpdate(updateId){if(!confirm("Удалить это обновление проекта?"))return;const {error}=await sb.rpc("citizen_project_delete_update",{p_update_id:updateId});if(error){alert(error.message);return}load()}
function projectActions(x){if(x.is_owner)return '<span class="btn secondary">Вы автор проекта</span>';if(x.my_role)return '<button class="btn danger" onclick="leaveProject()">Выйти из проекта</button>';if(x.my_pending)return '<span class="btn secondary">Заявка отправлена</span>';if(x.join_mode==="closed"||x.status==="completed")return '<span class="btn secondary">Вступление закрыто</span>';if(x.join_mode==="open")return '<button class="btn" onclick="joinProject()">Вступить</button>';return '<button class="btn" onclick="showRequest()">Подать заявку</button><div class="request" id="req" style="display:none;width:100%"><textarea id="reqText" maxlength="700" placeholder="Коротко о себе"></textarea><button class="btn" onclick="joinProject()">Отправить</button></div>'}
function showRequest(){document.getElementById("req").style.display="block"}
async function joinProject(){const {error}=await sb.rpc("citizen_project_join",{p_project_id:id,p_message:document.getElementById("reqText")?.value||""});if(error){alert(error.message);return}load()}
async function leaveProject(){if(!confirm("Выйти из проекта?"))return;const {error}=await sb.rpc("citizen_project_leave",{p_project_id:id});if(error){alert(error.message);return}load()}
async function review(a,d){const {error}=await sb.rpc("citizen_project_review",{p_application_id:a,p_decision:d});if(error){alert(error.message);return}load()}
async function saveProject(){const {error}=await sb.rpc("citizen_project_update",{p_project_id:id,p_title:mTitle.value.trim(),p_summary:mSummary.value.trim(),p_description:mDescription.value.trim(),p_category:mCategory.value,p_join_mode:mJoin.value,p_status:mStatus.value});if(error){alert(error.message);return}if(mStatus.value==="archived"){location.href="initiatives.html";return}load()}
function renderEvent(){const x=model;document.title=x.title+" — Нерия";hero.innerHTML='<div class="eyebrow">'+(x.is_official?'🏛️ ОФИЦИАЛЬНОЕ СОБЫТИЕ НЕРИИ':'СОБЫТИЕ')+'</div><h1>'+esc(x.title)+'</h1><p class="muted">'+esc(x.description||"Описание пока не заполнено.")+'</p><div class="muted">📅 '+fmt(x.starts_at)+(x.location_text?' · 📍 '+esc(x.location_text):'')+'<br>Организатор: '+esc(x.organizer_nickname)+' · №'+String(x.organizer_number).padStart(6,"0")+(x.community_name?' · от '+esc(x.community_name):'')+'</div><div class="actions">'+(x.is_owner?'<span class="btn secondary">Вы организатор</span>':x.status==="scheduled"?'<button class="btn '+(x.am_attending?"secondary":"")+'" onclick="toggleAttendance()">'+(x.am_attending?"✓ Участвую":"＋ Участвовать")+'</button>':'<span class="btn secondary">'+esc(x.status)+'</span>')+'</div>';peopleTitle.textContent="Участники";people.innerHTML=(x.attendees||[]).map(a=>'<div class="member"><div><b>'+esc(a.nickname)+'</b> · №'+String(a.number).padStart(6,"0")+'</div></div>').join("")||'<div class="empty">Пока никто не записался.</div>';appsPanel.style.display="none";managePanel.style.display=x.is_owner?"block":"none";if(x.is_owner)manageForm.innerHTML='<input id="eTitle" maxlength="100" value="'+esc(x.title)+'"><textarea id="eDescription" maxlength="2500">'+esc(x.description||"")+'</textarea><input id="eStarts" type="datetime-local" value="'+new Date(x.starts_at).toISOString().slice(0,16)+'"><input id="eLocation" maxlength="180" value="'+esc(x.location_text||"")+'"><select id="eStatus"><option value="scheduled" '+(x.status==="scheduled"?"selected":"")+'>Запланировано</option><option value="completed" '+(x.status==="completed"?"selected":"")+'>Завершено</option><option value="cancelled" '+(x.status==="cancelled"?"selected":"")+'>Отменено</option></select><button class="btn" onclick="saveEvent()">Сохранить</button>'}
async function toggleAttendance(){const {error}=await sb.rpc("citizen_event_toggle_attendance",{p_event_id:id});if(error){alert(error.message);return}load()}
async function saveEvent(){const {error}=await sb.rpc("citizen_event_update",{p_event_id:id,p_title:eTitle.value.trim(),p_description:eDescription.value.trim(),p_starts_at:new Date(eStarts.value).toISOString(),p_location_text:eLocation.value.trim(),p_status:eStatus.value});if(error){alert(error.message);return}load()}
load();
</script></body></html>
