<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Личный кабинет — Нерия</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f7;
            color: #17171c;
            min-height: 100vh;
        }

        /* ШАПКА */

        header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e5e8;

            display: flex;
            align-items: center;

            padding: 0 6%;
        }

        .logo {
            display: flex;
            align-items: center;

            gap: 12px;

            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .flag {
            width: 32px;
            height: 42px;

            display: flex;
            flex-direction: column;

            border-radius: 3px;
            overflow: hidden;
        }

        .flag-purple {
            background: #6d3fc0;
            flex: 1;
        }

        .flag-white {
            background: #eee8ff;
            flex: 1;
        }

        .value input {
    width: 100%;
    padding: 9px 11px;

    border: 1px solid #dcdce1;
    border-radius: 6px;

    font-size: 15px;
    font-family: inherit;
}

.value input:focus {
    outline: none;
    border-color: #6d3fc0;
}

.save-profile {
    width: 100%;
    margin-top: 25px;
    padding: 14px;

    border: none;
    border-radius: 7px;

    background: #6d3fc0;
    color: white;

    font-size: 15px;
    cursor: pointer;
}

.save-profile:hover {
    opacity: 0.9;
}

.public-profile {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border: 1px solid #dcdce1;
    border-radius: 7px;
    background: white;
    color: #6d3fc0;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

.public-profile:hover {
    background: #f7f3fc;
}

.avatar-editor {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 22px;
    padding: 20px;
    background: white;
    border: 1px solid #e5e5e8;
    border-radius: 14px;
}
.avatar-preview, .avatar-fallback {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid #ded7f0;
    background: #f2eef9;
}
.avatar-preview { object-fit: cover; }
.avatar-fallback { display:flex; align-items:center; justify-content:center; color:#6d3fc0; font-size:30px; font-weight:700; }
.avatar-controls { flex:1; min-width:0; }
.avatar-controls h3 { font-size:16px; margin-bottom:6px; }
.avatar-controls p { color:#777780; font-size:12px; line-height:1.45; margin-bottom:12px; }
.avatar-controls input[type="file"] { width:100%; font-size:12px; margin-bottom:10px; }
.avatar-buttons { display:flex; gap:8px; flex-wrap:wrap; }
.avatar-button { border:none; border-radius:7px; padding:10px 13px; font-size:12px; font-weight:600; cursor:pointer; }
.avatar-button-primary { background:#6d3fc0; color:white; }
.avatar-button-secondary { background:#fff; color:#55555d; border:1px solid #dcdce1; }

.nickname-color-editor {
    margin-top: 22px;
    padding: 20px;
    background: white;
    border: 1px solid #e5e5e8;
    border-radius: 14px;
}
.nickname-color-editor h3 { font-size:16px; margin-bottom:6px; }
.nickname-color-editor p { color:#777780; font-size:12px; line-height:1.45; margin-bottom:14px; }
.nickname-color-preview { font-size:21px; font-weight:700; margin-bottom:14px; }
.nickname-color-palette { display:flex; gap:9px; flex-wrap:wrap; }
.nickname-color-swatch { width:34px; height:34px; border-radius:50%; border:2px solid white; box-shadow:0 0 0 1px #d7d7dc; cursor:pointer; }
.nickname-color-swatch:hover { transform:scale(1.08); }
.nickname-color-swatch.active { box-shadow:0 0 0 3px #17171c; }
        
        /* ОСНОВА */

        main {
            max-width: 980px;

            margin: 0 auto;

            padding: 70px 25px 100px;
        }

        .back {
            display: inline-block;

            margin-bottom: 30px;

            color: #6d3fc0;

            text-decoration: none;

            font-size: 14px;
        }

        .title {
            text-align: center;

            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 38px;

            margin-bottom: 12px;
        }

        .title p {
            color: #777780;

            font-size: 16px;
            line-height: 1.5;
        }

        /* КАРТОЧКА */

        .profile-card {
            background: transparent;
        }

        .status {
            text-align: center;

            padding: 14px;

            margin-bottom: 30px;

            background: #f7f3fc;

            border-left: 3px solid #6d3fc0;

            color: #55555d;

            font-size: 14px;
        }

        .citizen-id {
            text-align: center;
            margin-bottom: 24px;
            padding: 32px;
            background: linear-gradient(135deg, #ffffff 0%, #f7f3fc 100%);
            border: 1px solid #e5e5e8;
            border-radius: 16px;
        }

        .citizen-id-label {
            color: #888891;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .citizen-id-number {
            font-size: 42px;

            font-weight: 700;

            letter-spacing: 2px;

            color: #6d3fc0;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(300px, .85fr);
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid #e5e5e8;
            border-radius: 14px;
            padding: 26px;
        }

        .panel-title {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .panel-description {
            color: #777780;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .data {
            border-top: 1px solid #e5e5e8;
        }

        .account-panel {
            margin-top: 22px;
        }

        .privacy {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        .row {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 17px 0;

            border-bottom: 1px solid #e5e5e8;
        }

        .label {
            color: #777780;

            font-size: 14px;
        }

        .value {
            font-size: 15px;

            font-weight: 600;

            text-align: right;
        }

        .actions {
            margin-top: 30px;
        }

        .logout {
            width: 100%;

            padding: 14px;

            border: 1px solid #dcdce1;

            border-radius: 7px;

            background: white;

            color: #55555d;

            font-size: 15px;

            cursor: pointer;
        }

        .logout:hover {
            background: #f5f5f7;
        }

        .error {
            background: #fff3f3;

            border-left: 3px solid #c43d3d;

            padding: 15px;

            color: #7a2929;

            font-size: 14px;

            line-height: 1.5;
        }
.privacy h2 {
    font-size: 20px;
    margin-bottom: 8px;
}

.privacy-description {
    color: #777780;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.privacy-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    cursor: pointer;
    font-size: 15px;
}

.privacy-option input {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.save-privacy {
    width: 100%;
    margin-top: 15px;
    padding: 14px;

    border: none;
    border-radius: 7px;

    background: #6d3fc0;
    color: white;

    font-size: 15px;
    cursor: pointer;
}

.save-privacy:hover {
    opacity: 0.9;
}
        /* МОБИЛЬНАЯ ВЕРСИЯ */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            main {
                padding-top: 45px;
            }

            .title h1 {
                font-size: 32px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .citizen-id {
                padding: 26px 20px;
            }

            .panel {
                padding: 22px 20px;
            }

            .row {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .value {
                text-align: left;
            }

            .citizen-id-number {
                font-size: 36px;
            }

        }
        
.logo {
    text-decoration: none;
    color: inherit;
}
        
    </style>

<header class="neria-global-header"><a href="index.html" class="neria-global-logo"><span class="neria-global-flag" aria-label="Флаг Нерии"><span class="p"></span><span class="w"></span><span class="p"></span></span>НЕРИЯ</a><nav class="neria-global-nav"><a href="profile.html">Личный кабинет</a><a href="citizens.html">Граждане Нерии</a><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="market.html">Объявления</a><a href="chat.html">Общий чат</a><a href="laws.html">Законы</a><a href="notifications.html" class="neria-notification-link">🔔 <span class="neria-notification-text">Уведомления</span><span class="neria-notification-count" style="display:none">0</span></a></nav></header>


<main>

    <a class="back" href="index.html">
        ← Вернуться на главную
    </a>


    <div class="title">

        <h1>
            Личный кабинет
        </h1>

        <p>
            Профиль гражданина Нерии
        </p>

    </div>


    <div class="profile-card" id="profileCard">

        <div class="status">
            Загрузка профиля...
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://rictvznkxkeygbrlcymn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    async function loadProfile() {

        const profileCard =
            document.getElementById("profileCard");


        /* Проверяем авторизацию */

        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

            profileCard.innerHTML = `
                <div class="error">
                    Не удалось проверить авторизацию.
                    <br><br>
                    ${sessionError.message}
                </div>
            `;

            return;
        }


        if (!session) {

            profileCard.innerHTML = `
                <div class="error">
                    Вы не вошли в аккаунт Нерии.

                    <br><br>

                    Сначала войдите через Telegram.

                    <br><br>

                    <a href="registration.html">
                        Перейти к регистрации
                    </a>
                </div>
            `;

            return;
        }


        /* Проверяем статус гражданства */

        const {
            data: citizenshipStatus,
            error: statusError
        } = await supabaseClient.rpc(
            "get_my_citizenship_status"
        );


        if (statusError) {

            console.error(
                "Ошибка проверки статуса гражданства:",
                statusError
            );

            profileCard.innerHTML = `
                <div class="error">
                    Не удалось проверить статус гражданства.

                    <br><br>

                    Ошибка: ${escapeHtml(statusError.message)}
                </div>
            `;

            return;
        }


        if (!citizenshipStatus) {

            profileCard.innerHTML = `
                <div class="error">
                    У этого аккаунта нет гражданства Нерии.

                    <br><br>

                    <a href="registration.html">
                        Перейти к регистрации
                    </a>
                </div>
            `;

            return;
        }


        if (citizenshipStatus === "banned") {

            profileCard.innerHTML = `
                <div class="error">
                    Доступ к Нерии для этого аккаунта заблокирован.

                    <br><br>

                    Гражданство и гражданский ID сохранены,
                    но доступ к государственным сервисам ограничен.
                </div>
            `;

            return;
        }


        if (citizenshipStatus === "revoked") {

            profileCard.innerHTML = `
                <div class="error">
                    Ваше гражданство Нерии отозвано.

                    <br><br>

                    Ваша историческая запись и гражданский ID сохранены.
                    Восстановить гражданство может администрация Нерии.
                </div>
            `;

            return;
        }


        if (citizenshipStatus === "resigned") {

            profileCard.innerHTML = `
                <div class="error">
                    Вы отказались от гражданства Нерии.

                    <br><br>

                    Ваша историческая запись и гражданский ID сохранены.
                </div>
            `;

            return;
        }


        if (citizenshipStatus !== "active") {

            profileCard.innerHTML = `
                <div class="error">
                    Неизвестный статус гражданства:
                    ${escapeHtml(citizenshipStatus)}
                </div>
            `;

            return;
        }


        /* Загружаем профиль */

        const {
            data,
            error
        } = await supabaseClient

            .from("citizens")

            .select(`
                id,
                citizen_number,
                nickname,
                first_name,
                surname,
                birth_day,
                birth_month,
                birth_year,
                show_first_name,
                show_surname,
                show_birth_date,
                telegram_username,
                avatar_path,
                avatar_updated_at,
                can_upload_avatar,
                nickname_color
            `)

            .eq("user_id", session.user.id)

            .single();


        if (error) {

            console.error(error);

            profileCard.innerHTML = `
                <div class="error">
                    Не удалось загрузить профиль.

                    <br><br>

                    Возможно, этот аккаунт ещё
                    не зарегистрирован как гражданин.

                    <br><br>

                    Ошибка: ${error.message}
                </div>
            `;

            return;
        }


        /* Формируем ID */

        const citizenId =
            String(data.citizen_number).padStart(6, "0");


        /* Формируем дату рождения */

        const months = [
            "",
            "января",
            "февраля",
            "марта",
            "апреля",
            "мая",
            "июня",
            "июля",
            "августа",
            "сентября",
            "октября",
            "ноября",
            "декабря"
        ];


        let birthDate =
            `${data.birth_day} ${months[data.birth_month]}`;


        if (data.birth_year) {

            birthDate +=
                ` ${data.birth_year} года`;

        }


        /* Показываем профиль */

        profileCard.innerHTML = `

            <div class="status">

                Гражданин Нерии

            </div>


            <div class="citizen-id">

                <div class="citizen-id-label">
                    Гражданский ID
                </div>

                <div class="citizen-id-number">
                    ${citizenId}
                </div>

                <a
                    class="public-profile"
                    href="citizen.html?id=${encodeURIComponent(citizenId)}"
                >
                    Открыть публичный профиль
                </a>

                <a
                    class="public-profile"
                    href="wallet.html"
                >
                    💰 Открыть кошелёк NR
                </a>

            </div>


            <div class="avatar-editor">
                ${
                    data.avatar_path
                        ? `<img class="avatar-preview" src="${escapeAttribute(getAvatarUrl(data.avatar_path, data.avatar_updated_at))}" alt="Аватар">`
                        : `<div class="avatar-fallback">${escapeHtml((data.nickname || "?").charAt(0).toUpperCase())}</div>`
                }

                <div class="avatar-controls">
                    <h3>Аватар профиля</h3>

                    ${
                        data.can_upload_avatar
                            ? `
                                <p>VIP-возможность активна. Фото автоматически уменьшается до 1024×1024 и сжимается в WebP с высоким качеством.</p>
                                <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp">
                                <div class="avatar-buttons">
                                    <button type="button" class="avatar-button avatar-button-primary" onclick="uploadAvatar()">Загрузить аватар</button>
                                    ${data.avatar_path ? `<button type="button" class="avatar-button avatar-button-secondary" onclick="removeAvatar()">Удалить аватар</button>` : ""}
                                </div>
                              `
                            : `
                                <p>Загрузка собственного аватара доступна только гражданам, которым администрация выдала VIP-доступ.</p>
                              `
                    }
                </div>
            </div>

            ${data.can_upload_avatar ? `
            <div class="nickname-color-editor">
                <h3>Цвет ника</h3>
                <p>VIP-возможность. Выберите цвет, который будет виден в реестре и публичном профиле.</p>
                <div class="nickname-color-preview" style="color: ${getNicknameColor(data.nickname_color)}">
                    ${escapeHtml(data.nickname)}
                </div>
                <div class="nickname-color-palette">
                    ${buildNicknameColorPalette(data.nickname_color)}
                </div>
            </div>
            ` : ""}


            <div class="dashboard-grid">

                <section class="panel">

                    <h2 class="panel-title">Основные данные</h2>

                    <p class="panel-description">
                        Эти данные относятся к вашему гражданскому профилю.
                    </p>

                    <div class="data">

                        <div class="row">
                            <div class="label">Ник</div>
                            <div class="value">
                                <input
                                    type="text"
                                    id="editNickname"
                                    value="${escapeAttribute(data.nickname || "")}"
                                    maxlength="30"
                                >
                            </div>
                        </div>

                        <div class="row">
                            <div class="label">Telegram</div>
                            <div class="value">
                                <input
                                    type="text"
                                    id="editTelegramUsername"
                                    value="${escapeAttribute(data.telegram_username ? "@" + data.telegram_username.replace(/^@/, "") : "")}"
                                    placeholder="@username"
                                    maxlength="32"
                                >
                            </div>
                        </div>

                        <div class="row">
                            <div class="label">Имя</div>
                            <div class="value">
                                <input
                                    type="text"
                                    id="editFirstName"
                                    value="${escapeAttribute(data.first_name || "")}"
                                    maxlength="50"
                                >
                            </div>
                        </div>

                        <div class="row">
                            <div class="label">Фамилия</div>
                            <div class="value">
                                <input
                                    type="text"
                                    id="editSurname"
                                    value="${escapeAttribute(data.surname || "")}"
                                    maxlength="50"
                                >
                            </div>
                        </div>

                        <div class="row">
                            <div class="label">Дата рождения</div>
                            <div class="value">
                                ${escapeHtml(birthDate)}
                            </div>
                        </div>

                    </div>

                    <button
                        class="save-profile"
                        onclick="saveProfileData()"
                    >
                        Сохранить изменения
                    </button>

                </section>


                <div>

                    <section class="panel privacy">

                        <h2 class="panel-title">Приватность</h2>

                        <p class="privacy-description">
                            Выберите, какие данные будут видны другим гражданам Нерии.
                        </p>

                        <label class="privacy-option">
                            <input
                                type="checkbox"
                                id="showFirstName"
                                ${data.show_first_name ? "checked" : ""}
                            >
                            <span>Показывать имя</span>
                        </label>

                        <label class="privacy-option">
                            <input
                                type="checkbox"
                                id="showSurname"
                                ${data.show_surname ? "checked" : ""}
                            >
                            <span>Показывать фамилию</span>
                        </label>

                        <label class="privacy-option">
                            <input
                                type="checkbox"

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function escapeAttribute(value) {

        return escapeHtml(value)
            .replace(/`/g, "&#096;");
    }

    function getAvatarUrl(path, updatedAt) {
        if (!path) return "";

        const { data } =
            supabaseClient.storage
                .from("avatars")
                .getPublicUrl(path);

        const version =
            updatedAt
                ? new Date(updatedAt).getTime()
                : Date.now();

        return data.publicUrl + "?v=" + version;
    }

    async function compressAvatar(file) {
        const image = await createImageBitmap(file);
        const maxSide = 1024;

        const scale = Math.min(
            1,
            maxSide / Math.max(image.width, image.height)
        );

        const width = Math.max(
            1,
            Math.round(image.width * scale)
        );

        const height = Math.max(
            1,
            Math.round(image.height * scale)
        );

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", {
            alpha: false
        });

        ctx.drawImage(image, 0, 0, width, height);
        image.close();

        const blob = await new Promise((resolve) => {
            canvas.toBlob(
                resolve,
                "image/webp",
                0.88
            );
        });

        if (!blob) {
            throw new Error(
                "Браузер не смог обработать изображение."
            );
        }

        return blob;
    }


    async function uploadAvatar() {
        const input = document.getElementById("avatarFile");
        const file = input?.files?.[0];

        if (!file) {
            alert("Сначала выберите изображение.");
            return;
        }

        const allowed = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if (!allowed.includes(file.type)) {
            alert("Разрешены только JPG, PNG и WebP.");
            return;
        }

        if (file.size > 12 * 1024 * 1024) {
            alert(
                "Исходный файл слишком большой. Максимум — 12 МБ."
            );
            return;
        }

        let compressedFile;

        try {
            compressedFile =
                await compressAvatar(file);
        } catch (error) {
            console.error(error);
            alert(
                "Не удалось обработать изображение: " +
                error.message
            );
            return;
        }

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            alert("Сессия не найдена.");
            return;
        }

        const avatarPath =
            session.user.id + "/avatar";

        const { error: uploadError } =
            await supabaseClient.storage
                .from("avatars")
                .upload(
                    avatarPath,
                    compressedFile,
                    {
                        upsert: true,
                        contentType: "image/webp",
                        cacheControl: "86400"
                    }
                );

        if (uploadError) {
            console.error(uploadError);
            alert(
                "Не удалось загрузить аватар: " +
                uploadError.message
            );
            return;
        }

        const { error: saveError } =
            await supabaseClient.rpc(
                "update_my_avatar_path",
                {
                    p_avatar_path: avatarPath
                }
            );

        if (saveError) {
            console.error(saveError);
            alert(
                "Не удалось сохранить аватар в профиле: " +
                saveError.message
            );
            return;
        }

        alert(
            "Аватар обновлён. После обработки он занимает " +
            Math.max(
                1,
                Math.round(compressedFile.size / 1024)
            ) +
            " КБ."
        );

        loadProfile();
    }


    async function removeAvatar() {
        if (!confirm("Удалить текущий аватар?")) return;
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;
        const avatarPath = session.user.id + "/avatar";
        const { error: deleteError } = await supabaseClient.storage.from("avatars").remove([avatarPath]);

        if (saveError) { console.error(saveError); alert("Не удалось обновить профиль: " + saveError.message); return; }
        loadProfile();
    }
