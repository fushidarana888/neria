<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Личный кабинет — Нерия</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f7;
            color: #17171c;
            min-height: 100vh;
        }

        /* ШАПКА */

        header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e5e8;

            display: flex;
            align-items: center;

            padding: 0 6%;
        }

        .logo {
            display: flex;
            align-items: center;

            gap: 12px;

            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .flag {
            width: 32px;
            height: 42px;

            display: flex;
            flex-direction: column;

            border-radius: 3px;
            overflow: hidden;
        }

        .flag-purple {
            background: #6d3fc0;
            flex: 1;
        }

        .flag-white {
            background: white;
            flex: 1;
        }

        /* ОСНОВА */

        main {
            max-width: 650px;

            margin: 0 auto;

            padding: 70px 25px 100px;
        }

        .back {
            display: inline-block;

            margin-bottom: 30px;

            color: #6d3fc0;

            text-decoration: none;

            font-size: 14px;
        }

        .title {
            text-align: center;

            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 38px;

            margin-bottom: 12px;
        }

        .title p {
            color: #777780;

            font-size: 16px;
            line-height: 1.5;
        }

        /* КАРТОЧКА */

        .profile-card {
            background: white;

            border: 1px solid #e5e5e8;

            border-radius: 14px;

            padding: 35px;
        }

        .status {
            text-align: center;

            padding: 14px;

            margin-bottom: 30px;

            background: #f7f3fc;

            border-left: 3px solid #6d3fc0;

            color: #55555d;

            font-size: 14px;
        }

        .citizen-id {
            text-align: center;

            margin-bottom: 35px;
        }

        .citizen-id-label {
            color: #888891;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .citizen-id-number {
            font-size: 42px;

            font-weight: 700;

            letter-spacing: 2px;

            color: #6d3fc0;
        }

        .data {
            border-top: 1px solid #e5e5e8;
        }

        .row {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 17px 0;

            border-bottom: 1px solid #e5e5e8;
        }

        .label {
            color: #777780;

            font-size: 14px;
        }

        .value {
            font-size: 15px;

            font-weight: 600;

            text-align: right;
        }

        .actions {
            margin-top: 30px;
        }

        .logout {
            width: 100%;

            padding: 14px;

            border: 1px solid #dcdce1;

            border-radius: 7px;

            background: white;

            color: #55555d;

            font-size: 15px;

            cursor: pointer;
        }

        .logout:hover {
            background: #f5f5f7;
        }

        .error {
            background: #fff3f3;

            border-left: 3px solid #c43d3d;

            padding: 15px;

            color: #7a2929;

            font-size: 14px;

            line-height: 1.5;
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            main {
                padding-top: 45px;
            }

            .title h1 {
                font-size: 32px;
            }

            .profile-card {
                padding: 25px 20px;
            }

            .row {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .value {
                text-align: left;
            }

            .citizen-id-number {
                font-size: 36px;
            }

        }

    </style>
</head>


<body>

<header>

    <div class="logo">

        <div class="flag">
            <div class="flag-purple"></div>
            <div class="flag-white"></div>
            <div class="flag-purple"></div>
        </div>

        НЕРИЯ

    </div>

</header>


<main>

    <a class="back" href="index.html">
        ← Вернуться на главную
    </a>


    <div class="title">

        <h1>
            Личный кабинет
        </h1>

        <p>
            Профиль гражданина Нерии
        </p>

    </div>


    <div class="profile-card" id="profileCard">

        <div class="status">
            Загрузка профиля...
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://rictvznkxkeygbrlcymn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    async function loadProfile() {

        const profileCard =
            document.getElementById("profileCard");


        /* Проверяем авторизацию */

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

            profileCard.innerHTML = `

                <div class="error">

                    Вы не вошли в аккаунт Нерии.

                    <br><br>

                    Сначала войдите через Telegram.

                    <br><br>

                    <a href="registration.html">
                        Перейти к регистрации
                    </a>

                </div>

            `;

            return;
        }


        /* Загружаем профиль */

        const {
            data,
            error
        } = await supabaseClient

            .from("citizens")

            .select(`
                id,
                nickname,
                first_name,
                surname,
                birth_day,
                birth_month,
                birth_year
            `)

            .eq("user_id", session.user.id)

            .single();


        if (error) {

            console.error(error);

            profileCard.innerHTML = `

                <div class="error">

                    Не удалось загрузить профиль.

                    <br><br>

                    Возможно, этот аккаунт ещё
                    не зарегистрирован как гражданин.

                    <br><br>

                    Ошибка: ${error.message}

                </div>

            `;

            return;
        }


        /* Формируем ID */

        const citizenId =
            String(data.id).padStart(6, "0");


        /* Формируем дату рождения */

        const months = [

            "",
            "января",
            "февраля",
            "марта",
            "апреля",
            "мая",
            "июня",
            "июля",
            "августа",
            "сентября",
            "октября",
            "ноября",
            "декабря"

        ];


        let birthDate =
            `${data.birth_day} ${months[data.birth_month]}`;


        if (data.birth_year) {

            birthDate +=
                ` ${data.birth_year} года`;

        }


        /* Показываем профиль */

        profileCard.innerHTML = `

            <div class="status">

                🇳🇪 Гражданин Нерии

            </div>


            <div class="citizen-id">

                <div class="citizen-id-label">
                    Гражданский ID
                </div>

                <div class="citizen-id-number">
                    ${citizenId}
                </div>

            </div>


            <div class="data">

                <div class="row">

                    <div class="label">
                        Ник
                    </div>

                    <div class="value">
                        ${data.nickname}
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Имя
                    </div>

                    <div class="value">

                        ${data.first_name || "Не указано"}

                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Фамилия
                    </div>

                    <div class="value">

                        ${data.surname || "Не указано"}

                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Дата рождения
                    </div>

                    <div class="value">

                        ${birthDate}

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="logout"
                    onclick="logout()"
                >
                    Выйти из аккаунта
                </button>

            </div>

        `;

    }


    async function logout() {

        const { error } =
            await supabaseClient.auth.signOut({
                scope: "local"
            });


        if (error) {

            alert(
                "Ошибка выхода: " +
                error.message
            );

            return;

        }


        window.location.href =
            "registration.html";

    }


    loadProfile();

</script>


</body>

</html>
