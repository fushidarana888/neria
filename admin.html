    <style>

<script>
    const SUPABASE_URL =
        "https://rictvznkxkeygbrlcymn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    const adminContent =
        document.getElementById("adminContent");

    let citizens = [];
    let governmentRoles = {
        is_founder: false,
        economy_minister: false,
        mvd: false
    };


    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatCitizenNumber(value) {
        return String(value).padStart(6, "0");
    }


    function formatDate(value) {
        if (!value) return "—";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleString("ru-RU");
    }


    function formatBirthDate(citizen) {
        if (!citizen.birth_day || !citizen.birth_month) {
            return "—";
        }

        let result =
            String(citizen.birth_day).padStart(2, "0") +
            "." +
            String(citizen.birth_month).padStart(2, "0");

        if (citizen.birth_year) {
            result += "." + citizen.birth_year;
        }

        return result;
    }


    function statusLabel(status) {

        switch (status) {

            case "active":
                return {
                    text: "АКТИВЕН",
                    className: "status-active"
                };

            case "banned":
                return {
                    text: "ЗАБЛОКИРОВАН",
                    className: "status-banned"
                };

            case "revoked":
                return {
                    text: "ГРАЖДАНСТВО ОТОЗВАНО",
                    className: "status-revoked"
                };

            case "resigned":
                return {
                    text: "ОТКАЗАЛСЯ ОТ ГРАЖДАНСТВА",
                    className: "status-resigned"
                };

            default:
                return {
                    text: status || "НЕИЗВЕСТНО",
                    className: "status-unknown"
                };
        }
    }


    async function initAdmin() {

        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
            showFatalError(
                "Не удалось проверить авторизацию: " +
                sessionError.message
            );
            return;
        }

        if (!session) {
            adminContent.innerHTML = `
                <div class="error">
                    Вы не вошли в аккаунт Нерии.
                    <br><br>
                    <a href="registration.html">
                        Войти через Telegram
                    </a>
                </div>
            `;
            return;
        }


        const {
            data: roleData,
            error: roleError
        } = await supabaseClient.rpc("get_my_government_roles");

        if (roleError) {
            showFatalError(
                "Не удалось проверить государственные полномочия: " +
                roleError.message
            );
            return;
        }

        governmentRoles = roleData?.[0] || governmentRoles;

        if (
            !governmentRoles.is_founder &&
            !governmentRoles.economy_minister &&
            !governmentRoles.mvd
        ) {
            adminContent.innerHTML = `
                <div class="error">
                    Доступ запрещён.
                    <br><br>
                    У вашего аккаунта нет государственных административных полномочий.
                </div>
            `;
            return;
        }

        const titleEl = document.querySelector(".title h1");
        const descEl = document.querySelector(".title p");
        const historyLinkRow = document.querySelectorAll(".title p")[1];
        const badgeEl = document.querySelector(".header-badge");

        if (historyLinkRow) {
            historyLinkRow.style.display =
                governmentRoles.is_founder ? "" : "none";
        }

        if (governmentRoles.is_founder) {
            if (titleEl) titleEl.textContent = "Панель Основателя";
            if (descEl) descEl.textContent = "Полное управление государством Нерия.";
            if (badgeEl) badgeEl.textContent = "ОСНОВАТЕЛЬ";
        } else if (governmentRoles.economy_minister && !governmentRoles.mvd) {
            if (titleEl) titleEl.textContent = "Министерство экономики";
            if (descEl) descEl.textContent = "Казна, NR, государственные выплаты и экономические споры.";
            if (badgeEl) badgeEl.textContent = "МИНИСТР ЭКОНОМИКИ";
        } else if (governmentRoles.mvd && !governmentRoles.economy_minister) {
            if (titleEl) titleEl.textContent = "Панель МВД";
            if (descEl) descEl.textContent = "Гражданство, блокировки и государственный учёт граждан.";
            if (badgeEl) badgeEl.textContent = "МВД";
        } else {
            if (titleEl) titleEl.textContent = "Государственная панель";
            if (badgeEl) badgeEl.textContent = "ГОСУДАРСТВО";
        }

    }

    async function publishStateAnnouncement() {
        const title = document.getElementById("stateAnnouncementTitle")?.value?.trim();
        const description = document.getElementById("stateAnnouncementDescription")?.value?.trim();
        const rawPrice = document.getElementById("stateAnnouncementPrice")?.value?.trim();
        const price = rawPrice ? Number(rawPrice) : null;
        if (!title || title.length < 3) { alert("Укажите заголовок объявления."); return; }
        if (!description || description.length < 3) { alert("Укажите текст объявления."); return; }
        if (price !== null && (!Number.isSafeInteger(price) || price <= 0)) { alert("Цена должна быть положительным целым числом NR."); return; }
        const { error } = await supabaseClient.rpc("founder_create_state_market_announcement",{p_title:title,p_description:description,p_price:price});
        if (error) { alert("Не удалось опубликовать объявление:\n" + friendlyError(error)); return; }
        document.getElementById("stateAnnouncementTitle").value="";
        document.getElementById("stateAnnouncementDescription").value="";
        document.getElementById("stateAnnouncementPrice").value="";
        await loadStateAnnouncementAdminList();
        alert("Государственное объявление опубликовано.");
    }

        if (error) {
            el.innerHTML =

                escapeHtml(friendlyError(error)) +
                '</div>';

        if (!rows.length) {
            el.innerHTML = '<div class="muted">Открытых объявлений нет.</div>';
            return;
        }

        el.innerHTML = rows.map(item => {
            const responses = Array.isArray(item.responses) ? item.responses : [];
            const responseHtml = responses.length
                ? '<div style="margin-top:10px"><strong>Отклики и сообщения:</strong>' +
                  responses.map(r =>
                    '<div class="dispute-reason" style="margin-top:8px">' +
                        '<strong>' + escapeHtml(r.responder_nickname || "Гражданин") +
                        ' · #' + String(r.responder_number || "").padStart(6,"0") + '</strong>' +

                    '</div>'

                  '</div>'

            return '<div class="deal-admin-card">' +
                '<div class="deal-admin-title">' +
                    escapeHtml(item.title) +
                    ' · ' +
                    (item.listing_type === "offer" ? "Предлагаю" : "Ищу") +
                    ' · ' +
                    (item.price
                        ? new Intl.NumberFormat("ru-RU").format(Number(item.price)) + " NR"

                '</div>' +
                '<div class="deal-admin-meta">' +
                    'Автор: ' + escapeHtml(item.author_nickname) +

                responseHtml +
            '</div>';
        }).join("");
    }

    async function reviewCitizenshipApplication(applicationId, approve) {
        let reason = null;

        if (!approve) {
            reason = prompt("Причина отклонения заявки:");
            if (reason === null) return;
            if (!reason.trim()) {
                alert("Укажите причину отклонения.");
                return;
            }
        } else {
            reason = prompt("Комментарий к одобрению (необязательно):", "");
            if (reason === null) return;
        }

        if (!confirm(approve ? "Одобрить заявку и выдать гражданство?" : "Отклонить заявку?")) return;

        const { error } = await supabaseClient.rpc(
            "review_citizenship_application",
            {
                p_application_id: applicationId,
                p_approve: approve,
                p_reason: reason?.trim() || null
            }
        );

        if (error) {
            alert("Не удалось обработать заявку:\n" + friendlyError(error));
            return;
        }

        await Promise.all([
            loadCitizenshipApplicationsPanel(),
            loadCitizens()
        ]);
    }

    async function muteChatCitizen() {
        const citizenId = Number(document.getElementById("chatMuteCitizen")?.value);
        const duration = Number(document.getElementById("chatMuteDuration")?.value);
        const unit = document.getElementById("chatMuteUnit")?.value;
        const reason = document.getElementById("chatMuteReason")?.value?.trim();

        if (!Number.isSafeInteger(citizenId) || citizenId <= 0) {
            alert("Выберите гражданина.");
            return;
        }
        if (!Number.isSafeInteger(duration) || duration <= 0) {
            alert("Укажите положительный срок мута.");
            return;
        }
        if (!reason) {
            alert("Укажите причину мута.");
            return;
        }

        const multiplier = unit === "days" ? 1440 : unit === "hours" ? 60 : 1;
        const minutes = duration * multiplier;
        if (!Number.isSafeInteger(minutes)) {
            alert("Слишком большой срок.");
            return;
        }

        if (!confirm("Выдать мут в общем чате на " + duration + " " +
            (unit === "days" ? "дн." : unit === "hours" ? "ч." : "мин.") + "?")) return;

        const {error} = await supabaseClient.rpc(
            "chat_mute_citizen",
            {
                p_citizen_id: citizenId,
                p_minutes: minutes,
                p_reason: reason
            }
        );

        if (error) {
            alert("Не удалось выдать мут:\n" + friendlyError(error));
            return;
        }

        document.getElementById("chatMuteDuration").value = "";
        document.getElementById("chatMuteReason").value = "";
        await loadChatModeration();
    }

        }

        await loadChatModeration();
    }

    async function resolveMarketDispute(disputeId,toPayee,total) {
        const resolution=prompt(
            "Комментарий к решению спора:",
            toPayee===total
                ? "Средства полностью переданы получателю"
                : "Средства полностью возвращены плательщику"
        );

        if(resolution===null)return;
        if(!resolution.trim()){
            alert("Укажите комментарий к решению.");

        }

        if(!confirm(
            "Подтвердить решение?\n\nПолучателю: "+
            new Intl.NumberFormat("ru-RU").format(toPayee)+" NR\n"+
            "Плательщику: "+
            new Intl.NumberFormat("ru-RU").format(total-toPayee)+" NR"
        ))return;

        const {error}=await supabaseClient.rpc(
            "market_resolve_dispute",
            {
                p_dispute_id:disputeId,
                p_to_payee:toPayee,
                p_resolution:resolution.trim()
            }
        );

        if(error){
            console.error(error);
            alert("Не удалось разрешить спор:\n"+friendlyError(error));
            return;
        }

        await loadMarketDisputes();
    }

    async function splitMarketDispute(disputeId,total) {
        const raw=prompt(
            "Сколько NR передать получателю? Остаток вернётся плательщику.",
            String(Math.floor(total/2))
        );

        if(raw===null)return;

        const amount=Number(raw.trim());

        if(!Number.isSafeInteger(amount)||amount<0||amount>total){
            alert("Введите целое число от 0 до "+total+".");
            return;
        }

        await resolveMarketDispute(
            disputeId,
            amount,
            total
        );
    }


    function renderRewardRecipients() {
        const list=document.getElementById("rewardRecipientList");
        if(!list)return;

        const active=citizens.filter(c=>c.citizenship_status==="active");

        if(active.length===0){
            list.innerHTML='<span class="muted">Нет активных граждан.</span>';
            updateRewardCount();
            return;
        }

        list.innerHTML=active.map(c=>{
            return '<label class="reward-person">'+
                '<input type="checkbox" class="reward-recipient" value="'+Number(c.internal_id)+'" onchange="updateRewardCount()">'+
                '<span>'+escapeHtml(c.nickname||"Без ника")+' · '+escapeHtml(formatCitizenNumber(c.citizen_number))+'</span>'+
            '</label>';
        }).join("");

        updateRewardCount();
    }

    function updateRewardCount(){

    function toggleAllRewardRecipients(checked){

    async function payBulkReward(){
        const ids=[...document.querySelectorAll(".reward-recipient:checked")]
            .map(el=>Number(el.value))
            .filter(Number.isSafeInteger);

        const amount=Number(document.getElementById("rewardAmount")?.value);
        const reason=document.getElementById("rewardReason")?.value?.trim();

        if(ids.length===0){alert("Выберите хотя бы одного гражданина.");return;}
        if(!Number.isSafeInteger(amount)||amount<=0){alert("Введите положительное целое количество NR каждому.");return;}
        if(!reason){alert("Укажите причину выплаты.");return;}

        const total=amount*ids.length;
        if(!Number.isSafeInteger(total)){alert("Слишком большая сумма.");return;}

        if(!confirm(
            "Выплатить "+new Intl.NumberFormat("ru-RU").format(amount)+" NR каждому из "+
            ids.length+" граждан?\n\nВсего из казны будет списано: "+
            new Intl.NumberFormat("ru-RU").format(total)+" NR."
        ))return;

        const {data,error}=await supabaseClient.rpc(
            "admin_bulk_treasury_reward",
            {p_citizen_ids:ids,p_amount_each:amount,p_reason:reason}
        );

        if(error){
            console.error(error);
            let message=friendlyError(error);
            if(message.includes("Insufficient treasury balance"))message="В казне недостаточно NR для этой выплаты.";
            alert("Не удалось выплатить награду:\n"+message);
            return;
        }

        document.getElementById("rewardAmount").value="";
        document.getElementById("rewardReason").value="";
        toggleAllRewardRecipients(false);
        await loadCitizens();

        const result=data?.[0];
        alert(
            "Награда выплачена.\nПолучателей: "+(result?.recipients_count||ids.length)+
            "\nВсего выплачено: "+new Intl.NumberFormat("ru-RU").format(Number(result?.total_amount||total))+" NR."
        );
    }

    async function changeCitizenNumber(
        internalId,
        currentNumber
    ) {

        const input =
            prompt(
                "Новый гражданский ID:",
                String(currentNumber)
                    .padStart(6, "0")
            );

        if (input === null) return;


        const normalized =
            input.trim().replace(/^0+/, "") || "0";

        const newNumber =
            Number(normalized);


        if (
            !Number.isInteger(newNumber) ||
            newNumber <= 0
        ) {
            alert(
                "Введите положительное целое число."
            );
            return;
        }


        if (
            newNumber === Number(currentNumber)
        ) {
            return;
        }


        const confirmed =
            confirm(
                "Изменить гражданский ID на " +
                String(newNumber).padStart(6, "0") +
                "?"
            );

        if (!confirmed) return;


        const { error } =
            await supabaseClient.rpc(
                "admin_change_citizen_number",
                {
                    p_citizen_id: internalId,
                    p_new_number: newNumber
                }
            );


        if (error) {

            console.error(error);

            alert(
                "Не удалось изменить ID:\n" +
                friendlyError(error)
            );

            return;
        }


        await loadCitizens();
    }

<script id="neria-action-guard">
(function(){
 const guarded=[
  "createListing(","removeListing(","accept(","respondToRequest(","acceptResponse(","rejectResponse(","done(","dispute(",
  "sendMessage(","markDone(","openDispute(","selfResolveDispute(",
  "publishStateAnnouncement(","deleteStateAnnouncement(","setGovernmentRole(","resolveMarketDispute(","splitMarketDispute(",
  "payBulkReward(","burnFromTreasury(","burnFromCitizen(","mintToTreasury(","mintToCitizen(",
  "setAvatarPermission(","changeCitizenNumber(","banCitizen(","unbanCitizen(","revokeCitizenship(","restoreCitizenship("
 ];
 document.addEventListener("click",function(e){
   const btn=e.target.closest("button");
   if(!btn || btn.disabled) return;
   const code=btn.getAttribute("onclick")||"";
   if(!guarded.some(x=>code.includes(x))) return;
   if(btn.dataset.actionBusy==="1"){
     e.preventDefault(); e.stopImmediatePropagation(); return;
   }
   btn.dataset.actionBusy="1";
   const original=btn.textContent;
   const shouldLabel=!code.includes("setFilter(");
   if(shouldLabel) btn.textContent="Выполняется…";
   btn.disabled=true;
   setTimeout(()=>{
     btn.disabled=false;
     delete btn.dataset.actionBusy;
     if(shouldLabel) btn.textContent=original;
   },2500);
 },true);
})();
</script>
