<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Государственная панель — Нерия</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f7;
            color: #17171c;
            min-height: 100vh;
        }

        header {
            min-height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 6%;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            color: inherit;
        }

        .flag {
            width: 32px;
            height: 42px;
            display: flex;
            flex-direction: column;
            border-radius: 3px;
            overflow: hidden;
        }

        .flag-purple {
            background: #6d3fc0;
            flex: 1;
        }

        .flag-white {
            background: #eee8ff;
            flex: 1;
        }

        .header-badge {
            padding: 7px 11px;
            background: #f7f3fc;
            color: #6d3fc0;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 55px 25px 100px;
        }

        .back {
            display: inline-block;
            margin-bottom: 28px;
            color: #6d3fc0;
            text-decoration: none;
            font-size: 14px;
        }

        .title {
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .title p {
            color: #777780;
            font-size: 16px;
            line-height: 1.5;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #e5e5e8;
            border-radius: 14px;
            overflow: hidden;
        }

        .money-panel {
            margin-bottom: 22px;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #e5e5e8;
            border-radius: 14px;
        }

        .money-panel h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .money-panel p {
            color: #777780;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .money-form {
            display: grid;
            grid-template-columns: 180px 1fr auto;
            gap: 10px;
        }

        .money-form input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dcdce1;
            border-radius: 7px;
            font: inherit;
            font-size: 13px;
        }

        .reward-panel {
            margin-bottom: 22px;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #ded7f0;
            border-radius: 14px;
        }

        .reward-panel h2 { font-size: 20px; margin-bottom: 8px; }
        .reward-panel > p { color:#777780; font-size:13px; line-height:1.5; margin-bottom:16px; }
        .reward-controls { display:grid; grid-template-columns:160px 1fr auto; gap:10px; margin-bottom:16px; }
        .reward-controls input { width:100%; padding:11px 12px; border:1px solid #dcdce1; border-radius:7px; font:inherit; font-size:13px; }
        .reward-list { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-height:250px; overflow:auto; padding:4px; }
        .reward-person { display:flex; gap:9px; align-items:center; padding:10px; border:1px solid #ececf0; border-radius:8px; font-size:13px; cursor:pointer; }
        .reward-person input { accent-color:#6d3fc0; }
        .reward-actions { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
        .reward-count { color:#777780; font-size:13px; }

        .dispute-panel {
            margin-bottom: 22px;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #ead7a4;
            border-radius: 14px;
        }

        .dispute-panel h2 { font-size:20px; margin-bottom:8px; }
        .dispute-panel > p { color:#777780; font-size:13px; line-height:1.5; margin-bottom:14px; }
        .dispute-card { padding:16px 0; border-top:1px solid #eeeeF1; }
        .deal-admin-card { padding:14px 0; border-top:1px solid #eeeeF1; }
        .deal-admin-card:first-child { border-top:none; }
        .deal-admin-title { font-weight:700; margin-bottom:5px; }
        .deal-admin-meta { color:#777780; font-size:12px; line-height:1.5; margin-bottom:9px; }
        .dispute-card:first-child { border-top:none; }
        .dispute-title { font-weight:700; margin-bottom:6px; }
        .dispute-meta { color:#777780; font-size:12px; margin:5px 0; line-height:1.5; }
        .dispute-reason { background:#fff8e8; border-radius:8px; padding:11px; font-size:13px; line-height:1.5; margin:10px 0; }
        .dispute-actions { display:flex; gap:8px; flex-wrap:wrap; }

        .money-form input:focus {
            outline: none;
            border-color: #6d3fc0;
        }

        .primary {
            background: #6d3fc0;
            color: #ffffff;
        }

        .toolbar {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e5e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-info {
            color: #777780;
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .secondary {
            background: #ffffff;
            color: #333333;
            border: 1px solid #dcdce1;
        }

        .danger {
            background: #fff0f0;
            color: #a92f2f;
            border: 1px solid #efcaca;
        }

        .warning {
            background: #fff8e8;
            color: #8a641a;
            border: 1px solid #ead7a4;
        }

        .success {
            background: #eef9f1;
            color: #27763a;
            border: 1px solid #c9e6d0;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1180px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #eeeeF1;
            vertical-align: middle;
        }

        th {
            background: #f8f8fa;
            color: #777780;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .citizen-number {
            font-family: monospace;
            color: #6d3fc0;
            font-weight: 700;
        }

        .nickname {
            font-weight: 700;
        }

        .muted {
            color: #888891;
        }

        .status {
            display: inline-block;
            border-radius: 999px;
            padding: 6px 9px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-active {
            background: #eef9f1;
            color: #27763a;
        }

        .status-banned {
            background: #fff0f0;
            color: #a92f2f;
        }

        .status-revoked {
            background: #fff8e8;
            color: #8a641a;
        }

        .status-resigned {
            background: #f0f0f3;
            color: #64646d;
        }

        .status-unknown {
            background: #f0f0f3;
            color: #64646d;
        }

        .reason {
            display: block;
            margin-top: 5px;
            max-width: 260px;
            color: #8b6a6a;
            font-size: 12px;
            line-height: 1.35;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .message {
            padding: 22px;
            line-height: 1.6;
        }

        .error {
            background: #fff3f3;
            border: 1px solid #f0caca;
            color: #8f3030;
            border-radius: 10px;
            padding: 18px;
            line-height: 1.5;
        }

        .loading,
        .empty {
            padding: 45px 25px;
            text-align: center;
            color: #777780;
        }

        @media (max-width: 700px) {
            .money-form {
                grid-template-columns: 1fr;
            }

            .reward-controls, .reward-list {
                grid-template-columns: 1fr;
            }

            header {
                padding: 14px 20px;
            }

            main {
                padding: 40px 15px 80px;
            }

            .title h1 {
                font-size: 31px;
            }
        }
    </style>
<style id="neria-global-header-style">

<body>

<header class="neria-global-header"><a href="index.html" class="neria-global-logo"><span class="neria-global-flag" aria-label="Флаг Нерии"><span class="p"></span><span class="w"></span><span class="p"></span></span>НЕРИЯ</a><nav class="neria-global-nav"><a href="profile.html">Личный кабинет</a><a href="citizens.html">Граждане Нерии</a><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="market.html">Объявления</a><a href="laws.html">Законы</a></nav></header>

<main>

    <a class="back" href="index.html">← Вернуться на главную</a>

    <div class="title">
        <h1>Государственная панель</h1>
        <p>Загрузка государственных полномочий...</p>
        <p style="margin-top:10px;">
            <a href="admin-history.html" style="color:#6d3fc0;text-decoration:none;font-weight:600;">
                Открыть историю административных действий →
            </a>
        </p>
    </div>

    <div id="adminContent">
        <div class="panel">
            <div class="loading">Проверяем государственные полномочия...</div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://rictvznkxkeygbrlcymn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    const adminContent =
        document.getElementById("adminContent");

    let citizens = [];
    let governmentRoles = {
        is_founder: false,
        economy_minister: false,
        mvd: false
    };


    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatCitizenNumber(value) {
        return String(value).padStart(6, "0");
    }


    function formatDate(value) {
        if (!value) return "—";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleString("ru-RU");
    }


    function formatBirthDate(citizen) {
        if (!citizen.birth_day || !citizen.birth_month) {
            return "—";
        }

        let result =
            String(citizen.birth_day).padStart(2, "0") +
            "." +
            String(citizen.birth_month).padStart(2, "0");

        if (citizen.birth_year) {
            result += "." + citizen.birth_year;
        }

        return result;
    }


    function statusLabel(status) {

        switch (status) {

            case "active":
                return {
                    text: "АКТИВЕН",
                    className: "status-active"
                };

            case "banned":
                return {
                    text: "ЗАБЛОКИРОВАН",
                    className: "status-banned"
                };

            case "revoked":
                return {
                    text: "ГРАЖДАНСТВО ОТОЗВАНО",
                    className: "status-revoked"
                };

            case "resigned":
                return {
                    text: "ОТКАЗАЛСЯ ОТ ГРАЖДАНСТВА",
                    className: "status-resigned"
                };

            default:
                return {
                    text: status || "НЕИЗВЕСТНО",
                    className: "status-unknown"
                };
        }
    }


    async function initAdmin() {

        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
            showFatalError(
                "Не удалось проверить авторизацию: " +
                sessionError.message
            );
            return;
        }

        if (!session) {
            adminContent.innerHTML = `
                <div class="error">
                    Вы не вошли в аккаунт Нерии.
                    <br><br>
                    <a href="registration.html">
                        Войти через Telegram
                    </a>
                </div>
            `;
            return;
        }


        const {
            data: roleData,
            error: roleError
        } = await supabaseClient.rpc("get_my_government_roles");

        if (roleError) {
            showFatalError(
                "Не удалось проверить государственные полномочия: " +
                roleError.message
            );
            return;
        }

        governmentRoles = roleData?.[0] || governmentRoles;

        if (
            !governmentRoles.is_founder &&
            !governmentRoles.economy_minister &&
            !governmentRoles.mvd
        ) {
            adminContent.innerHTML = `
                <div class="error">
                    Доступ запрещён.
                    <br><br>
                    У вашего аккаунта нет государственных административных полномочий.
                </div>
            `;
            return;
        }

        const titleEl = document.querySelector(".title h1");
        const descEl = document.querySelector(".title p");
        const historyLinkRow = document.querySelectorAll(".title p")[1];
        const badgeEl = document.querySelector(".header-badge");

        if (historyLinkRow) {
            historyLinkRow.style.display =
                governmentRoles.is_founder ? "" : "none";
        }

        if (governmentRoles.is_founder) {
            if (titleEl) titleEl.textContent = "Панель Основателя";
            if (descEl) descEl.textContent = "Полное управление государством Нерия.";
            if (badgeEl) badgeEl.textContent = "ОСНОВАТЕЛЬ";
        } else if (governmentRoles.economy_minister && !governmentRoles.mvd) {
            if (titleEl) titleEl.textContent = "Министерство экономики";
            if (descEl) descEl.textContent = "Казна, NR, государственные выплаты и экономические споры.";
            if (badgeEl) badgeEl.textContent = "МИНИСТР ЭКОНОМИКИ";
        } else if (governmentRoles.mvd && !governmentRoles.economy_minister) {
            if (titleEl) titleEl.textContent = "Панель МВД";
            if (descEl) descEl.textContent = "Гражданство, блокировки и государственный учёт граждан.";
            if (badgeEl) badgeEl.textContent = "МВД";
        } else {
            if (titleEl) titleEl.textContent = "Государственная панель";
            if (badgeEl) badgeEl.textContent = "ГОСУДАРСТВО";
        }

        renderShell();

        const jobs = [loadCitizens()];

        if (governmentRoles.economy_minister) {
            jobs.push(loadMarketDisputes());
            jobs.push(loadActiveMarketDeals());
        }

        if (governmentRoles.is_founder) {
            jobs.push(loadGovernmentRoles());
            jobs.push(loadAllMarketDeals());
        }

        await Promise.all(jobs);
    }


    function renderShell() {

        const economyHtml = governmentRoles.economy_minister ? `
            <div class="money-panel">
                <h2>Экономика NR</h2>
                <p>
                    Эмиссия в государственную казну увеличивает общее количество NR в системе.
                    Прямое начисление гражданину используется отдельно и также создаёт новые NR.
                </p>

                <div class="money-form">
                    <input type="number" id="treasuryMintAmount" min="1" step="1" placeholder="Сумма NR">
                    <input type="text" id="treasuryMintReason" maxlength="250" placeholder="Причина, например: плановое пополнение казны">
                    <button type="button" class="primary" onclick="mintToTreasury()">Пополнить казну</button>
                    <button type="button" class="danger" onclick="burnFromTreasury()">Удалить NR из казны</button>
                </div>
            </div>

            <div class="reward-panel">
                <h2>Массовая награда из казны</h2>
                <p>
                    Выберите участников мероприятия. Каждому будет выплачена одинаковая сумма
                    из существующего баланса государственной казны.
                </p>

                <div class="reward-controls">
                    <input type="number" id="rewardAmount" min="1" step="1" placeholder="NR каждому">
                    <input type="text" id="rewardReason" maxlength="250" placeholder="Причина, например: награда за мероприятие">
                    <button type="button" class="secondary" onclick="toggleAllRewardRecipients(true)">Выбрать всех</button>
                </div>

                <div class="reward-list" id="rewardRecipientList">
                    <span class="muted">Список появится после загрузки граждан.</span>
                </div>

                <div class="reward-actions">
                    <button type="button" class="primary" onclick="payBulkReward()">Выплатить награду</button>
                    <button type="button" class="secondary" onclick="toggleAllRewardRecipients(false)">Снять выбор</button>
                    <span class="reward-count" id="rewardCount">Выбрано: 0</span>
                </div>
            </div>

            <div class="dispute-panel">
                <h2>Активные сделки</h2>
                <p>
                    Все текущие сделки без спора. Здесь можно открыть сделку и прочитать переписку.
                </p>
                <div id="activeMarketDeals">
                    <div class="loading">Загрузка активных сделок...</div>
                </div>
            </div>

            <div class="dispute-panel">
                <h2>Споры по сделкам</h2>
                <p>
                    Здесь находятся сделки, по которым одна из сторон открыла спор.
                    Средства остаются в удержании до решения.
                </p>
                <div id="marketDisputes">
                    <div class="loading">Загрузка споров...</div>
                </div>
            </div>
        ` : "";

        const allDealsHtml = governmentRoles.is_founder ? `
            <div class="dispute-panel">
                <h2>Все сделки граждан</h2>
                <p>
                    Полный журнал сделок Нерии: активные, спорные, завершённые и возвращённые.
                    Основатель может открыть любую сделку и прочитать её переписку.
                </p>
                <div id="allMarketDeals">
                    <div class="loading">Загрузка всех сделок...</div>
                </div>
            </div>
        ` : "";

        const rolesHtml = governmentRoles.is_founder ? `
            <div class="reward-panel">
                <h2>Государственные роли</h2>
                <p>
                    Основатель может назначать и снимать Министра экономики и сотрудников МВД.
                    Эти роли получают только свои административные полномочия.
                </p>
                <div id="governmentRoleList">
                    <div class="loading">Загрузка ролей...</div>
                </div>
            </div>
        ` : "";

        adminContent.innerHTML = `
            ${rolesHtml}
            ${allDealsHtml}
            ${economyHtml}

            <div class="panel">
                <div class="toolbar">
                    <div class="toolbar-info" id="citizenSummary">
                        Загружаем граждан...
                    </div>
                    <button type="button" class="secondary" onclick="loadCitizens()">Обновить</button>
                </div>

                <div id="citizenList">
                    <div class="loading">
                        Загрузка списка граждан...
                    </div>
                </div>
            </div>
        `;
    }


    async function loadAllMarketDeals() {
        const el = document.getElementById("allMarketDeals");
        if (!el) return;

        el.innerHTML = '<div class="loading">Загрузка всех сделок...</div>';

        const { data, error } =
            await supabaseClient.rpc("founder_get_all_market_deals");

        if (error) {
            console.error(error);
            el.innerHTML =
                '<div class="error">Не удалось загрузить сделки.<br><br>' +
                escapeHtml(error.message) +
                '</div>';
            return;
        }

        const deals = data || [];

        if (!deals.length) {
            el.innerHTML = '<div class="muted">Сделок пока нет.</div>';
            return;
        }

        const statusNames = {
            active: "Активна",
            dispute: "Спор",
            completed: "Завершена",
            refunded: "Возврат"
        };

        el.innerHTML = deals.map(d => {
            return '<div class="deal-admin-card">' +
                '<div class="deal-admin-title">' +
                    escapeHtml(d.title) + ' · ' +
                    new Intl.NumberFormat("ru-RU").format(Number(d.amount)) +
                    ' NR · ' +
                    escapeHtml(statusNames[d.status] || d.status) +
                '</div>' +

                        onclick="banCitizen(${id})"

                        type="button"

                `;
        }
    }

    async function resolveMarketDispute(disputeId,toPayee,total) {
        const resolution=prompt(
            "Комментарий к решению спора:",
            toPayee===total
                ? "Средства полностью переданы получателю"
                : "Средства полностью возвращены плательщику"
        );

        if(resolution===null)return;
        if(!resolution.trim()){
            alert("Укажите комментарий к решению.");
            return;
        }

        if(!confirm(
            "Подтвердить решение?\n\nПолучателю: "+
            new Intl.NumberFormat("ru-RU").format(toPayee)+" NR\n"+
            "Плательщику: "+
            new Intl.NumberFormat("ru-RU").format(total-toPayee)+" NR"
        ))return;

        const {error}=await supabaseClient.rpc(
            "market_resolve_dispute",
            {
                p_dispute_id:disputeId,
                p_to_payee:toPayee,
                p_resolution:resolution.trim()
            }
        );

        if(error){
            console.error(error);
            alert("Не удалось разрешить спор:\n"+error.message);
            return;
        }

        await loadMarketDisputes();
    }

    async function splitMarketDispute(disputeId,total) {
        const raw=prompt(
            "Сколько NR передать получателю? Остаток вернётся плательщику.",
            String(Math.floor(total/2))
        );

        if(raw===null)return;

        const amount=Number(raw.trim());

        if(!Number.isSafeInteger(amount)||amount<0||amount>total){
            alert("Введите целое число от 0 до "+total+".");
            return;
        }

        await resolveMarketDispute(
            disputeId,
            amount,
            total
        );
    }

    async function payBulkReward(){
        const ids=[...document.querySelectorAll(".reward-recipient:checked")]
            .map(el=>Number(el.value))
            .filter(Number.isSafeInteger);

        const amount=Number(document.getElementById("rewardAmount")?.value);
        const reason=document.getElementById("rewardReason")?.value?.trim();

        if(ids.length===0){alert("Выберите хотя бы одного гражданина.");return;}
        if(!Number.isSafeInteger(amount)||amount<=0){alert("Введите положительное целое количество NR каждому.");return;}
        if(!reason){alert("Укажите причину выплаты.");return;}

        const total=amount*ids.length;
        if(!Number.isSafeInteger(total)){alert("Слишком большая сумма.");return;}

        if(!confirm(
            "Выплатить "+new Intl.NumberFormat("ru-RU").format(amount)+" NR каждому из "+
            ids.length+" граждан?\n\nВсего из казны будет списано: "+
            new Intl.NumberFormat("ru-RU").format(total)+" NR."
        ))return;

        const {data,error}=await supabaseClient.rpc(
            "admin_bulk_treasury_reward",
            {p_citizen_ids:ids,p_amount_each:amount,p_reason:reason}
        );

        if(error){
            console.error(error);
            let message=error.message;
            if(message.includes("Insufficient treasury balance"))message="В казне недостаточно NR для этой выплаты.";
            alert("Не удалось выплатить награду:\n"+message);
            return;
        }

        document.getElementById("rewardAmount").value="";
        document.getElementById("rewardReason").value="";
        toggleAllRewardRecipients(false);
        await loadCitizens();

        const result=data?.[0];
        alert(
            "Награда выплачена.\nПолучателей: "+(result?.recipients_count||ids.length)+
            "\nВсего выплачено: "+new Intl.NumberFormat("ru-RU").format(Number(result?.total_amount||total))+" NR."
        );
    }

            "admin_set_avatar_permission",
            {
                p_citizen_id: internalId,
                p_enabled: enabled
            }
        );

        if (error) {
            console.error(error);
            alert("Не удалось изменить VIP-доступ:\n" + error.message);
            return;
        }

        await loadCitizens();
    }


    function getCitizen(internalId) {

        return citizens.find(
            c =>
                Number(c.internal_id) ===
                Number(internalId)
        );
    }


    async function changeCitizenNumber(
        internalId,
        currentNumber
    ) {

        const input =
            prompt(
                "Новый гражданский ID:",
                String(currentNumber)
                    .padStart(6, "0")
            );

        if (input === null) return;


        const normalized =
            input.trim().replace(/^0+/, "") || "0";

        const newNumber =
            Number(normalized);


        if (
            !Number.isInteger(newNumber) ||
            newNumber <= 0
        ) {
            alert(
                "Введите положительное целое число."
            );
            return;
        }


        if (
            newNumber === Number(currentNumber)
        ) {
            return;
        }


        const confirmed =
            confirm(
                "Изменить гражданский ID на " +
                String(newNumber).padStart(6, "0") +
                "?"
            );

        if (!confirmed) return;


        const { error } =
            await supabaseClient.rpc(
                "admin_change_citizen_number",
                {
                    p_citizen_id: internalId,
                    p_new_number: newNumber
                }
            );


        if (error) {

            console.error(error);

            alert(
                "Не удалось изменить ID:\n" +
                error.message
            );

            return;
        }


        await loadCitizens();
    }


    async function banCitizen(internalId) {

        const citizen =
            getCitizen(internalId);

        if (!citizen) return;


        const reason =
            prompt(
                "Причина блокировки гражданина " +
                formatCitizenNumber(
                    citizen.citizen_number
                ) +
                " (" +
                citizen.nickname +
                "):"
            );


        if (reason === null) return;


        if (!reason.trim()) {
            alert(
                "Укажите причину блокировки."
            );
            return;
        }


        if (
            !confirm(
                "Заблокировать гражданина " +
                formatCitizenNumber(
                    citizen.citizen_number
                ) +
                "?"
            )
        ) {
            return;
        }


        const { error } =
            await supabaseClient.rpc(
                "admin_ban_citizen",
                {

                    p_reason: reason.trim()

            );


        if (error) {

            console.error(error);

            alert(
                "Не удалось заблокировать гражданина:\n" +
                error.message

            return;
        }


        await loadCitizens();
    }
