<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пока вас не было — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;font-family:Arial,sans-serif;color:#17171c}main{max-width:920px;margin:auto;padding:44px 18px 90px}.hero h1{font-size:40px;margin:0 0 8px}.lead{color:#707079;line-height:1.55}.summary,.controls,.item{background:#fff;border:1px solid #e4e4e8;border-radius:14px;padding:17px;margin:11px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8f8fa;border-radius:10px;padding:12px}.stat strong{display:block;font-size:24px}.stat span{font-size:11px;color:#777}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls select,.controls button{padding:9px 11px;border-radius:8px;font:inherit}.controls select{border:1px solid #ddd;background:#fff}.controls button{border:0;background:#6d3fc0;color:#fff;font-weight:800;cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.chip.on{border-color:#6d3fc0;background:#f7f3fc;color:#6d3fc0}.item{display:block;text-decoration:none;color:inherit;transition:.15s}.item:hover{border-color:#cbb9e8;transform:translateY(-1px)}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.kind{font-size:10px;font-weight:800;color:#6d3fc0}.important{color:#9a6500}.time{font-size:11px;color:#8a8a92}.item h3{margin:7px 0;font-size:18px}.item p{line-height:1.5;color:#666;margin:0}.open{margin-top:10px;color:#6d3fc0;font-weight:800;font-size:12px}.empty{background:#fff;border:1px dashed #d1d1d7;border-radius:14px;padding:32px;text-align:center;color:#777}@media(max-width:650px){main{padding:30px 11px 70px}.hero h1{font-size:32px}.summary{grid-template-columns:1fr}.controls{align-items:stretch}.controls select,.controls button{width:100%}}
</style></head><body><main><section class="hero"><h1>✨ Пока вас не было</h1><p class="lead" id="lead">Собираю главное из жизни Нерии: Газету, проекты и ваши сообщества, события, конкурсы, общественные обсуждения и заметные публикации Площади.</p></section><section class="summary"><div class="stat"><strong id="total">—</strong><span>событий в сводке</span></div><div class="stat"><strong id="important">—</strong><span>важных для вас</span></div><div class="stat"><strong id="sinceText">—</strong><span>период сводки</span></div></section><div class="controls"><label for="range"><b>Период:</b></label><select id="range" onchange="rangeChanged()"><option value="last">С последнего просмотра</option><option value="1">Последние сутки</option><option value="3">Последние 3 дня</option><option value="7">Последние 7 дней</option><option value="30">Последние 30 дней</option></select><button onclick="loadFeed()">Обновить</button></div><div class="chips"><button class="chip on" onclick="setFilter('all',this)">Всё</button><button class="chip" onclick="setFilter('important',this)">⭐ Важное</button><button class="chip" onclick="setFilter('newspaper',this)">📰 Газета</button><button class="chip" onclick="setFilter('community',this)">🏠 Мои сообщества</button><button class="chip" onclick="setFilter('discussion',this)">🗳️ Обсуждения</button></div><div id="list"><div class="empty">Загрузка сводки…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");let meta=null,rows=[],filter="all",firstLoad=true;const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const kindLabel=k=>({newspaper:"📰 ГАЗЕТА",newspaper_mention:"📰 ВАС УПОМЯНУЛИ",project:"🛠️ ПРОЕКТ",community:"🏠 ВАШЕ СООБЩЕСТВО",event:"📅 СОБЫТИЕ",contest:"🏆 КОНКУРС",discussion:"🗳️ ОБСУЖДЕНИЕ",discussion_result:"📊 ИТОГИ",square:"🏙️ ПЛОЩАДЬ"}[k]||"НЕРИЯ");
function setFilter(f,b){filter=f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));render()}
function currentSince(){if(range.value==="last")return meta?.default_since||null;return new Date(Date.now()-Number(range.value)*86400000).toISOString()}
function rangeChanged(){loadFeed(false)}
function relevant(x){if(filter==="all")return true;if(filter==="important")return Number(x.priority||0)>=3;if(filter==="newspaper")return String(x.kind).startsWith("newspaper");if(filter==="community")return x.kind==="community";if(filter==="discussion")return String(x.kind).startsWith("discussion");return true}
function render(){const arr=rows.filter(relevant);total.textContent=rows.length;important.textContent=rows.filter(x=>Number(x.priority||0)>=3).length;const since=currentSince();sinceText.textContent=since?new Date(since).toLocaleDateString("ru-RU"):"7 дней";list.innerHTML=arr.length?arr.map(x=>'<a class="item" href="'+esc(x.link||"#")+'"><div class="top"><span class="kind '+(Number(x.priority||0)>=4?"important":"")+'">'+kindLabel(x.kind)+'</span><span class="time">'+new Date(x.at).toLocaleString("ru-RU")+'</span></div><h3>'+esc(x.title)+'</h3>'+(x.body?'<p>'+esc(x.body)+'</p>':'')+'<div class="open">Открыть →</div></a>').join(""):'<div class="empty">За выбранный период в этой категории ничего важного не произошло.</div>'}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data,error}=await sb.rpc("while_away_meta");if(error){list.innerHTML='<div class="empty">Не удалось открыть сводку.</div>';return}meta=data||{};if(!meta.last_opened_at){range.value="7";lead.textContent="Это ваша первая сводка, поэтому показываю главное за последние 7 дней."}else{lead.textContent="Показываю события с вашего прошлого просмотра этой сводки — "+new Date(meta.last_opened_at).toLocaleString("ru-RU")+"."}await loadFeed(true)}
async function loadFeed(mark){const since=currentSince();const {data,error}=await sb.rpc("while_away_feed",{p_since:since});if(error){list.innerHTML='<div class="empty">Не удалось загрузить сводку: '+esc(error.message)+'</div>';return}rows=Array.isArray(data)?data:[];render();if(mark&&meta?.now){await sb.rpc("while_away_mark_seen",{p_seen_at:meta.now});firstLoad=false}}
init();
</script></body></html>
