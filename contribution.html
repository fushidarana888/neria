<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вклад гражданина — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:1080px;margin:auto;padding:44px 18px 90px}.back{color:#6d3fc0;text-decoration:none}.hero{margin:16px 0 20px;background:linear-gradient(135deg,#6d3fc0,#8a62cb);color:#fff;border-radius:18px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:20px}.hero h1{margin:0 0 6px;font-size:34px}.hero p{margin:0;opacity:.9;line-height:1.55}.id{font-size:13px;opacity:.85}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e3e3e8;border-radius:13px;padding:15px}.stat strong{display:block;font-size:22px;color:#6d3fc0}.stat span{font-size:11px;color:#74747d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border:1px solid #e3e3e8;border-radius:15px;padding:18px}.panel.wide{grid-column:1/-1}.panel h2{margin:0 0 6px;font-size:19px}.lead{font-size:12px;color:#7a7a82;margin-bottom:12px}.item{padding:11px 0;border-top:1px solid #eee}.item:first-of-type{border-top:0}.item strong{font-size:13px}.meta{font-size:11px;color:#85858e;margin-top:4px}.desc{font-size:12px;color:#686870;line-height:1.45;margin-top:5px}.tag{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#f2ecfb;color:#6d3fc0;font-size:10px;font-weight:800}.empty{font-size:12px;color:#8a8a92;padding:10px 0}.link{color:#6d3fc0;text-decoration:none}.recognition{background:#fcfaff;border:1px solid #eee5f7;border-radius:10px;padding:10px;margin-top:8px}.recognition p{margin:4px 0 0;font-size:12px;line-height:1.45}.achievement-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.ach{border:1px solid #e8e3ee;border-radius:10px;padding:10px;background:#fcfbfe}.ach .ico{font-size:21px}.ach strong{display:block;font-size:11px;margin-top:5px}.ach small{font-size:9px;color:#8b8b93}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.panel.wide{grid-column:auto}.achievement-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{padding:30px 11px 70px}.hero{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}}
</style></head><body><main><a class="back" id="back" href="profile.html">← Профиль</a><div id="app"><div class="panel">Загрузка вклада…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
const q=new URLSearchParams(location.search),citizen=q.get("id");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=v=>v?new Date(v).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}):"—";
const role=v=>({founder:"Основатель Нерии",economy_minister:"Министр экономики",mvd:"Министр МВД",journalist:"Журналист"}[v]||v);
const projectRole=v=>v==="owner"?"Автор проекта":"Участник";
const eventRole=v=>v==="organizer"?"Организатор":"Участник";
function section(title,lead,body,wide=false){return '<section class="panel '+(wide?'wide':'')+'"><h2>'+title+'</h2><div class="lead">'+lead+'</div>'+body+'</section>'}
function items(arr,fn){return arr?.length?arr.map(fn).join(""):'<div class="empty">Пока ничего нет.</div>'}
function render(x){const c=x.citizen||{},s=x.summary||{};document.title="Вклад "+(c.nickname||"гражданина")+" — Нерия";back.href=x.is_self?"profile.html":"citizen.html?id="+encodeURIComponent(c.number);const stats=[
["🏛️",s.state_services,"работ для государства"],["📰",s.articles,"статей"],["🎨",s.creative_works,"творческих работ"],["🛠️",s.projects_created,"созданных проектов"],["📅",s.events_organized,"проведённых событий"],["💜",s.recognitions,"благодарностей"],["🏠",s.clubs_founded,"основанных клубов"],["🏢",s.organizations_founded,"основанных организаций"],["🤝",s.projects_joined,"проектов как участник"],["🎟️",s.events_attended,"событий как участник"]
];
let html='<section class="hero"><div><div class="id">Гражданин №'+String(c.number).padStart(6,"0")+'</div><h1>Вклад '+esc(c.nickname)+'</h1><p>Не рейтинг и не уровень, а фактическое портфолио того, что человек сделал в Нерии.</p></div><div class="id">Гражданство с '+esc(dt(c.member_since))+'</div></section>';
html+='<div class="summary">'+stats.map(v=>'<div class="stat"><strong>'+v[0]+' '+Number(v[1]||0)+'</strong><span>'+v[2]+'</span></div>').join("")+'</div><div class="grid">';
html+=section("🏛️ Государство","Роли и выполненная работа для Нерии.",
items(x.government?.roles,r=>'<div class="item"><strong>'+esc(role(r.role))+'</strong><div class="meta">с '+dt(r.started_at)+(r.ended_at?' по '+dt(r.ended_at):' · действует')+'</div></div>')+
items(x.government?.state_services,v=>'<div class="item"><strong>'+esc(v.title)+'</strong><div class="desc">'+esc(v.description||"")+'</div><div class="meta">Завершено '+dt(v.completed_at)+(v.paid_amount!=null?' · '+Number(v.paid_amount)+' NR':'')+'</div></div>'));
html+=section("🛠️ Проекты","Созданные проекты и участие в командах.",
items(x.projects,v=>'<div class="item"><a class="link" href="initiative.html?type=project&id='+Number(v.id)+'"><strong>'+esc(v.title)+'</strong></a><div class="desc">'+esc(v.summary||"")+'</div><div class="meta">'+projectRole(v.role)+' · '+Number(v.member_count||0)+' участников · '+esc(v.status)+'</div></div>'));
html+=section("📅 События","Организация и участие в жизни страны.",
items(x.events,v=>'<div class="item"><a class="link" href="initiative.html?type=event&id='+Number(v.id)+'"><strong>'+esc(v.title)+'</strong></a><div class="meta">'+eventRole(v.role)+' · '+dt(v.starts_at)+' · '+Number(v.attendee_count||0)+' участников</div></div>'));
html+=section("📰 Публикации","Статьи и творческий вклад.",
items(x.articles,v=>'<div class="item"><a class="link" href="newspaper.html#article-'+Number(v.id)+'"><strong>'+esc(v.title)+'</strong></a><div class="meta">'+dt(v.published_at)+'</div></div>')+
items(x.creative,v=>'<div class="item"><a class="link" href="square.html#post-'+Number(v.post_id)+'"><strong>'+esc(v.title)+'</strong></a><div class="desc">'+esc(v.description||"")+'</div><div class="meta">'+dt(v.created_at)+'</div></div>'));
html+=section("🏠 Сообщества","Клубы и организации, в которых гражданин участвует.",
items(x.communities,v=>'<div class="item"><a class="link" href="group.html?id='+Number(v.id)+'"><strong>'+esc(v.icon||"🏠")+' '+esc(v.name)+'</strong></a><div class="meta">'+(v.type==="organization"?"Организация":"Клуб")+' · '+(v.role==="owner"?"Основатель":v.role==="admin"?"Администратор":"Участник")+'</div></div>'));
html+=section("💜 Признание","Публичные благодарности других граждан.",
items(x.recognition,v=>'<div class="recognition"><strong>'+esc(v.from_nickname)+' · №'+String(v.from_number).padStart(6,"0")+'</strong><p>'+esc(v.message)+'</p><div class="meta">'+dt(v.created_at)+'</div></div>'));
html+=section("🏆 Достижения","Последние события, ставшие частью истории гражданина.",
'<div class="achievement-grid">'+(x.achievements?.length?x.achievements.map(v=>'<div class="ach"><div class="ico">'+esc(v.icon||"🏆")+'</div><strong>'+esc(v.title)+'</strong><small>'+esc(v.category||"Достижение")+' · '+dt(v.earned_at)+'</small></div>').join(""):'<div class="empty">Достижений пока нет.</div>')+'</div>',true);
html+='</div>';app.innerHTML=html}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const args={p_citizen_number:citizen?Number(citizen):null};const {data,error}=await sb.rpc("citizen_contribution_profile",args);if(error){app.innerHTML='<div class="panel">Не удалось загрузить вклад: '+esc(error.message)+'</div>';return}render(data)}
load();
</script></body></html>
