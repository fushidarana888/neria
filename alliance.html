<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предложить союз — Нерия</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f7;color:#17171c}main{max-width:720px;margin:auto;padding:55px 20px}.box{background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:27px}h1{margin-top:0}p{color:#666;line-height:1.6}input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font:inherit}textarea{min-height:120px}.btn{border:0;background:#6d3fc0;color:#fff;padding:12px 17px;border-radius:8px;font-weight:700;cursor:pointer}.back{display:inline-block;margin-bottom:20px;color:#6d3fc0;text-decoration:none}</style><style id="neria-mobile-hardening">

</style></head><body><main><a class="back" href="index.html">← На главную</a><div class="box"><h1>Предложить союз</h1><p>Представляете флуд, РП, игровой чат или другое сообщество? Оставьте предложение для Основателя Нерии.</p><input id="name" maxlength="100" placeholder="Название сообщества"><input id="type" maxlength="80" placeholder="Тип: флуд, РП, игровой чат..."><input id="contact" maxlength="200" placeholder="Контакт для связи"><textarea id="description" maxlength="2000" placeholder="Что вы предлагаете и каким видите сотрудничество"></textarea><button class="btn" id="send" onclick="submitAlliance()">Отправить Основателю</button><p id="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");async function submitAlliance(){const b=document.getElementById("send");b.disabled=true;const {data:{user}}=await sb.auth.getUser();if(!user){document.getElementById("status").textContent="Сначала войдите через Telegram и вернитесь на эту страницу.";b.disabled=false;return}const {error}=await sb.rpc("propose_alliance",{p_community_name:name.value.trim(),p_community_type:type.value.trim(),p_contact:contact.value.trim(),p_description:description.value.trim()});if(error){document.getElementById("status").textContent="Заполните все поля.";b.disabled=false;return}document.getElementById("status").textContent="Предложение отправлено Основателю Нерии.";name.value="";type.value="";contact.value="";description.value="";b.disabled=false}</script></body></html>
