</style><style id="neria-mobile-final">html,body{max-width:100%;overflow-x:hidden}img,svg,video,canvas{max-width:100%;height:auto}input,select,textarea,button{max-width:100%}@media(max-width:700px){body{min-width:0!important}main{width:100%!important;max-width:100%!important;padding-left:12px!important;padding-right:12px!important}h1{font-size:clamp(28px,9vw,38px)!important;overflow-wrap:anywhere}h2,h3,p,.muted,.lead{overflow-wrap:anywhere}.neria-unified-header{padding:10px 8px!important;gap:8px!important}.neria-unified-logo{width:100%!important;justify-content:center!important}.neria-unified-nav{width:100%!important;display:flex!important;flex-wrap:nowrap!important;justify-content:flex-start!important;gap:7px!important;overflow-x:auto!important;padding:4px 2px 8px!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}.neria-unified-nav::-webkit-scrollbar{display:none}.neria-unified-nav a{flex:0 0 auto!important;font-size:12px!important;padding:7px 8px!important}.admin-menu,.folders,.cards,.grid,.deal-grid,.market-grid,.profile-grid,.stats,.columns{grid-template-columns:1fr!important}.reward-controls,.money-form,.reward-list,.layout{grid-template-columns:1fr!important}.sidebar{max-height:300px!important}.panel,.box,.card,.section,.article,.reward-panel,.money-panel,.dispute-panel{max-width:100%!important}.actions,.reward-actions,.chat-head{flex-wrap:wrap!important}table{display:block!important;overflow-x:auto!important;white-space:nowrap}pre,code{white-space:pre-wrap!important;overflow-wrap:anywhere}}</style><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script></head><body><header class="neria-unified-header"><a class="neria-unified-logo" href="index.html"><span class="neria-unified-flag"><i></i><i></i><i></i></span>НЕРИЯ</a><nav class="neria-unified-nav"><a href="profile.html">Личный кабинет</a><a href="citizens.html">Граждане</a><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="market.html">Объявления</a><a href="chat.html">Общий чат</a><a href="newspaper.html">Газета</a><a href="community.html">Telegram</a><a href="laws.html">Законы</a><a href="notifications.html">🔔 Уведомления</a></nav></header><main><a class="back" href="newspaper.html">← Газета</a><div class="box"><h1>Редакция</h1><p>Публикация появится в газете сразу после отправки.</p><input id="title" maxlength="150" placeholder="Заголовок"><textarea id="body" maxlength="10000" placeholder="Текст статьи"></textarea><button id="publish" onclick="publish()">Опубликовать</button><p id="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data:r}=await sb.rpc("get_my_government_roles");if(!(r?.[0]?.is_founder||r?.[0]?.journalist)){document.body.innerHTML='<main><div class="box">Доступ только для Основателя и журналистов.</div></main>'}}async function publish(){const titleEl=document.getElementById("title"),bodyEl=document.getElementById("body"),statusEl=document.getElementById("status"),publishBtn=document.getElementById("publish");const t=titleEl.value.trim(),b=bodyEl.value.trim();if(!t||!b){statusEl.textContent="Заполните заголовок и текст.";return}publishBtn.disabled=true;publishBtn.textContent="Публикуем…";const {error}=await sb.rpc("newspaper_publish",{p_title:t,p_body:b});if(error){console.error(error);statusEl.textContent="Не удалось опубликовать: "+String(error.message||"ошибка");publishBtn.disabled=false;publishBtn.textContent="Опубликовать";return}location.href="newspaper.html"}init();</script></body></html>
