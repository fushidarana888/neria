<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редакция — Нерия</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f7;color:#17171c}main{max-width:760px;margin:auto;padding:50px 16px}.back{color:#6d3fc0;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e5e8;border-radius:13px;padding:24px;margin-top:22px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit;margin:7px 0}textarea{min-height:260px;resize:vertical}button{background:#6d3fc0;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}@media(max-width:600px){main{padding:30px 12px}.box{padding:16px}textarea{min-height:220px}}</style></head><body><main><a class="back" href="newspaper.html">← Газета</a><div class="box"><h1>Редакция</h1><p>Публикация появится в газете сразу после отправки.</p><input id="title" maxlength="150" placeholder="Заголовок"><textarea id="body" maxlength="10000" placeholder="Текст статьи"></textarea><button id="publish" onclick="publish()">Опубликовать</button><p id="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data:r}=await sb.rpc("get_my_government_roles");if(!(r?.[0]?.is_founder||r?.[0]?.journalist)){document.body.innerHTML='<main><div class="box">Доступ только для Основателя и журналистов.</div></main>'}}async function publish(){const t=title.value.trim(),b=body.value.trim();if(t.length<3||b.length<10){status.textContent="Заполните заголовок и текст.";return}publish.disabled=true;const {error}=await sb.rpc("newspaper_publish",{p_title:t,p_body:b});if(error){status.textContent="Не удалось опубликовать.";publish.disabled=false;return}location.href="newspaper.html"}init();</script></body></html>
