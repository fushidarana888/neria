</style></head><body><header class="neria-unified-header"><a class="neria-unified-logo" href="index.html"><span class="neria-unified-flag"><i></i><i></i><i></i></span>НЕРИЯ</a><nav class="neria-unified-nav"><a href="profile.html">Личный кабинет</a><a href="citizens.html">Граждане</a><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="market.html">Объявления</a><a href="chat.html">Общий чат</a><a href="newspaper.html">Газета</a><a href="community.html">Telegram</a><a href="laws.html">Законы</a><a href="notifications.html">🔔 Уведомления</a></nav></header><main><a class="back" href="newspaper.html">← Газета</a><div class="box"><h1>Редакция</h1><p>Публикация появится в газете сразу после отправки.</p><input id="title" maxlength="150" placeholder="Заголовок"><textarea id="body" maxlength="10000" placeholder="Текст статьи"></textarea><button id="publish" onclick="publish()">Опубликовать</button><p id="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data:r}=await sb.rpc("get_my_government_roles");if(!(r?.[0]?.is_founder||r?.[0]?.journalist)){document.body.innerHTML='<main><div class="box">Доступ только для Основателя и журналистов.</div></main>'}}async function publish(){const titleEl=document.getElementById("title"),bodyEl=document.getElementById("body"),statusEl=document.getElementById("status"),publishBtn=document.getElementById("publish");const t=titleEl.value.trim(),b=bodyEl.value.trim();if(t.length<3||b.length<10){statusEl.textContent="Заполните заголовок и текст.";return}publishBtn.disabled=true;publishBtn.textContent="Публикуем…";const {error}=await sb.rpc("newspaper_publish",{p_title:t,p_body:b});if(error){console.error(error);statusEl.textContent="Не удалось опубликовать: "+String(error.message||"ошибка");publishBtn.disabled=false;publishBtn.textContent="Опубликовать";return}location.href="newspaper.html"}init();</script></body></html>
