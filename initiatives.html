<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Инициативы — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:1080px;margin:auto;padding:44px 18px 90px}.hero h1{font-size:40px;margin:0 0 8px}.hero p{color:#74747c;line-height:1.55}.tabs{display:flex;gap:8px;margin:22px 0}.tab{border:1px solid #dddde3;background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.tab.on{border-color:#6d3fc0;background:#f7f3fc;color:#6d3fc0}.layout{display:grid;grid-template-columns:1fr 350px;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.create{background:#fff;border:1px solid #e3e3e8;border-radius:15px;padding:18px}.card{text-decoration:none;color:inherit}.card:hover{border-color:#cbb9e8}.eyebrow{font-size:10px;font-weight:800;color:#6d3fc0;letter-spacing:.7px}.card h3{margin:7px 0}.card p{font-size:13px;color:#6f6f77;line-height:1.45;min-height:38px}.meta{font-size:11px;color:#85858e;margin-top:10px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#f2ecfb;color:#6d3fc0;font-size:10px;font-weight:800;margin-top:8px}.create h2{font-size:20px;margin:0 0 5px}.create>p{font-size:12px;color:#777;line-height:1.5}.field{margin-top:10px}.field label{display:block;font-size:11px;font-weight:800;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dcdce1;border-radius:8px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{width:100%;margin-top:12px;border:0;border-radius:8px;background:#6d3fc0;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.empty{grid-column:1/-1;background:#fff;border:1px solid #e5e5e8;border-radius:13px;padding:28px;text-align:center;color:#777}@media(max-width:820px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style></head><body><main><section class="hero"><h1>Инициативы граждан</h1><p>Здесь граждане запускают собственные проекты и собирают людей на события. Это не государственные заказы и не дочерние проекты Нерии — это инициативы самих жителей.</p><p><a href="calendar.html" style="color:#6d3fc0;font-weight:800;text-decoration:none">📅 Открыть календарь ближайших событий →</a></p></section><div class="tabs"><button class="tab on" id="projectTab" onclick="setKind('project')">🛠️ Проекты</button><button class="tab" id="eventTab" onclick="setKind('event')">📅 События</button></div><div class="layout"><section class="grid" id="list"><div class="empty">Загрузка…</div></section><aside class="create"><h2 id="createTitle">Создать проект</h2><p id="createLead">Соберите команду вокруг своей идеи.</p><div class="field"><label>Название</label><input id="title" maxlength="100"></div><div class="field project-only"><label>Коротко</label><input id="summary" maxlength="220"></div><div class="field"><label>Описание</label><textarea id="description" maxlength="2500"></textarea></div><div class="field project-only"><label>Категория</label><select id="category"><option value="creative">Творчество</option><option value="media">Медиа</option><option value="community">Сообщество</option><option value="game">Игры</option><option value="education">Образование</option><option value="tech">Технологии</option><option value="other" selected>Другое</option></select></div><div class="field project-only"><label>Вступление</label><select id="joinMode"><option value="open">Свободное</option><option value="request">По заявке</option><option value="closed">Закрытое</option></select></div><div class="field event-only" style="display:none"><label>Дата и время</label><input id="startsAt" type="datetime-local"></div><div class="field event-only" style="display:none"><label>Где проходит</label><input id="locationText" maxlength="180" placeholder="Telegram, сайт, голосовой чат..."></div><div class="field"><label>От имени сообщества (необязательно)</label><select id="communityId"><option value="">Личная инициатива</option></select></div><button class="btn" id="createButton" onclick="createItem()">Создать проект</button></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");let kind="project";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>new Date(v).toLocaleString("ru-RU");
const listEl=document.getElementById("list"),projectTabEl=document.getElementById("projectTab"),eventTabEl=document.getElementById("eventTab"),createTitleEl=document.getElementById("createTitle"),createLeadEl=document.getElementById("createLead"),createButtonEl=document.getElementById("createButton"),titleEl=document.getElementById("title"),summaryEl=document.getElementById("summary"),descriptionEl=document.getElementById("description"),categoryEl=document.getElementById("category"),joinModeEl=document.getElementById("joinMode"),startsAtEl=document.getElementById("startsAt"),locationTextEl=document.getElementById("locationText"),communityIdEl=document.getElementById("communityId");
function statusLabel(x){return {recruiting:"Набирает команду",active:"В работе",completed:"Завершён",archived:"Архив",scheduled:"Запланировано",cancelled:"Отменено"}[x]||x}
function categoryLabel(x){return {creative:"Творчество",media:"Медиа",community:"Сообщество",game:"Игры",education:"Образование",tech:"Технологии",other:"Другое"}[x]||x}
function setKind(k){kind=k==="event"?"event":"project";projectTabEl.classList.toggle("on",kind==="project");eventTabEl.classList.toggle("on",kind==="event");document.querySelectorAll(".project-only").forEach(x=>x.style.display=kind==="project"?"block":"none");document.querySelectorAll(".event-only").forEach(x=>x.style.display=kind==="event"?"block":"none");createTitleEl.textContent=kind==="project"?"Создать проект":"Создать событие";createLeadEl.textContent=kind==="project"?"Соберите команду вокруг своей идеи.":"Позовите граждан на конкретную активность.";createButtonEl.textContent=kind==="project"?"Создать проект":"Создать событие";load()}
async function loadCommunities(){const {data}=await sb.rpc("community_posting_identities");const rows=Array.isArray(data)?data:[];communityIdEl.innerHTML='<option value="">Личная инициатива</option>'+rows.map(x=>'<option value="'+Number(x.id)+'">'+esc(x.icon||"🏠")+' '+esc(x.name)+'</option>').join("")}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data,error}=await sb.rpc("citizen_initiatives_list",{p_kind:kind});if(error){listEl.innerHTML='<div class="empty">Не удалось загрузить инициативы.</div>';return}const rows=Array.isArray(data)?data:[];if(kind==="project"){listEl.innerHTML=rows.length?rows.map(x=>'<a class="card" href="initiative.html?type=project&id='+Number(x.id)+'"><div class="eyebrow">'+categoryLabel(x.category).toUpperCase()+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||x.description||"Без описания")+'</p><div class="meta">'+Number(x.member_count||0)+' участников · '+esc(x.owner_nickname)+(x.community_name?' · '+esc(x.community_name):'')+'</div><span class="badge">'+esc(statusLabel(x.status))+'</span></a>').join(""):'<div class="empty">Проектов пока нет. Можно запустить первый.</div>'}else{listEl.innerHTML=rows.length?rows.map(x=>'<a class="card" href="initiative.html?type=event&id='+Number(x.id)+'"><div class="eyebrow">СОБЫТИЕ</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||"Без описания")+'</p><div class="meta">'+fmt(x.starts_at)+(x.location_text?' · '+esc(x.location_text):'')+' · '+Number(x.attendee_count||0)+' участников</div><span class="badge">'+esc(statusLabel(x.status))+'</span></a>').join(""):'<div class="empty">Событий пока нет. Можно создать первое.</div>'}}
async function createItem(){const title=titleEl.value.trim();if(!title){alert("Введите название.");titleEl.focus();return}const community=communityIdEl.value?Number(communityIdEl.value):null;if(kind==="project"){const {data,error}=await sb.rpc("citizen_project_create",{p_title:title,p_summary:summaryEl.value.trim(),p_description:descriptionEl.value.trim(),p_category:categoryEl.value,p_join_mode:joinModeEl.value,p_community_id:community});if(error){alert(error.message);return}location.href="initiative.html?type=project&id="+data}else{if(!startsAtEl.value){alert("Укажите дату и время.");return}const {data,error}=await sb.rpc("citizen_event_create",{p_title:title,p_description:descriptionEl.value.trim(),p_starts_at:new Date(startsAtEl.value).toISOString(),p_location_text:locationTextEl.value.trim(),p_community_id:community});if(error){alert(error.message);return}location.href="initiative.html?type=event&id="+data}}
loadCommunities();load();
</script></body></html>
