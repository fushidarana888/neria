<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Газета Нерии</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#17171c}
main{max-width:980px;margin:auto;padding:52px 20px 90px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:42px;margin:0 0 10px}.lead{color:#6f6f78;line-height:1.65;max-width:700px;margin:0}
.editor{display:none;background:#6d3fc0;color:#fff;text-decoration:none;padding:11px 15px;border-radius:9px;font-weight:700;font-size:13px}
.paper-list{display:grid;gap:12px}
.paper-card{width:100%;background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:21px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;cursor:pointer;transition:.18s ease;color:inherit;font:inherit}
.paper-card:hover{border-color:#cdbbe8;box-shadow:0 7px 22px rgba(30,20,45,.06);transform:translateY(-1px)}
.paper-card:focus-visible{outline:3px solid #d8c5f3;outline-offset:2px}
.paper-info{min-width:0}.paper-title{font-size:19px;font-weight:800;line-height:1.32;margin-bottom:8px;overflow-wrap:anywhere}.paper-date{font-size:12px;color:#888891}.paper-open{flex:0 0 auto;color:#6d3fc0;font-size:13px;font-weight:800}
.empty{background:#fff;border:1px dashed #d3d3d8;border-radius:14px;color:#777;text-align:center;padding:40px 22px}
.reader{display:none;background:#fff;border:1px solid #ddd6e8;border-radius:16px;overflow:hidden}
.reader.visible{display:block}.reader-top{padding:18px 22px;border-bottom:1px solid #ece8f1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:#faf8fd}
.back-list{border:0;background:transparent;color:#6d3fc0;font-weight:800;cursor:pointer;padding:5px 0;font-size:13px}
.reader-actions{display:flex;gap:8px;align-items:center}.delete-btn{display:none;border:1px solid #efcaca;background:#fff0f0;color:#a92f2f;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700}
.reader-body{padding:34px 38px 42px}.reader-date{font-size:12px;color:#888891;margin-bottom:13px}.reader-title{font-size:34px;line-height:1.2;margin:0 0 12px;overflow-wrap:anywhere}.reader-author{font-size:13px;color:#6d3fc0;font-weight:700;padding-bottom:24px;border-bottom:1px solid #eeeaf3;margin-bottom:25px}.reader-text{font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:#34343a}
@media(max-width:650px){main{padding:36px 12px 70px}h1{font-size:32px}.paper-card{padding:17px 16px}.paper-title{font-size:17px}.paper-open{font-size:0}.paper-open:after{content:'→';font-size:20px}.reader-body{padding:25px 19px 32px}.reader-title{font-size:27px}}
</style>
<link rel="stylesheet" href="site-header.css">
<script src="site-header.js" defer></script>
</head>
<body>
<main>
<section class="hero">
<div><h1>Газета Нерии</h1><p class="lead">Публикации о жизни государства. Откройте материал, чтобы прочитать его полностью.</p></div>
<a id="editorLink" class="editor" href="newspaper-editor.html">Опубликовать статью</a>
</section>

<section id="listView">
<div id="list" class="paper-list"><div class="empty">Загрузка публикаций…</div></div>
</section>

<article id="reader" class="reader" aria-live="polite">
<div class="reader-top">
<button class="back-list" type="button" onclick="closeArticle()">← Вернуться к публикациям</button>
<div class="reader-actions"><button id="deleteButton" class="delete-btn" type="button">Удалить публикацию</button></div>
</div>
<div class="reader-body">
<div id="readerDate" class="reader-date"></div>
<h2 id="readerTitle" class="reader-title"></h2>
<div id="readerAuthor" class="reader-author"></div>
<div id="readerText" class="reader-text"></div>
</div>
</article>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
let articles=[];
let currentArticle=null;
function formatDate(value){return new Date(value).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function renderList(){
 const el=document.getElementById("list");
 if(!articles.length){el.innerHTML='<div class="empty">Публикаций пока нет.</div>';return}
 el.innerHTML=articles.map(x=>'<button class="paper-card" type="button" onclick="openArticle('+Number(x.id)+')"><div class="paper-info"><div class="paper-title">'+esc(x.title)+'</div><div class="paper-date">'+esc(formatDate(x.published_at))+'</div></div><div class="paper-open">Открыть →</div></button>').join("");
}
function openArticle(id){
 const x=articles.find(a=>Number(a.id)===Number(id));
 if(!x)return;
 currentArticle=x;
 document.getElementById("readerDate").textContent=formatDate(x.published_at);
 document.getElementById("readerTitle").textContent=x.title||"Без названия";
 document.getElementById("readerAuthor").textContent="Автор: "+(x.author_nickname||"Редакция Нерии");
 document.getElementById("readerText").textContent=x.body||"";
 const del=document.getElementById("deleteButton");
 del.style.display=x.can_delete?"inline-block":"none";
 del.onclick=()=>deleteArticle(Number(x.id));
 document.getElementById("listView").style.display="none";
 document.getElementById("reader").classList.add("visible");
 history.replaceState(null,"",location.pathname+location.search+"#article-"+Number(x.id));
 window.scrollTo({top:0,behavior:"smooth"});
}
function closeArticle(){
 currentArticle=null;
 document.getElementById("reader").classList.remove("visible");
 document.getElementById("listView").style.display="block";
 history.replaceState(null,"",location.pathname+location.search);
}
async function deleteArticle(id){
 if(!confirm("Удалить эту публикацию из газеты?"))return;
 const {error}=await sb.rpc("newspaper_delete",{p_article_id:id});
 if(error){alert("Не удалось удалить публикацию.");return}
 closeArticle();
 await load();
}
async function load(){
 const {data,error}=await sb.rpc("newspaper_list",{p_limit:50});
 const el=document.getElementById("list");
 if(error){el.innerHTML='<div class="empty">Не удалось загрузить газету.</div>';return}
 articles=data||[];
 renderList();
 const match=location.hash.match(/^#article-(\d+)$/);
 if(match)openArticle(Number(match[1]));
 const {data:{user}}=await sb.auth.getUser();
 if(user){
   const {data:r}=await sb.rpc("get_my_government_roles");
   if(r?.[0]?.is_founder||r?.[0]?.journalist)document.getElementById("editorLink").style.display="inline-block";
 }
}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#article-(\d+)$/);if(m)openArticle(Number(m[1]));else if(currentArticle)closeArticle()});
load();
</script>
</body>
</html>
