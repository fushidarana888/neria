<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Газета Нерии</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f7;color:#17171c}main{max-width:980px;margin:auto;padding:44px 18px 90px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:25px}.hero h1{font-size:42px;margin:0 0 8px}.lead{color:#6f6f78;line-height:1.6;max-width:700px;margin:0}.editor{display:none;background:#6d3fc0;color:#fff;text-decoration:none;padding:11px 15px;border-radius:9px;font-weight:800;font-size:13px}.paper-list{display:grid;gap:11px}.paper-card{width:100%;background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:20px 21px;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;cursor:pointer;color:inherit;font:inherit}.paper-card:hover{border-color:#cdbbe8}.paper-title{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:7px}.paper-date{font-size:12px;color:#888}.paper-open{color:#6d3fc0;font-size:13px;font-weight:800}.empty{background:#fff;border:1px dashed #d3d3d8;border-radius:14px;color:#777;text-align:center;padding:36px 20px}.reader{display:none;background:#fff;border:1px solid #ddd6e8;border-radius:16px;overflow:hidden}.reader.visible{display:block}.reader-top{padding:16px 21px;border-bottom:1px solid #ece8f1;display:flex;justify-content:space-between;gap:10px;background:#faf8fd}.back-list{border:0;background:transparent;color:#6d3fc0;font-weight:800;cursor:pointer}.delete-btn{display:none;border:1px solid #efcaca;background:#fff0f0;color:#a92f2f;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700}.reader-body{padding:32px 36px 40px}.reader-date{font-size:12px;color:#888;margin-bottom:12px}.reader-title{font-size:34px;line-height:1.2;margin:0 0 10px}.reader-author{font-size:13px;color:#6d3fc0;font-weight:700}.mentions{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 22px;padding-bottom:20px;border-bottom:1px solid #eeeaf3}.mention{display:inline-block;text-decoration:none;color:#5d3a99;background:#f7f3fc;border:1px solid #d9c8ee;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.reader-text{font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:#34343a}@media(max-width:650px){main{padding:30px 11px 70px}.hero h1{font-size:32px}.paper-card{padding:16px}.paper-open{font-size:0}.paper-open:after{content:"→";font-size:20px}.reader-body{padding:24px 18px 31px}.reader-title{font-size:27px}}
</style></head><body><main><section class="hero"><div><h1>Газета Нерии</h1><p class="lead">Материалы о внутренней жизни страны. Журналисты могут связывать статьи с гражданами, сообществами, проектами и событиями — так Газета становится частью общей истории Нерии.</p></div><a id="editorLink" class="editor" href="newspaper-editor.html">＋ Опубликовать статью</a></section><section id="listView"><div id="list" class="paper-list"><div class="empty">Загрузка публикаций…</div></div></section><article id="reader" class="reader"><div class="reader-top"><button class="back-list" onclick="closeArticle()">← Ко всем публикациям</button><button id="deleteButton" class="delete-btn">Удалить</button></div><div class="reader-body"><div id="readerDate" class="reader-date"></div><h2 id="readerTitle" class="reader-title"></h2><div id="readerAuthor" class="reader-author"></div><div id="readerMentions" class="mentions" style="display:none"></div><div id="readerText" class="reader-text"></div></div></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");let articles=[],currentArticle=null;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const formatDate=v=>new Date(v).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
function renderList(){list.innerHTML=articles.length?articles.map(x=>'<button class="paper-card" onclick="openArticle('+Number(x.id)+')"><span><div class="paper-title">'+esc(x.title)+'</div><div class="paper-date">'+formatDate(x.published_at)+' · '+esc(x.author_nickname||"Редакция Нерии")+'</div></span><span class="paper-open">Открыть →</span></button>').join(""):'<div class="empty">Публикаций пока нет.</div>'}
async function openArticle(id){const x=articles.find(a=>Number(a.id)===Number(id));if(!x)return;currentArticle=x;readerDate.textContent=formatDate(x.published_at);readerTitle.textContent=x.title||"Без названия";readerAuthor.textContent="Автор: "+(x.author_nickname||"Редакция Нерии");readerText.textContent=x.body||"";deleteButton.style.display=x.can_delete?"inline-block":"none";deleteButton.onclick=()=>deleteArticle(Number(x.id));listView.style.display="none";reader.classList.add("visible");history.replaceState(null,"",location.pathname+location.search+"#article-"+Number(x.id));const {data}=await sb.rpc("newspaper_article_mentions",{p_article_id:Number(x.id)});const ms=Array.isArray(data)?data:[];readerMentions.style.display=ms.length?"flex":"none";readerMentions.innerHTML=ms.map(m=>'<a class="mention" href="'+esc(m.href||"#")+'">'+esc(m.label||"Связанная страница")+'</a>').join("");window.scrollTo({top:0,behavior:"smooth"})}
function closeArticle(){currentArticle=null;reader.classList.remove("visible");listView.style.display="block";history.replaceState(null,"",location.pathname+location.search);window.scrollTo({top:0,behavior:"smooth"})}
async function deleteArticle(id){if(!confirm("Удалить эту публикацию из Газеты?"))return;const {error}=await sb.rpc("newspaper_delete",{p_article_id:id});if(error){alert("Не удалось удалить публикацию.");return}closeArticle();load()}
async function load(){const {data,error}=await sb.rpc("newspaper_list",{p_limit:100});if(error){list.innerHTML='<div class="empty">Не удалось загрузить Газету.</div>';return}articles=Array.isArray(data)?data:[];renderList();const m=location.hash.match(/^#article-(\d+)$/);if(m)openArticle(Number(m[1]));const {data:{user}}=await sb.auth.getUser();if(user){const {data:r}=await sb.rpc("get_my_government_roles");if(r?.[0]?.is_founder||r?.[0]?.journalist)editorLink.style.display="inline-block"}}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#article-(\d+)$/);if(m)openArticle(Number(m[1]));else if(currentArticle)closeArticle()});load();
</script></body></html>
