tml">Объявления</a><a href="chat.html">Общий чат</a><a href="newspaper.html">Газета</a><a href="alliances.html">Союзы</a><a href="community.html">Telegram</a><a href="laws.html">Законы</a><a href="notifications.html">🔔 Уведомления</a></nav></header><main><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h1>Газета Нерии</h1><p class="lead">Новости государства, события, объявления и материалы редакции. Публиковать статьи могут Основатель и граждане с ролью журналиста.</p></div><a id="editorLink" class="editor" href="newspaper-editor.html">Опубликовать статью</a></div><div id="list"><div class="empty">Загрузка…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");async function deleteArticle(id){if(!confirm("Удалить эту публикацию из газеты?"))return;const {error}=await sb.rpc("newspaper_delete",{p_article_id:id});if(error){alert("Не удалось удалить публикацию.");return}await load()}
async function load(){const {data,error}=await sb.rpc("newspaper_list",{p_limit:50});const el=document.getElementById("list");if(error){el.innerHTML='<div class="empty">Не удалось загрузить газету.</div>';return}const rows=data||[];el.innerHTML=rows.length?rows.map(x=>'<article class="article"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(x.author_nickname)+' · '+new Date(x.published_at).toLocaleString("ru-RU")+'</div></div>'+(x.can_delete?'<button onclick="deleteArticle('+Number(x.id)+')" style="border:1px solid #efcaca;background:#fff0f0;color:#a92f2f;border-radius:7px;padding:7px 10px;cursor:pointer">Удалить</button>':'')+'</div><div class="body">'+esc(x.body)+'</div></article>').join(""):'<div class="empty">Публикаций пока нет.</div>';const {data:{user}}=await sb.auth.getUser();if(user){const {data:r}=await sb.rpc("get_my_government_roles");if(r?.[0]?.is_founder||r?.[0]?.journalist)document.getElementById("editorLink").style.display="inline-block"}}load();</script></body></html>
