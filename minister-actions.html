<body>
<header class="neria-global-header"><a href="index.html" class="neria-global-logo"><span class="neria-global-flag"><span class="p"></span><span class="w"></span><span class="p"></span></span>НЕРИЯ</a><nav class="neria-global-nav"><a href="profile.html">Личный кабинет</a><a href="citizens.html">Граждане Нерии</a><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="market.html">Объявления</a><a href="laws.html">Законы</a></nav></header>
<main>
<a class="back" href="admin.html">← Панель Основателя</a>
<h1>Действия министров</h1>
<p class="lead">Журнал действий Министра экономики и МВД. Записи создаются автоматически при выполнении административных действий.</p>
<div class="box">
<div class="filters"><button id="all" class="on" onclick="setFilter('all')">Все</button><button id="economy_minister" onclick="setFilter('economy_minister')">Министр экономики</button><button id="mvd" onclick="setFilter('mvd')">МВД</button></div>
<div id="list"><div class="empty">Загрузка…</div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
let rows=[],filter="all";
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const dt=v=>v?new Date(v).toLocaleString("ru-RU"):"—";
function setFilter(v){filter=v;["all","economy_minister","mvd"].forEach(x=>document.getElementById(x).classList.toggle("on",x===v));render()}
function render(){const list=document.getElementById("list");const data=rows.filter(x=>filter==="all"||x.role===filter);if(!data.length){list.innerHTML='<div class="empty">Записей пока нет.</div>';return}list.innerHTML=data.map(x=>'<div class="row"><div class="top"><div><div class="name">'+esc(x.minister_nickname||"Неизвестно")+' · #'+String(x.minister_number||"").padStart(6,"0")+'</div><div class="role">'+(x.role==="economy_minister"?"Министр экономики":"МВД")+'</div></div><div class="meta">'+esc(dt(x.created_at))+'</div></div><div class="action">'+esc(x.action)+'</div>'+(x.target?'<div class="meta">Объект: '+esc(x.target)+'</div>':'')+(x.details?'<div class="details">'+esc(x.details)+'</div>':'')+'</div>').join("")}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html";return}const {data,error}=await sb.rpc("founder_get_minister_actions");if(error){document.getElementById("list").innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}rows=data||[];render()}
load();
</script>
</body>
</html>
