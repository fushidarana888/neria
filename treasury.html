<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Казна Нерии</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#17171c;min-height:100vh}
header{min-height:72px;background:#fff;border-bottom:1px solid #e5e5e8;display:flex;align-items:center;justify-content:space-between;padding:14px 6%;gap:20px}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;letter-spacing:1px;text-decoration:none;color:inherit}.flag{width:32px;height:42px;display:flex;flex-direction:column;border-radius:3px;overflow:hidden}.flag-purple{background:#6d3fc0;flex:1}.flag-white{background:#eee8ff;flex:1}
nav{display:flex;gap:26px;flex-wrap:wrap}nav a{font-size:14px;color:#55555d;text-decoration:none}nav a:hover{color:#6d3fc0}
main{max-width:980px;margin:auto;padding:60px 24px 100px}.back{display:inline-block;margin-bottom:28px;color:#6d3fc0;text-decoration:none;font-size:14px}
h1{font-size:40px;margin-bottom:10px}.lead{color:#777780;line-height:1.6;margin-bottom:32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}.stat{background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:25px}.stat-label{font-size:12px;color:#777780;margin-bottom:9px}.stat-value{font-size:28px;font-weight:700}.stat-value.purple{color:#6d3fc0}
.panel{background:#fff;border:1px solid #e5e5e8;border-radius:14px;overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid #e5e5e8}.panel-head h2{font-size:19px}.history-item{display:grid;grid-template-columns:165px 1fr auto;gap:16px;padding:18px 22px;border-bottom:1px solid #eeeeF1;align-items:center}.history-item:last-child{border-bottom:none}.date{color:#888891;font-size:12px}.reason{font-size:14px;font-weight:600}.type{font-size:12px;color:#777780;margin-top:5px}.amount{font-size:15px;font-weight:700}.positive{color:#15803d}.negative{color:#b91c1c}.empty,.loading{padding:40px 22px;text-align:center;color:#777780}.error{margin:20px;background:#fff3f3;border:1px solid #f0caca;color:#8f3030;border-radius:10px;padding:17px}
@media(max-width:700px){header{padding:14px 20px;flex-wrap:wrap}.stats{grid-template-columns:1fr}.history-item{grid-template-columns:1fr;gap:7px}.amount{text-align:left}main{padding:40px 15px 75px}h1{font-size:33px}}
</style>
</head>
<body>
<header>
<a href="index.html" class="logo"><div class="flag"><div class="flag-purple"></div><div class="flag-white"></div><div class="flag-purple"></div></div>НЕРИЯ</a>
<nav><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="laws.html">Законы</a></nav>
</header>
<main>
<a class="back" href="index.html">← На главную</a>
<h1>Казна Нерии</h1>
<p class="lead">Публичная статистика внутренней валюты NR и история государственных денежных операций.</p>
<div class="stats">
<div class="stat"><div class="stat-label">Всего NR в системе</div><div class="stat-value purple" id="totalSupply">—</div></div>
<div class="stat"><div class="stat-label">В государственной казне</div><div class="stat-value" id="treasuryBalance">—</div></div>
<div class="stat"><div class="stat-label">На кошельках граждан</div><div class="stat-value" id="citizensBalance">—</div></div>
</div>
<div class="panel">
<div class="panel-head"><h2>История казны</h2></div>
<div id="history"><div class="loading">Загрузка истории...</div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rictvznkxkeygbrlcymn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

function nr(v){return new Intl.NumberFormat("ru-RU").format(Number(v||0))+" NR";}
function date(v){return new Date(v).toLocaleString("ru-RU");}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

async function loadStats(){
    const {data,error}=await supabaseClient.rpc("get_treasury_stats");
    if(error){console.error(error);return;}
    const s=data?.[0];
    if(!s)return;
    document.getElementById("totalSupply").textContent=nr(s.total_supply);
    document.getElementById("treasuryBalance").textContent=nr(s.treasury_balance);
    document.getElementById("citizensBalance").textContent=nr(s.citizens_balance);
}

async function loadHistory(){
    const el=document.getElementById("history");
    const {data,error}=await supabaseClient.rpc("get_treasury_history",{p_limit:100});
    if(error){
        console.error(error);
        el.innerHTML='<div class="error">Не удалось загрузить историю казны.</div>';
        return;
    }
    if(!data||data.length===0){
        el.innerHTML='<div class="empty">Операций казны пока не было.</div>';
        return;
    }
    el.innerHTML=data.map(item=>{
        const positive=Number(item.amount)>=0;
        return '<div class="history-item">'+
            '<div class="date">'+esc(date(item.created_at))+'</div>'+
            '<div><div class="reason">'+esc(item.reason)+'</div><div class="type">'+esc(item.operation_type)+'</div></div>'+
            '<div class="amount '+(positive?'positive':'negative')+'">'+(positive?'+':'')+esc(nr(item.amount))+'</div>'+
        '</div>';
    }).join("");
}
loadStats();
loadHistory();
</script>
</body>
</html>
