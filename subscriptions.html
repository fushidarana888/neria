<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подписки — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:46px 18px 90px}.back{color:#6d3fc0;text-decoration:none}.hero{margin:16px 0 22px}.hero h1{font-size:40px;margin:0 0 8px}.hero p{color:#73737c;line-height:1.55}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{background:#fff;border:1px solid #e2e2e7;border-radius:12px;padding:12px 14px}.pill strong{font-size:22px;color:#6d3fc0;display:block}.pill span{font-size:11px;color:#777}.section{margin-top:24px}.section h2{font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid #e3e3e8;border-radius:14px;padding:16px;text-decoration:none;color:inherit}.card:hover{border-color:#cbb9e8}.avatar{width:52px;height:52px;border-radius:50%;background:#f1ebfb;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.icon{width:52px;height:52px;border-radius:14px;background:#f1ebfb;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}.meta{font-size:11px;color:#85858e;margin-top:4px}.empty{background:#fff;border:1px solid #e3e3e8;border-radius:14px;padding:22px;color:#777}.btn{display:inline-block;margin-top:16px;padding:10px 13px;border-radius:8px;background:#6d3fc0;color:#fff;text-decoration:none;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style></head><body><main><a class="back" href="profile.html">← Личный кабинет</a><section class="hero"><h1>Подписки</h1><p>Граждане, клубы и организации, за которыми вы следите.</p></section><div class="summary" id="summary"></div><section class="section"><h2>Граждане</h2><div class="grid" id="citizens"></div></section><section class="section"><h2>Сообщества</h2><div class="grid" id="communities"></div></section><a class="btn" href="communities.html">Найти сообщества</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function avatarUrl(path,updated){if(!path)return"";const {data}=sb.storage.from("avatars").getPublicUrl(path);const v=updated?new Date(updated).getTime():"";return data.publicUrl+(v?"?v="+v:"")}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data,error}=await sb.rpc("my_subscriptions");if(error){summary.innerHTML='<div class="empty">Не удалось загрузить подписки.</div>';return}const citizensRows=data?.citizens||[],communityRows=data?.communities||[];summary.innerHTML='<div class="pill"><strong>'+Number(data?.following_count||0)+'</strong><span>всего подписок</span></div><div class="pill"><strong>'+Number(data?.followers_count||0)+'</strong><span>подписчиков у вас</span></div>';citizens.innerHTML=citizensRows.length?citizensRows.map(x=>{const u=avatarUrl(x.avatar_path,x.avatar_updated_at);return '<a class="card" href="citizen.html?id='+encodeURIComponent(String(x.number).padStart(6,"0"))+'"><div class="avatar">'+(u?'<img src="'+esc(u)+'" alt="">':esc(String(x.nickname||"?").slice(0,1).toUpperCase()))+'</div><div><strong>'+esc(x.nickname)+'</strong><div class="meta">Гражданин №'+String(x.number).padStart(6,"0")+'</div></div></a>'}).join(""):'<div class="empty">Вы пока ни на кого не подписаны.</div>';communities.innerHTML=communityRows.length?communityRows.map(x=>'<a class="card" href="group.html?id='+Number(x.id)+'"><div class="icon">'+esc(x.icon||"🏠")+'</div><div><strong>'+esc(x.name)+'</strong><div class="meta">'+(x.type==="organization"?"Организация":"Клуб")+(x.topic?" · "+esc(x.topic):"")+'</div></div></a>').join(""):'<div class="empty">Вы пока не подписаны на сообщества.</div>'}
load();
</script></body></html>
