<main><h1>Выдвинуть свою кандидатуру</h1><p class="lead">Действующий гражданин может подать заявку на должность Министра экономики, МВД или на роль журналиста. Решение принимает только Основатель.</p>
<div class="box"><div id="blockInfo"></div><div class="grid"><select id="role"><option value="economy_minister">Министр экономики</option><option value="mvd">Министр МВД</option><option value="journalist">Журналист</option></select><button class="btn" id="submitBtn" onclick="submitApp()">Подать заявку</button></div><textarea id="statement" maxlength="2000" placeholder="Почему вы хотите эту роль и чем будете полезны Нерии"></textarea><p id="status"></p></div>
<div class="box"><h2>Мои заявки</h2><div id="list">Загрузка…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const names={economy_minister:"Министр экономики",mvd:"Министр МВД",journalist:"Журналист"};
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const [{data:apps,error},{data:block}]=await Promise.all([sb.rpc("my_government_role_applications"),sb.rpc("my_action_block",{p_scope:"role_applications"})]);if(error){list.textContent="Не удалось загрузить заявки.";return}const b=block?.[0];if(b){blockInfo.innerHTML='<div class="warn">Новые заявки временно заблокированы до '+new Date(b.expires_at).toLocaleString("ru-RU")+'. Причина: '+esc(b.reason)+'</div>';submitBtn.disabled=true}else blockInfo.innerHTML="";const rows=apps||[];list.innerHTML=rows.length?rows.map(x=>'<div class="item"><div><strong>'+esc(names[x.requested_role]||x.requested_role)+'</strong> · <span class="status">'+esc(x.status==="pending"?"На рассмотрении":x.status==="accepted"?"Принята":"Отклонена")+'</span></div><div class="meta">'+new Date(x.created_at).toLocaleString("ru-RU")+'</div><div style="margin-top:8px">'+esc(x.statement)+'</div>'+(x.review_note?'<div class="meta" style="margin-top:8px">Комментарий: '+esc(x.review_note)+'</div>':'')+'<div style="margin-top:12px"><button type="button" class="btn" onclick="openRoleApplicationChat('+Number(x.application_id)+')">Переписка с Основателем</button></div></div>').join(""):'Заявок пока нет.'}
async function submitApp(){const role=document.getElementById("role").value,statementEl=document.getElementById("statement"),statusEl=document.getElementById("status"),submitBtnEl=document.getElementById("submitBtn"),text=statementEl.value.trim();if(!text){statusEl.textContent="Опишите свою кандидатуру.";return}submitBtnEl.disabled=true;const {error}=await sb.rpc("submit_government_role_application",{p_role:role,p_statement:text});if(error){const m=String(error.message||"");statusEl.textContent=m.includes("already pending")?"Такая заявка уже находится на рассмотрении.":m.includes("temporarily blocked")?"Новые заявки для вас временно заблокированы.":m.includes("Role already assigned")?"Эта роль у вас уже есть.":"Не удалось отправить заявку.";submitBtnEl.disabled=false;return}statementEl.value="";statusEl.textContent="Заявка отправлена Основателю.";await load();submitBtnEl.disabled=false}
load();</script><script src="role-application-chat.js"></script></body></html>
