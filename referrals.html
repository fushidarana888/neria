<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Реферальные ссылки — Нерия</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f7;color:#17171c}main{max-width:900px;margin:auto;padding:55px 20px}a{color:#6d3fc0}.card{background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:22px;margin-top:18px}.form{display:grid;grid-template-columns:1fr 180px 160px;gap:9px}.form input,.form select{padding:11px;border:1px solid #ddd;border-radius:8px}.btn{border:0;background:#6d3fc0;color:#fff;padding:11px 14px;border-radius:8px;font-weight:700;cursor:pointer}.row{padding:15px 0;border-bottom:1px solid #eee}.link{font-family:monospace;background:#f7f3fc;padding:8px;border-radius:7px;margin:7px 0;overflow:auto}.stats{color:#666;font-size:13px}.error{color:#a22}@media(max-width:700px){.form{grid-template-columns:1fr}}</style><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script></head><body><main><a href="profile.html">← Личный кабинет</a><h1>Реферальные ссылки Нерии</h1><p>Панель Основателя. Создавай отдельный код для каждого партнёра, флуд-чата или рекламного размещения. Система считает именно полученные гражданства, а не просто клики.</p><section class="card"><h2>Новый источник</h2><div class="form"><input id="name" placeholder="Например: Astral Express"><input id="code" placeholder="astral"><select id="type"><option value="partner">Партнёр</option><option value="alliance">Союзник</option><option value="advertising">Реклама</option><option value="personal">Личное приглашение</option></select><button class="btn" onclick="createRef()">Создать ссылку</button></div><p id="status"></p></section><section class="card"><h2>Источники и результаты</h2><div id="list">Загрузка…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const {data,error}=await sb.rpc('referral_stats');const l=document.getElementById('list');if(error){l.innerHTML='<span class="error">Нет доступа или ошибка загрузки.</span>';return}if(!data?.length){l.textContent='Источников пока нет.';return}l.innerHTML=data.map(x=>'<div class="row"><strong>'+e(x.name)+'</strong> · <code>'+e(x.code)+'</code><div class="link">'+e(x.link)+'</div><div class="stats">Получили гражданство: <strong>'+e(x.registrations)+'</strong> · заявок на рассмотрении: '+e(x.pending)+'</div><button class="btn" style="margin-top:8px" onclick="navigator.clipboard.writeText(\''+e(x.link)+'\');this.textContent=\'Скопировано ✓\'">Скопировать ссылку</button></div>').join('')}async function createRef(){const s=document.getElementById('status');const {data,error}=await sb.rpc('create_partner_referral',{p_name:document.getElementById('name').value.trim(),p_code:document.getElementById('code').value.trim(),p_source_type:document.getElementById('type').value,p_community_id:null});s.textContent=error?'Ошибка: '+error.message:'Создан код: '+data;if(!error)load()}async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='registration.html';return}load()}init();</script></body></html>
