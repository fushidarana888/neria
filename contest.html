<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конкурс — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:980px;margin:auto;padding:44px 18px 90px}.back{color:#6d3fc0;text-decoration:none}.hero,.panel{background:#fff;border:1px solid #e3e3e8;border-radius:15px;padding:20px}.hero{margin-top:16px}.hero h1{font-size:32px;margin:7px 0}.eyebrow{font-size:10px;font-weight:800;color:#6d3fc0;letter-spacing:.7px}.muted{color:#777;font-size:13px;line-height:1.5}.layout{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-top:14px}.panel h2{margin:0 0 12px}.entry{border:1px solid #e7e7eb;border-radius:12px;padding:14px;margin-top:10px}.entry.winner{border:2px solid #d3a928;background:#fffaf0}.entry h3{margin:0 0 6px;font-size:16px}.entry p{font-size:13px;color:#666;line-height:1.45;white-space:pre-wrap}.meta{font-size:11px;color:#85858e;margin-top:6px}.btn{border:0;border-radius:8px;padding:9px 12px;background:#6d3fc0;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#f2ecfb;color:#6d3fc0}.form{display:grid;gap:8px}.form select,.form input,.form textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit}.form textarea{min-height:80px}.empty{color:#888;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head><body><main><a class="back" href="contests.html">← Конкурсы</a><section class="hero" id="hero">Загрузка…</section><div class="layout"><section class="panel"><h2>Работы</h2><div id="entries"></div></section><aside><section class="panel" id="action"></section></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");const id=Number(new URLSearchParams(location.search).get("id"));let model=null;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const dt=v=>new Date(v).toLocaleString("ru-RU");const status=x=>({submissions:"Приём работ",voting:"Голосование",finished:"Завершён",cancelled:"Отменён"}[x]||x);
async function load(){const {data,error}=await sb.rpc("contest_detail",{p_contest_id:id});if(error){hero.textContent=error.message;return}model=data;render()}
function render(){const x=model;document.title=x.title+" — Конкурс Нерии";hero.innerHTML='<div class="eyebrow">'+esc(status(x.status)).toUpperCase()+'</div><h1>'+esc(x.award_icon||"🏆")+' '+esc(x.title)+'</h1><p class="muted">'+esc(x.description||"Без описания")+'</p><div class="muted">Приём работ до '+dt(x.submission_deadline)+' · голосование до '+dt(x.voting_deadline)+(Number(x.prize_nr)>0?' · приз '+Number(x.prize_nr)+' NR':'')+' · награда «'+esc(x.award_title)+'»</div>';entries.innerHTML=(x.entries||[]).length?(x.entries||[]).map(e=>'<article class="entry '+(e.is_winner?'winner':'')+'"><div class="eyebrow">'+(e.is_winner?'🏆 ПОБЕДИТЕЛЬ':'РАБОТА №'+Number(e.id))+'</div><h3>'+esc(e.nickname)+' · №'+String(e.citizen_number).padStart(6,"0")+'</h3><p>'+esc(e.note||e.content||"")+'</p><div class="meta">Голосов: '+Number(e.votes||0)+'</div><div style="margin-top:9px"><a class="btn secondary" href="square.html#post-'+Number(e.post_id)+'">Открыть публикацию</a>'+(x.status==="voting"&&!e.is_mine?'<button class="btn" style="margin-left:6px" onclick="vote('+Number(e.id)+')">'+(Number(x.my_vote_entry_id)===Number(e.id)?"✓ Ваш голос":"Голосовать")+'</button>':'')+(x.is_founder&&new Date()>=new Date(x.voting_deadline)?'<button class="btn" style="margin-left:6px" onclick="finalize('+Number(e.id)+')">Выбрать победителем</button>':'')+'</div></article>').join(""):'<div class="empty">Работ пока нет.</div>';renderAction()}
function renderAction(){const x=model;if(x.status==="submissions"&&!x.my_entry_id){const posts=x.eligible_posts||[];action.innerHTML='<h2>Подать работу</h2><div class="muted">Сначала опубликуйте работу на Площади от своего лица, затем выберите публикацию здесь.</div><div class="form" style="margin-top:12px"><select id="postId">'+(posts.length?posts.map(p=>'<option value="'+Number(p.id)+'">#'+Number(p.id)+' · '+esc(p.content||"Публикация")+'</option>').join(""):'<option value="">Нет подходящих публикаций</option>')+'</select><textarea id="note" maxlength="500" placeholder="Комментарий к работе"></textarea><button class="btn" onclick="submitEntry()">Подать работу</button></div>';return}if(x.my_entry_id){action.innerHTML='<h2>Ваша работа участвует</h2><div class="muted">Одна работа от одного гражданина. После окончания приёма начнётся голосование.</div>';return}if(x.status==="voting"){action.innerHTML='<h2>Голосование</h2><div class="muted">Один голос на конкурс. Голос можно изменить до окончания голосования. За свою работу голосовать нельзя.</div>';return}if(x.status==="finished"){const winner=(x.entries||[]).find(e=>e.is_winner);action.innerHTML='<h2>Конкурс завершён</h2><div class="muted">'+(winner?'Победитель: '+esc(winner.nickname)+' · №'+String(winner.citizen_number).padStart(6,"0"):'Победитель ещё не определён.')+'</div>';return}action.innerHTML='<div class="empty">Действий сейчас нет.</div>'}
async function submitEntry(){const post=Number(document.getElementById("postId").value);if(!post){alert("Нет публикации для подачи.");return}const {error}=await sb.rpc("contest_submit",{p_contest_id:id,p_post_id:post,p_note:document.getElementById("note").value.trim()});if(error){alert(error.message);return}load()}
async function vote(entry){const {error}=await sb.rpc("contest_vote",{p_contest_id:id,p_entry_id:entry});if(error){alert(error.message);return}load()}
async function finalize(entry){if(!confirm("Завершить конкурс и выдать награду выбранному победителю?"))return;const {error}=await sb.rpc("contest_finalize",{p_contest_id:id,p_winner_entry_id:entry});if(error){alert(error.message);return}load()}
load();
</script></body></html>
