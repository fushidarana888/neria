<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль гражданина — Нерия</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f7;
            color: #17171c;
            min-height: 100vh;
        }

        header {
            min-height: 72px;
            background: white;
            border-bottom: 1px solid #e5e5e8;
            display: flex;
            align-items: center;
            padding: 14px 6%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            color: inherit;
        }

        .flag {
            width: 32px;
            height: 42px;
            display: flex;
            flex-direction: column;
            border-radius: 3px;
            overflow: hidden;
        }

        .flag-purple {
            background: #6d3fc0;
            flex: 1;
        }

        .flag-white {
            background: #eee8ff;
            flex: 1;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 25px 100px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #6d3fc0;
            text-decoration: none;
            font-size: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e8;
            border-radius: 16px;
            overflow: hidden;
        }

        .cover {
            height: 115px;
            background: linear-gradient(135deg, #6d3fc0, #9270d1);
        }

        .profile {
            padding: 0 34px 34px;
        }

        .avatar {
            width: 112px;
            height: 112px;
            margin-top: -56px;
            border-radius: 50%;
            background: #f2eef9;
            border: 6px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            color: #6d3fc0;
            box-shadow: 0 0 0 1px #ded7f0;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
        }

        .avatar-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.82);
        }

        .avatar-modal.open {
            display: flex;
        }

        .avatar-modal-content {
            position: relative;
            max-width: min(92vw, 1100px);
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .avatar-modal-image {
            display: block;
            max-width: 92vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .avatar-modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .avatar-modal-button {
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 8px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.12);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }

        .avatar-modal-button:hover {
            background: rgba(255,255,255,0.2);
        }

        .avatar-modal-close {
            position: absolute;
            top: -46px;
            right: 0;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.14);
            color: white;
            font-size: 22px;
            line-height: 36px;
            text-align: center;
            cursor: pointer;
        }

        .name {
            margin-top: 18px;
            font-size: 30px;
            font-weight: 700;
            word-break: break-word;
        }

        .citizen-id {
            margin-top: 7px;
            color: #6d3fc0;
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 10px;
            border-radius: 999px;
            background: #eef9f1;
            color: #27763a;
            font-size: 11px;
            font-weight: 700;
        }

        .data {
            margin-top: 30px;
            border-top: 1px solid #ededf0;
        }

        .row {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid #ededf0;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #888891;
            font-size: 13px;
        }

        .value {
            font-size: 14px;
            font-weight: 500;
            word-break: break-word;
        }

        .message {
            background: white;
            border: 1px solid #e5e5e8;
            border-radius: 14px;
            padding: 30px;
            line-height: 1.65;
        }

        .error {
            color: #963838;
            background: #fff4f4;
            border-color: #efcccc;
        }

        @media (max-width: 600px) {
            main {
                padding: 40px 15px 80px;
            }

            .profile {
                padding: 0 22px 28px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .name {
                font-size: 26px;
            }
        }
    </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="newspaper-mentions.js"></script>

<script>
    const SUPABASE_URL =
        "https://rictvznkxkeygbrlcymn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    const content =
        document.getElementById("content");


    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    const NICKNAME_COLORS = {
        purple: "#6d3fc0",
        blue: "#2563eb",
        cyan: "#0891b2",
        green: "#15803d",
        orange: "#c2410c",
        red: "#b91c1c",
        pink: "#be185d",
        gold: "#a16207",
        gray: "#6b7280"
    };

    function getNicknameColor(color) {
        return NICKNAME_COLORS[color] || "#17171c";
    }

    function getAvatarUrl(path, updatedAt) {
        if (!path) {
            return "";
        }

        const { data } =
            supabaseClient.storage
                .from("avatars")
                .getPublicUrl(path);

        const version =
            updatedAt
                ? new Date(updatedAt).getTime()
                : 0;

        return data.publicUrl + "?v=" + version;
    }


    function getInitial(nickname) {
        const value =
            String(nickname || "?").trim();

        return value
            ? value.charAt(0).toUpperCase()
            : "?";
    }


    function formatMemberSince(value) {
        if (!value) {
            return "—";
        }

        const date =
            new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleDateString(
            "ru-RU",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );
    }


    function formatActivity(activity) {
        if (!activity || activity.visible === false) {
            return "Скрыта";
        }

        if (activity.online) {
            return "🟢 В сети";
        }

        if (!activity.last_seen_at) {
            return "Нет данных";
        }

        const last = new Date(activity.last_seen_at);
        const now = new Date();
        const diffMinutes = Math.max(0, Math.floor((now - last) / 60000));

        if (diffMinutes < 60) {
            return "Последняя активность: " + diffMinutes + " мин. назад";
        }

        const sameDay =
            last.getFullYear() === now.getFullYear() &&
            last.getMonth() === now.getMonth() &&
            last.getDate() === now.getDate();

        if (sameDay) {
            return "Сегодня в " + last.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
        }

        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const isYesterday =
            last.getFullYear() === yesterday.getFullYear() &&
            last.getMonth() === yesterday.getMonth() &&
            last.getDate() === yesterday.getDate();

        if (isYesterday) {
            return "Вчера в " + last.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
        }

        return last.toLocaleString("ru-RU", {
            day:"numeric",
            month:"long",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        });
    }


    function openAvatarModal(url, altText) {

        const modal =
            document.getElementById("avatarModal");

        const modalImage =
            document.getElementById("avatarModalImage");

        const originalLink =
            document.getElementById("avatarOpenOriginal");

        if (!modal || !modalImage || !originalLink) {
            return;
        }

        modalImage.src = url;
        modalImage.alt =
            altText || "Аватар гражданина";

        originalLink.href = url;

        modal.classList.add("open");

        document.body.style.overflow = "hidden";
    }


    function closeAvatarModal(event) {

        if (
            event &&
            event.target !==
                document.getElementById("avatarModal")
        ) {
            return;
        }

        const modal =
            document.getElementById("avatarModal");

        if (!modal) {
            return;
        }

        modal.classList.remove("open");

        document.body.style.overflow = "";
    }


    document.addEventListener(
        "keydown",
        (event) => {
            if (event.key === "Escape") {
                closeAvatarModal();
            }
        }
    );


    function showError(message) {
        content.innerHTML = `
            <div class="message error">
                ${escapeHtml(message)}
            </div>
        `;
    }


    async function loadCitizen() {

        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {
            showError(
                "Не удалось проверить авторизацию."
            );
            return;
        }


        if (!session) {
            showError(
                "Профили граждан доступны только гражданам Нерии. Сначала войдите через Telegram."
            );
            return;
        }


        const {
            data: myStatus,
            error: statusError
        } = await supabaseClient.rpc(
            "get_my_citizenship_status"
        );


        if (statusError) {
            console.error(statusError);
            showError(
                "Не удалось проверить статус гражданства."
            );
            return;
        }


        if (myStatus !== "active") {
            showError(
                "Просматривать профили могут только действующие граждане Нерии."
            );
            return;
        }


        const citizenId =
            new URLSearchParams(
                window.location.search
            ).get("id");


        if (
            !citizenId ||
            !/^\d{1,18}$/.test(citizenId)
        ) {
            showError(
                "Некорректный гражданский ID."
            );
            return;
        }


        const {
            data,
            error
        } = await supabaseClient.rpc(
            "get_public_citizen_profile",
            {
                p_citizen_id: citizenId
            }
        );


        if (error) {
            console.error(error);
            showError(
                "Не удалось загрузить профиль гражданина."
            );
            return;
        }


        const citizen =
            data?.[0];


        if (!citizen) {
            showError(
                "Гражданин не найден или его гражданство сейчас не активно."
            );
            return;
        }

        const { data: activity } =
            await supabaseClient.rpc(
                "citizen_activity_status",
                {
                    p_citizen_number: Number(citizenId)
                }
            );


        const fullName =
            [
                citizen.first_name,
                citizen.surname
            ]
            .filter(Boolean)
            .join(" ") || "Не указано";


        content.innerHTML = `

            <div class="card">

                <div class="cover"></div>

                <div class="profile">

                    <div class="avatar">
                        ${
                            citizen.avatar_path
                                ? `<img
                                    src="${escapeHtml(getAvatarUrl(citizen.avatar_path, citizen.avatar_updated_at))}"
                                    alt="Аватар ${escapeHtml(citizen.nickname)}"
                                    onclick="openAvatarModal(
                                        this.src,
                                        this.alt
                                    )"
                                  >`
                                : escapeHtml(
                                    getInitial(
                                        citizen.nickname
                                    )
                                )
                        }
                    </div>

                    <div
                        class="name"
                        style="color: ${getNicknameColor(citizen.nickname_color)}"
                    >
                        ${citizen.prefix ? '<span class="neria-prefix" style="--prefix:' + escapeHtml(citizen.prefix_color || "#6d3fc0") + '">[' + escapeHtml(citizen.prefix) + ']</span> ' : ''}
                        ${escapeHtml(
                            citizen.nickname
                        )}
                    </div>

                    <div class="citizen-id">
                        Гражданин №${escapeHtml(
                            citizen.citizen_id
                        )}
                    </div>

                    <div class="badge">
                        ДЕЙСТВУЮЩИЙ ГРАЖДАНИН
                    </div>


                    <div class="data">

                        <div class="row">
                            <div class="label">
                                Имя и фамилия
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    fullName
                                )}
                            </div>
                        </div>


                        <div class="row">
                            <div class="label">
                                Дата рождения
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    citizen.birth_date ||
                                    "Скрыта"
                                )}
                            </div>
                        </div>


                        <div class="row">
                            <div class="label">
                                Гражданин с
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    formatMemberSince(
                                        citizen.member_since
                                    )
                                )}
                            </div>
                        </div>

                        <div class="row">
                            <div class="label">
                                Активность
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    formatActivity(activity)
                                )}
                            </div>
                        </div>


                        <div class="row">
                            <div class="label">
                                Гражданский ID
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    citizen.citizen_id
                                )}
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        `;

        const mentionsHost=document.createElement("div");
        mentionsHost.id="newspaperMentions";
        content.appendChild(mentionsHost);
