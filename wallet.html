<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

function friendlyError(error){
    const raw=String(error?.message || error || "");
    const rules=[
        ["Authentication required","Сначала войдите в аккаунт Нерии."],
        ["Active citizenship required","Это действие доступно только действующим гражданам Нерии."],
        ["Sender citizenship is not active","Переводы недоступны: ваше гражданство сейчас не активно."],
        ["Recipient citizenship is not active","Получатель сейчас не является действующим гражданином Нерии."],
        ["Economy access required","У вас нет полномочий Министерства экономики для этого действия."],
        ["MVD access required","У вас нет полномочий МВД для этого действия."],
        ["Founder access required","Это действие доступно только Основателю."],
        ["Access denied","У вас нет доступа к этому разделу или действию."],
        ["Insufficient treasury balance","В государственной казне недостаточно NR."],
        ["Insufficient citizen balance","На счёте гражданина недостаточно NR."],
        ["Insufficient balance","Недостаточно NR на вашем кошельке."],
        ["Citizen not found","Гражданин не найден."],
        ["Recipient citizen not found","Получатель не найден."],
        ["Sender citizen not found","Ваш гражданский профиль не найден."],
        ["Wallet not found","Кошелёк не найден."],
        ["Cannot transfer NR to yourself","Нельзя переводить NR самому себе."],
        ["Listing unavailable","Объявление уже недоступно или его статус изменился."],
        ["Request listing unavailable","Это объявление уже недоступно для отклика."],
        ["Response unavailable","Этот отклик уже обработан или больше недоступен."],
        ["Only listing author can accept","Только автор объявления может выбрать исполнителя."],
        ["Only listing author can reject","Только автор объявления может отклонить отклик."],
        ["Cannot respond to yourself","Нельзя откликнуться на собственное объявление."],
        ["Deal unavailable","Сделка уже недоступна для этого действия."],
        ["Deal is not in dispute","По этой сделке сейчас нет открытого спора."],
        ["Deal already resolved","Сделка уже была завершена."],
        ["Dispute unavailable","Спор уже закрыт или недоступен."],
        ["Open dispute not found","Открытый спор не найден. Возможно, он уже разрешён."],
        ["Dispute already resolved","Спор уже был разрешён."],
        ["Minister cannot resolve own dispute","Министр экономики не может рассматривать собственный спор."],
        ["Minister cannot issue NR to self","Министр экономики не может начислять NR самому себе."],
        ["Minister cannot transfer treasury funds to self","Министр экономики не может переводить деньги из казны самому себе."],
        ["Minister cannot include self in a treasury reward","Министр экономики не может включить себя в государственную награду."],
        ["MVD cannot block self","Сотрудник МВД не может заблокировать самого себя."],
        ["MVD cannot block Founder","МВД не может заблокировать Основателя."],
        ["MVD cannot revoke own citizenship","Сотрудник МВД не может лишить гражданства самого себя."],
        ["MVD cannot revoke Founder citizenship","МВД не может лишить Основателя гражданства."],
        ["Chat is closed","Этот чат уже закрыт."],
        ["Thread not found","Обращение не найдено."],
        ["Message required","Введите сообщение."],
        ["Reason required","Укажите причину."],
        ["Reason is required","Укажите причину."],
        ["Amount required","Укажите сумму NR."],
        ["Amount must be positive","Сумма должна быть положительным целым числом NR."],
        ["Invalid amount","Указана некорректная сумма NR."],
        ["Invalid split","Некорректно указано распределение NR."],
        ["Invalid price","Указана некорректная цена."],
        ["Title and description required","Заполните заголовок и описание."],
        ["Citizen already exists","У этого аккаунта уже есть гражданство Нерии."],
        ["Telegram identity required","Не удалось подтвердить вход через Telegram. Войдите ещё раз."],
        ["Telegram account is blocked","Этот Telegram-аккаунт заблокирован в Нерии."],
        ["Nickname required","Введите ник."],
        ["duplicate key value violates unique constraint","Такое действие уже было выполнено или эти данные уже заняты."]
    ];
    for(const [key,text] of rules){
        if(raw.includes(key)) return text;
    }
    return "Не удалось выполнить действие. Попробуйте ещё раз. Если ошибка повторится, обратитесь к Основателю.";

<script>
const SUPABASE_URL="https://rictvznkxkeygbrlcymn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const content=document.getElementById("content");

function formatNR(value){
    return new Intl.NumberFormat("ru-RU").format(Number(value||0));
}

function escapeHtml(value){
    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function sendTransfer(){
    const recipientNumber =
        Number(document.getElementById("recipientSelect")?.value);

    const amount =
        Number(document.getElementById("transferAmount")?.value);

    const reason =
        document.getElementById("transferReason")?.value?.trim() || null;

    const button =
        document.getElementById("transferButton");

    if(!Number.isSafeInteger(recipientNumber)||recipientNumber<=0){
        alert("Выберите получателя.");
        return;
    }

    if(!Number.isSafeInteger(amount)||amount<=0){
        alert("Введите положительное целое количество NR.");
        return;
    }

    if(!confirm(
        "Перевести " +
        new Intl.NumberFormat("ru-RU").format(amount) +
        " NR гражданину #" +
        String(recipientNumber).padStart(6,"0") +
        "?"
    )){
        return;
    }

    if(button) button.disabled=true;

    const {error}=
        await supabaseClient.rpc(
            "transfer_nr_to_citizen",
            {
                p_recipient_number:recipientNumber,
                p_amount:amount,
                p_reason:reason
            }
        );

    if(button) button.disabled=false;

    if(error){
        console.error(error);

        let message=friendlyError(error);

        if(message.includes("Insufficient balance")){
            message="Недостаточно NR на вашем кошельке.";
        } else if(message.includes("Recipient citizen not found")){
            message="Гражданин с таким ID не найден.";
        } else if(message.includes("Recipient citizenship is not active")){
            message="Получатель сейчас не является активным гражданином.";
        } else if(message.includes("Cannot transfer NR to yourself")){
            message="Нельзя переводить NR самому себе.";
        }

        alert("Перевод не выполнен:\n"+message);
        return;
    }

    alert("Перевод выполнен.");
    await loadWallet();
}

async function loadWallet(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){
        content.innerHTML='<div class="error">Сначала войдите в аккаунт Нерии.</div>';
        return;
    }

    const {data:status,error:statusError}=await supabaseClient.rpc("get_my_citizenship_status");
    if(statusError||status!=="active"){
        content.innerHTML='<div class="error">Кошелёк доступен только действующим гражданам Нерии.</div>';
        return;
    }

    const {data,error}=await supabaseClient.rpc("get_my_wallet");
    if(error){
        console.error(error);
        content.innerHTML='<div class="error">Не удалось загрузить кошелёк.</div>';
        return;
    }

    const wallet=data?.[0];
    if(!wallet){
        content.innerHTML='<div class="error">Кошелёк не найден.</div>';
        return;
    }

    const {data:history,error:historyError}=
        await supabaseClient.rpc(
            "get_my_wallet_history",
            {p_limit:100}
        );

    if(historyError){
        console.error(historyError);
    }

    const historyHtml =
        !history || history.length===0
            ? '<div class="wallet-empty">Операций пока не было.</div>'
            : history.map(item=>{
                const positive=Number(item.amount)>=0;
                let typeLabel;
                switch(item.operation_type){
                    case "admin_emission":
                        typeLabel="Административное начисление";
                        break;
                    case "admin_burn":
                        typeLabel="Административное удаление NR";
                        break;
                    case "treasury_transfer":
                        typeLabel="Выплата из казны";
                        break;
                    case "treasury_reward":
                        typeLabel="Награда из казны";
                        break;
                    case "citizen_transfer_out":
                        typeLabel="Перевод гражданину";
                        break;
                    case "citizen_transfer_in":
                        typeLabel="Перевод от гражданина";
                        break;
                    default:
                        typeLabel=item.operation_type||"Операция";
                }

                if(item.counterparty_citizen_number){
                    typeLabel +=
                        " · #" +
                        String(item.counterparty_citizen_number).padStart(6,"0") +
                        " · " +
                        (item.counterparty_nickname||"");
                }

                return '<div class="wallet-history-item">'+
                    '<div class="wallet-date">'+
                        new Date(item.created_at).toLocaleString("ru-RU")+
                    '</div>'+
                    '<div><div class="wallet-reason">'+
                        escapeHtml(item.reason)+
                    '</div><div class="wallet-type">'+
                        escapeHtml(typeLabel)+
                    '</div></div>'+
                    '<div class="wallet-amount '+(positive?"wallet-positive":"wallet-negative")+'">'+
                        (positive?"+":"")+formatNR(item.amount)+" NR"+
                    '</div>'+
                '</div>';
            }).join("");

    content.innerHTML=`
        <div class="balance-card">
            <div class="balance-label">Доступный баланс</div>
            <div class="balance">${formatNR(wallet.balance)} <span class="unit">NR</span></div>
        </div>

        <div class="transfer-box">
            <h2>Перевести NR</h2>
            <p>
                Выберите получателя из списка активных граждан. Перевод списывается
                с вашего баланса и не создаёт новые NR.
            </p>

            <div class="transfer-form">
                <select id="recipientSelect">
                    <option value="">Загрузка граждан...</option>
                </select>
                <input
                    type="number"
                    id="transferAmount"
                    min="1"
                    step="1"
                    placeholder="Сумма NR"
                >
                <input
                    type="text"
                    id="transferReason"
                    maxlength="250"
                    placeholder="Комментарий (необязательно)"
                >
                <button
                    type="button"
                    class="transfer-button"
                    id="transferButton"
                    onclick="sendTransfer()"
                >
                    Перевести
                </button>
            </div>
        </div>

        <div class="panel">
            <h2>История операций</h2>
            ${historyHtml}
        </div>
    `;


    const recipientsResult =
        await supabaseClient.rpc(
            "get_transfer_recipients"
        );

    const recipientSelect =
        document.getElementById("recipientSelect");

    if(recipientSelect){
        if(recipientsResult.error){
            console.error(recipientsResult.error);
            recipientSelect.innerHTML =
                '<option value="">Не удалось загрузить граждан</option>';
        } else {
            const recipients =
                recipientsResult.data || [];

            recipientSelect.innerHTML =
                '<option value="">Выберите гражданина</option>' +
                recipients.map(citizen => {
                    const number =
                        String(citizen.citizen_number)
                            .padStart(6,"0");

                    return '<option value="' +
                        Number(citizen.citizen_number) +
                        '">' +
                        escapeHtml(
                            citizen.nickname +
                            " · #" +
                            number
                        ) +
                        '</option>';
                }).join("");
        }
    }
}
loadWallet();
</script>
<script>
async function neriaLoadNotificationBadge(){
 try{
  const client=window.supabaseClient||window.sb;
  if(!client||!client.auth)return;
  const {data:{user}}=await client.auth.getUser();
  if(!user)return;
  const paint=async()=>{const {data,error}=await client.rpc("my_unread_notification_count");if(error)return;const n=Number(data||0);document.querySelectorAll(".neria-notification-count").forEach(el=>{el.textContent=n>99?"99+":String(n);el.style.display="none";const link=el.closest(".neria-notification-link");if(link)link.classList.toggle("has-unread",n>0)})};
  await paint();
  client.channel("notification-badge-"+location.pathname).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+user.id},paint).subscribe();
 }catch(e){}
}
window.addEventListener("load",neriaLoadNotificationBadge);
</script></body>
