<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Кошелёк — Нерия</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#17171c;min-height:100vh}
header{height:72px;background:#fff;border-bottom:1px solid #e5e5e8;display:flex;align-items:center;padding:0 6%}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;letter-spacing:1px;text-decoration:none;color:inherit}
.flag{width:32px;height:42px;display:flex;flex-direction:column;border-radius:3px;overflow:hidden}.flag-purple{background:#6d3fc0;flex:1}.flag-white{background:#eee8ff;flex:1}
main{max-width:820px;margin:auto;padding:60px 24px 100px}.back{display:inline-block;margin-bottom:28px;color:#6d3fc0;text-decoration:none;font-size:14px}
h1{font-size:38px;margin-bottom:10px}.lead{color:#777780;line-height:1.6;margin-bottom:30px}
.balance-card{background:linear-gradient(135deg,#fff,#f7f3fc);border:1px solid #ded7f0;border-radius:16px;padding:36px;text-align:center}
.balance-label{font-size:13px;color:#777780;margin-bottom:9px}.balance{font-size:50px;font-weight:700;color:#6d3fc0}.unit{font-size:20px}
.panel{margin-top:22px;background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:24px}
.panel h2{font-size:19px;margin-bottom:14px}.panel p{color:#777780;font-size:14px;line-height:1.6}
.wallet-history-item{display:grid;grid-template-columns:150px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid #eeeeF1;align-items:center}
.wallet-history-item:last-child{border-bottom:none}.wallet-date{font-size:12px;color:#888891}.wallet-reason{font-size:14px;font-weight:600}.wallet-type{font-size:12px;color:#777780;margin-top:4px}.wallet-amount{font-weight:700}.wallet-positive{color:#15803d}.wallet-negative{color:#b91c1c}.wallet-empty{color:#777780;font-size:14px;padding:8px 0}
.error{background:#fff3f3;border-left:3px solid #c43d3d;padding:16px;color:#7a2929;line-height:1.5}
.loading{padding:45px;text-align:center;color:#777780}
@media(max-width:600px){header{padding:0 20px}main{padding:40px 15px 75px}h1{font-size:32px}.balance{font-size:42px}.balance-card{padding:30px 20px}.wallet-history-item{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body>
<header><a href="index.html" class="logo"><div class="flag"><div class="flag-purple"></div><div class="flag-white"></div><div class="flag-purple"></div></div>НЕРИЯ</a></header>
<main>
<a class="back" href="profile.html">← Личный кабинет</a>
<h1>Кошелёк NR</h1>
<p class="lead">Ваш личный счёт во внутренней экономике Нерии.</p>
<div id="content"><div class="loading">Загрузка кошелька...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rictvznkxkeygbrlcymn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const content=document.getElementById("content");

function formatNR(value){
    return new Intl.NumberFormat("ru-RU").format(Number(value||0));
}

function escapeHtml(value){
    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function loadWallet(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){
        content.innerHTML='<div class="error">Сначала войдите в аккаунт Нерии.</div>';
        return;
    }

    const {data:status,error:statusError}=await supabaseClient.rpc("get_my_citizenship_status");
    if(statusError||status!=="active"){
        content.innerHTML='<div class="error">Кошелёк доступен только действующим гражданам Нерии.</div>';
        return;
    }

    const {data,error}=await supabaseClient.rpc("get_my_wallet");
    if(error){
        console.error(error);
        content.innerHTML='<div class="error">Не удалось загрузить кошелёк.</div>';
        return;
    }

    const wallet=data?.[0];
    if(!wallet){
        content.innerHTML='<div class="error">Кошелёк не найден.</div>';
        return;
    }

    const {data:history,error:historyError}=
        await supabaseClient.rpc(
            "get_my_wallet_history",
            {p_limit:100}
        );

    if(historyError){
        console.error(historyError);
    }

    const historyHtml =
        !history || history.length===0
            ? '<div class="wallet-empty">Операций пока не было.</div>'
            : history.map(item=>{
                const positive=Number(item.amount)>=0;
                const typeLabel=
                    item.operation_type==="admin_emission"
                        ? "Административное начисление"
                        : item.operation_type==="treasury_transfer"
                            ? "Выплата из казны"
                            : item.operation_type;

                return '<div class="wallet-history-item">'+
                    '<div class="wallet-date">'+
                        new Date(item.created_at).toLocaleString("ru-RU")+
                    '</div>'+
                    '<div><div class="wallet-reason">'+
                        escapeHtml(item.reason)+
                    '</div><div class="wallet-type">'+
                        escapeHtml(typeLabel)+
                    '</div></div>'+
                    '<div class="wallet-amount '+(positive?"wallet-positive":"wallet-negative")+'">'+
                        (positive?"+":"")+formatNR(item.amount)+" NR"+
                    '</div>'+
                '</div>';
            }).join("");

    content.innerHTML=`
        <div class="balance-card">
            <div class="balance-label">Доступный баланс</div>
            <div class="balance">${formatNR(wallet.balance)} <span class="unit">NR</span></div>
        </div>
        <div class="panel">
            <h2>История операций</h2>
            ${historyHtml}
        </div>
    `;
}
loadWallet();
</script>
</body>
</html>
