<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предложение государству — Нерия</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#17171c}.head{background:#fff;border-bottom:1px solid #e5e5e8;padding:18px 6%}.head a{color:#6d3fc0;text-decoration:none;font-weight:700}main{max-width:900px;margin:auto;padding:45px 20px 90px}.card{background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:22px;margin-bottom:18px}h1{margin:0 0 8px;font-size:34px}.muted{color:#777780}.price{font-size:22px;font-weight:700;margin-top:12px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#f5efff;color:#6d3fc0;font-size:11px;font-weight:700}.chat{height:430px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px}.msg{max-width:78%;padding:10px 12px;border-radius:10px;background:#f1f1f4}.msg.mine{margin-left:auto;background:#eee8ff}.msg.founder{border-left:4px solid #6d3fc0}.meta{font-size:11px;color:#85858e;margin-bottom:4px}.form{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}textarea{min-height:70px;resize:vertical;border:1px solid #dcdce1;border-radius:8px;padding:10px;font:inherit}button{border:0;border-radius:8px;background:#6d3fc0;color:#fff;font-weight:700;padding:10px 14px;cursor:pointer}.empty{text-align:center;color:#777780;padding:30px}@media(max-width:650px){.form{grid-template-columns:1fr}.msg{max-width:92%}}</style></head><body>
<div class="head"><a href="market.html">← Доска объявлений</a></div><main><div id="details" class="card"><div class="empty">Загрузка…</div></div><div class="card"><h2>Переписка с государством</h2><div id="chat" class="chat"><div class="empty">Загрузка…</div></div><div class="form"><textarea id="message" maxlength="2000" placeholder="Написать сообщение"></textarea><button id="send" onclick="sendMessage()">Отправить</button></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
const id=Number(new URLSearchParams(location.search).get("id"));let channel=null,current=null;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nr=v=>new Intl.NumberFormat("ru-RU").format(Number(v||0));
async function load(){if(!Number.isSafeInteger(id)||id<=0){location.href="market.html";return}const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const [{data:d,error:de},{data:m,error:me}]=await Promise.all([sb.rpc("state_service_offer_details",{p_listing_id:id}),sb.rpc("state_service_offer_messages",{p_listing_id:id})]);if(de){document.getElementById("details").innerHTML='<div class="empty">Нет доступа к этому предложению.</div>';document.getElementById("send").disabled=true;return}current=d?.[0];renderDetails(current);if(me){document.getElementById("chat").innerHTML='<div class="empty">Не удалось загрузить переписку.</div>'}else renderMessages(m||[]);if(!channel)channel=sb.channel("state-offer-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"state_offer_messages",filter:"listing_id=eq."+id},()=>load()).subscribe()}
function renderDetails(x){const names={pending:"Ожидает решения",accepted:"Принято государством",rejected:"Отклонено",closed:"Закрыто"};document.getElementById("details").innerHTML='<span class="status">'+esc(names[x.state_offer_status]||x.state_offer_status)+'</span><h1>'+esc(x.title)+'</h1><div class="muted">'+esc(x.author_nickname)+' · #'+String(x.author_number).padStart(6,"0")+'</div><p>'+esc(x.description)+'</p><div class="price">'+(x.price?nr(x.price)+" NR":"Цена договорная")+'</div>';const closed=["rejected","closed"].includes(x.state_offer_status);document.getElementById("send").disabled=closed;document.getElementById("message").disabled=closed}
function renderMessages(rows){const el=document.getElementById("chat");el.innerHTML=rows.length?rows.map(x=>'<div class="msg '+(x.is_mine?'mine ':'')+(x.author_role==="founder"?'founder':'')+'"><div class="meta">'+(x.author_role==="founder"?"Основатель Нерии":"Гражданин")+' · '+new Date(x.created_at).toLocaleString("ru-RU")+'</div>'+esc(x.message)+'</div>').join(""):'<div class="empty">Сообщений пока нет.</div>';el.scrollTop=el.scrollHeight}
async function sendMessage(){const el=document.getElementById("message"),msg=el.value.trim();if(!msg)return;document.getElementById("send").disabled=true;const {error}=await sb.rpc("state_service_offer_send_message",{p_listing_id:id,p_message:msg});if(error){alert("Не удалось отправить сообщение.");document.getElementById("send").disabled=false;return}el.value="";await load();document.getElementById("send").disabled=false}
load();
</script></body></html>
