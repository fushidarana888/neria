<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#17171c}.head{background:#fff;border-bottom:1px solid #e5e5e8;padding:16px 6%}.head a{color:#6d3fc0;text-decoration:none;font-weight:700}main{max-width:900px;margin:auto;padding:42px 16px 80px}.card{background:#fff;border:1px solid #e5e5e8;border-radius:14px;padding:22px;margin-bottom:16px}h1{margin:8px 0;font-size:34px}.muted{color:#777780;line-height:1.5}.price{font-size:21px;font-weight:700;margin-top:12px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#f5efff;color:#6d3fc0;font-size:11px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.purple{background:#6d3fc0;color:#fff}.danger{background:#fff0f0;color:#a92f2f;border:1px solid #efcaca}.secondary{background:#fff;color:#333;border:1px solid #dcdce1}.success{background:#eef9f1;color:#27763a;border:1px solid #c9e6d0}.paybox{display:grid;grid-template-columns:1fr 150px 150px;gap:8px;margin-top:14px}.paybox input,.paybox select,textarea{width:100%;padding:10px;border:1px solid #dcdce1;border-radius:8px;font:inherit}.chat{height:430px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px}.msg{max-width:78%;padding:10px 12px;border-radius:10px;background:#f1f1f4}.msg.mine{margin-left:auto;background:#eee8ff}.msg.founder{border-left:4px solid #6d3fc0}.meta{font-size:11px;color:#85858e;margin-bottom:4px}.form{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}textarea{min-height:70px;resize:vertical}.empty{text-align:center;color:#777780;padding:30px}@media(max-width:700px){main{padding:28px 11px 55px}.card{padding:15px}.paybox,.form{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}.chat{height:55vh;min-height:340px}.msg{max-width:94%}h1{font-size:28px}}</style><style id="neria-unified-header tml">Объявления</a><a href="chat.html">Общий чат</a><a href="newspaper.html">Газета</a><a href="community.html">Telegram</a><a href="laws.html">Законы</a><a href="notifications.html">🔔 Уведомления</a></nav></header>
<div class="head"><a href="market.html">← Доска объявлений</a></div><main>
<div id="details" class="card"><div class="empty">Загрузка…</div></div>
<div id="control" class="card" style="display:none"></div>
<div class="card"><h2>Переписка</h2><div id="chat" class="chat"><div class="empty">Загрузка…</div></div><div class="form"><textarea id="message" maxlength="2000" placeholder="Написать сообщение"></textarea><button id="send" class="purple" onclick="sendMessage()">Отправить</button></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");
const id=Number(new URLSearchParams(location.search).get("id"));let channel=null,current=null,isFounder=false;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nr=v=>new Intl.NumberFormat("ru-RU").format(Number(v||0));
const labels={pending:"Ожидает решения",accepted:"Принято государством",rejected:"Отклонено",withdrawn:"Отозвано гражданином",citizen_refused:"Гражданин отказался от исполнения",completed_paid:"Завершено с выплатой",completed_unpaid:"Завершено без выплаты",closed:"Закрыто"};
const terminal=["rejected","withdrawn","citizen_refused","completed_paid","completed_unpaid","closed"];
async function load(){if(!Number.isSafeInteger(id)||id<=0){location.href="market.html";return}const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const [{data:r},{data:d,error:de},{data:m,error:me}]=await Promise.all([sb.rpc("get_my_government_roles"),sb.rpc("state_service_offer_details",{p_listing_id:id}),sb.rpc("state_service_offer_messages",{p_listing_id:id})]);isFounder=!!r?.[0]?.is_founder;if(de||!d?.[0]){details.innerHTML='<div class="empty">Нет доступа к этому предложению.</div>';send.disabled=true;return}current=d[0];renderDetails();renderControls();if(me)chat.innerHTML='<div class="empty">Не удалось загрузить переписку.</div>';else renderMessages(m||[]);const closed=terminal.includes(current.state_offer_status);send.disabled=closed;message.disabled=closed;if(!channel)channel=sb.channel("state-offer-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"state_offer_messages",filter:"listing_id=eq."+id},()=>load()).subscribe()}
function renderDetails(){details.innerHTML='<span class="status">'+esc(labels[current.state_offer_status]||current.state_offer_status)+'</span><h1>'+esc(current.title)+'</h1><div class="muted">'+esc(current.author_nickname)+' · #'+String(current.author_number).padStart(6,"0")+'</div><p>'+esc(current.description)+'</p><div class="price">'+(current.price?nr(current.price)+" NR":"Цена договорная")+'</div>'}
function renderControls(){control.style.display="block";if(isFounder){if(current.state_offer_status==="pending"){control.innerHTML='<h2>Решение государства</h2><div class="actions"><button class="success" onclick="founderStatus(\'accepted\')">Принять предложение</button><button class="danger" onclick="founderStatus(\'rejected\')">Отклонить</button></div>';return}if(current.state_offer_status==="accepted"){control.innerHTML='<h2>Сделка гражданин × государство</h2><p class="muted">Можно оставить сделку активной и пока не платить, завершить с выплатой либо завершить досрочно без выплаты.</p><div class="paybox"><select id="source"><option value="treasury">Счёт казны</option><option value="founder">Личный счёт Основателя</option></select><input id="amount" type="number" min="1" step="1" placeholder="Сумма NR" value="'+(current.price||"")+'"><button class="purple" onclick="completePaid()">Выплатить и завершить</button></div><div class="actions"><button class="danger" onclick="completeUnpaid()">Завершить досрочно без выплаты</button></div>';return}control.innerHTML='<h2>Сделка завершена</h2><p class="muted">'+esc(labels[current.state_offer_status]||current.state_offer_status)+'</p>';return}
if(current.state_offer_status==="pending")control.innerHTML='<h2>Ваше предложение</h2><p class="muted">Пока Основатель не принял предложение, вы можете его отозвать.</p><div class="actions"><button class="danger" onclick="withdraw()">Отозвать предложение</button></div>';
else if(current.state_offer_status==="accepted")control.innerHTML='<h2>Предложение принято</h2><p class="muted">Если вы больше не можете выполнить услугу, можно отказаться от исполнения.</p><div class="actions"><button class="danger" onclick="withdraw()">Отказаться от исполнения</button></div>';
else control.innerHTML='<h2>Статус</h2><p class="muted">'+esc(labels[current.state_offer_status]||current.state_offer_status)+'</p>'}
function renderMessages(rows){chat.innerHTML=rows.length?rows.map(x=>'<div class="msg '+(x.is_mine?'mine ':'')+(x.author_role==="founder"?'founder':'')+'"><div class="meta">'+(x.author_role==="founder"?"Основатель Нерии":"Гражданин")+' · '+new Date(x.created_at).toLocaleString("ru-RU")+'</div>'+esc(x.message)+'</div>').join(""):'<div class="empty">Сообщений пока нет.</div>';chat.scrollTop=chat.scrollHeight}
async function founderStatus(status){if(!confirm(status==="accepted"?"Принять предложение?":"Отклонить предложение?"))return;const {error}=await sb.rpc("founder_set_state_service_offer_status",{p_listing_id:id,p_status:status});if(error){alert("Не удалось изменить статус.");return}await load()}
async function withdraw(){const text=current.state_offer_status==="accepted"?"Отказаться от исполнения принятого предложения?":"Отозвать предложение государству?";if(!confirm(text))return;const {error}=await sb.rpc("citizen_withdraw_state_offer",{p_listing_id:id});if(error){alert("Не удалось выполнить действие.");return}await load()}
async function completePaid(){const amount=Number(document.getElementById("amount").value),source=document.getElementById("source").value;if(!Number.isSafeInteger(amount)||amount<=0){alert("Укажите положительную сумму NR.");return}if(!confirm("Выплатить "+nr(amount)+" NR и завершить сделку?"))return;const {error}=await sb.rpc("founder_complete_state_offer",{p_listing_id:id,p_pay:true,p_source:source,p_amount:amount,p_note:"Оплата услуги государству"});if(error){alert(String(error.message||"").includes("treasury")?"В казне недостаточно NR.":String(error.message||"").includes("Insufficient balance")?"На личном счёте Основателя недостаточно NR.":"Не удалось провести выплату.");return}await load()}
async function completeUnpaid(){if(!confirm("Завершить сделку досрочно без передачи NR гражданину?"))return;const {error}=await sb.rpc("founder_complete_state_offer",{p_listing_id:id,p_pay:false,p_source:null,p_amount:null,p_note:"Досрочное завершение без выплаты"});if(error){alert("Не удалось завершить сделку.");return}await load()}
async function sendMessage(){const msg=message.value.trim();if(!msg)return;send.disabled=true;const {error}=await sb.rpc("state_service_offer_send_message",{p_listing_id:id,p_message:msg});if(error){alert("Не удалось отправить сообщение.");send.disabled=false;return}message.value="";await load();send.disabled=false}
load();
</script></body></html>
