<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конкурсы — Нерия</title><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171c;font-family:Arial,sans-serif}main{max-width:1080px;margin:auto;padding:44px 18px 90px}.hero h1{font-size:40px;margin:0 0 8px}.hero p{color:#74747c;line-height:1.55}.layout{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.create{background:#fff;border:1px solid #e3e3e8;border-radius:15px;padding:18px}.card{text-decoration:none;color:inherit}.card:hover{border-color:#cbb9e8}.eyebrow{font-size:10px;font-weight:800;color:#6d3fc0;letter-spacing:.7px}.card h3{margin:7px 0}.card p{font-size:13px;color:#6f6f77;line-height:1.45}.meta{font-size:11px;color:#85858e;margin-top:9px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#f2ecfb;color:#6d3fc0;font-size:10px;font-weight:800;margin-top:8px}.create{display:none}.create h2{margin:0 0 5px}.field{margin-top:10px}.field label{display:block;font-size:11px;font-weight:800;color:#666;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font:inherit}.field textarea{min-height:100px}.btn{width:100%;margin-top:12px;border:0;border-radius:8px;background:#6d3fc0;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.empty{grid-column:1/-1;background:#fff;border:1px solid #e5e5e8;border-radius:13px;padding:28px;text-align:center;color:#777}@media(max-width:820px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style></head><body><main><section class="hero"><h1>🏆 Конкурсы Нерии</h1><p>Редкие общие активности без опыта и уровней. Участники подают свои публикации с Площади, граждане голосуют, а победитель получает постоянную награду в профиле и, если предусмотрено, приз NR.</p></section><div class="layout"><section class="grid" id="list"><div class="empty">Загрузка…</div></section><aside class="create" id="create"><h2>Создать конкурс</h2><div class="field"><label>Название</label><input id="title" maxlength="120"></div><div class="field"><label>Описание</label><textarea id="description" maxlength="2500"></textarea></div><div class="field"><label>Приём работ до</label><input id="submitDeadline" type="datetime-local"></div><div class="field"><label>Голосование до</label><input id="voteDeadline" type="datetime-local"></div><div class="field"><label>Приз NR (можно 0)</label><input id="prize" type="number" min="0" max="1000000" value="0"></div><div class="field"><label>Название награды</label><input id="awardTitle" maxlength="100" value="Победитель конкурса"></div><div class="field"><label>Значок</label><input id="awardIcon" maxlength="16" value="🏆"></div><button class="btn" onclick="createContest()">Создать конкурс</button></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const dt=v=>new Date(v).toLocaleString("ru-RU");const status=x=>({submissions:"Приём работ",voting:"Голосование",finished:"Завершён",cancelled:"Отменён"}[x]||x);
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data,error}=await sb.rpc("contest_list");if(error){list.innerHTML='<div class="empty">Не удалось загрузить конкурсы.</div>';return}const rows=Array.isArray(data)?data:[];create.style.display=rows.some(x=>x.is_founder)?"block":"none";list.innerHTML=rows.length?rows.map(x=>'<a class="card" href="contest.html?id='+Number(x.id)+'"><div class="eyebrow">'+esc(status(x.status)).toUpperCase()+'</div><h3>'+esc(x.award_icon||"🏆")+' '+esc(x.title)+'</h3><p>'+esc(x.description||"Без описания")+'</p><div class="meta">Работ: '+Number(x.entries||0)+' · голосов: '+Number(x.votes||0)+(Number(x.prize_nr)>0?' · приз '+Number(x.prize_nr)+' NR':'')+'</div><div class="meta">Приём до '+dt(x.submission_deadline)+' · итоги после '+dt(x.voting_deadline)+'</div><span class="badge">'+esc(status(x.status))+'</span></a>').join(""):'<div class="empty">Конкурсов пока нет.</div>'}
async function createContest(){if(!title.value.trim()||!submitDeadline.value||!voteDeadline.value){alert("Заполните название и сроки.");return}const {data,error}=await sb.rpc("contest_create",{p_title:title.value.trim(),p_description:description.value.trim(),p_submission_deadline:new Date(submitDeadline.value).toISOString(),p_voting_deadline:new Date(voteDeadline.value).toISOString(),p_prize_nr:Number(prize.value||0),p_award_title:awardTitle.value.trim()||"Победитель конкурса",p_award_icon:awardIcon.value.trim()||"🏆"});if(error){alert(error.message);return}location.href="contest.html?id="+data}
load();
</script></body></html>
