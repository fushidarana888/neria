<h1 id="pageTitle">Путь гражданина</h1><p class="lead" id="pageLead">Личная история жизни в Нерии: не уровни и опыт, а реальные события, роли, связи и вклад.</p>
<div id="app"><div class="empty">Загрузка пути…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://rictvznkxkeygbrlcymn.supabase.co','sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>new Intl.NumberFormat('ru-RU').format(Number(v||0));
const date=v=>v?new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'—';
const params=new URLSearchParams(location.search),publicId=params.get('id');let model=null,isOwn=!publicId;
function stage(days){if(days<3)return{title:'Первые дни в Нерии',text:'Ваша история только начинается. Познакомьтесь с гражданами, узнайте как работает экономика и посмотрите, какие пути уже открыты перед вами.'};if(days<7)return{title:'Вы осваиваетесь в Нерии',text:'За первые дни уже начинает формироваться ваша гражданская история. Каждое реальное действие будет постепенно дополнять этот путь.'};if(days<15)return{title:'Первая неделя позади',text:'Вы уже не просто новый аккаунт: у вас появляется собственная история, связи и достижения.'};if(days<30)return{title:'Житель Нерии',text:'Вы прожили в стране больше двух недель. Теперь особенно хорошо видно, как ваша история отличается от истории других граждан.'};if(days<100)return{title:'Первый месяц и дальше',text:'Ваш профиль постепенно становится биографией: сделки, статьи, семья, государственная служба и награды остаются в истории.'};return{title:'История продолжается',text:'Чем дольше вы живёте в Нерии, тем ценнее становится накопленная история гражданина.'}}
function roleName(r){return{economy_minister:'Министр экономики',mvd:'Министр МВД',journalist:'Журналист'}[r]||r}
function render(){const a=document.getElementById('app');if(!model){a.innerHTML='<div class="empty">Нет данных.</div>';return}const c=model.citizen||{},s=model.stats||{},st=stage(Number(s.days_in_neria||0));if(!isOwn){document.getElementById('pageTitle').textContent='Путь '+(c.nickname||'гражданина');document.getElementById('pageLead').textContent='Публичная гражданская история №'+(c.number||'');document.getElementById('backLink').href='citizen.html?id='+encodeURIComponent(c.number||publicId)}
let html='<section class="hero"><div><h2>'+esc(c.nickname||'Гражданин')+'</h2><p>Гражданин №'+esc(c.number||'')+' · с '+esc(date(c.member_since))+'</p><div class="country">Когда '+(isOwn?'вы получили':'было получено')+' гражданство, в Нерии было <strong>'+n(s.citizens_at_join)+'</strong> граждан. Сейчас действующих граждан — <strong>'+n(s.citizens_now)+'</strong>.<br>После этой даты гражданство получили ещё <strong>'+n(s.citizens_joined_after)+'</strong> человек.</div></div><div><div class="day">'+n(s.days_in_neria)+'<small>дней в Нерии</small></div></div></section>';
if(isOwn)html+='<section class="onboarding"><h2>'+esc(st.title)+'</h2><p>'+esc(st.text)+'</p><div class="steps"><a class="step" href="chat.html"><strong>💬 Познакомиться</strong><span>Зайти в общий чат и стать частью жизни страны.</span></a><a class="step" href="state-earn-nr.html"><strong>💰 Заработать NR</strong><span>Посмотреть реальные способы заработка и государственные заказы.</span></a><a class="step" href="achievements.html"><strong>🏆 Достижения</strong><span>Посмотреть, какие события уже стали частью вашей истории.</span></a></div></section>';
const statRows=isOwn?[["💰",n(s.wallet_balance)+' NR','Сейчас в кошельке'],["💬",n(s.messages),'Сообщений в чате'],["🏙️",n(s.square_posts),'Постов на Площади'],["🏠",n(s.clubs),'Клубов'],["🏢",n(s.organizations),'Организаций'],["🛠️",n(s.projects),'Проектов'],["📅",n(s.events),'Событий'],["🤝",n(s.completed_deals),'Завершённых сделок'],["🏆",n(s.achievements),'Ачивок'],["📰",n(s.articles),'Статей'],["🏛",n(s.state_jobs),'Работ для государства'],["🎖",n(s.special_awards),'Особых наград'],["👨‍👩‍👧",n(s.children),'Детей в семейной истории']]:[["💬",n(s.messages),'Сообщений в чате'],["🏙️",n(s.square_posts),'Постов на Площади'],["🤝",n(s.completed_deals),'Завершённых сделок'],["🏆",n(s.achievements),'Ачивок'],["📰",n(s.articles),'Статей'],["🏛",n(s.state_jobs),'Работ для государства'],["🎖",n(s.special_awards),'Особых наград'],["💍",n(s.marriages),'Браков в истории'],["👨‍👩‍👧",n(s.children),'Детей в семейной истории']];
html+='<div class="stats">'+statRows.map(x=>'<div class="stat"><strong>'+x[0]+' '+x[1]+'</strong><span>'+x[2]+'</span></div>').join('')+'</div>';
const roles=(model.roles||[]).map(x=>roleName(x.role)),latestMarriage=(model.marriages||[])[0];const economyText=isOwn?n(s.completed_deals)+' завершённых сделок · '+n(s.nr_received)+' NR получено за всё время.':n(s.completed_deals)+' завершённых сделок. Финансовые суммы доступны только владельцу профиля.';html+='<div class="paths"><div class="path-card"><div class="ico">🏛</div><h3>Государство</h3><p>'+(roles.length?esc(roles.join(', ')):'Государственных ролей пока нет.')+'</p></div><div class="path-card"><div class="ico">💰</div><h3>Экономика</h3><p>'+economyText+'</p></div><div class="path-card"><div class="ico">📰</div><h3>Общество</h3><p>'+n(s.messages)+' сообщений · '+n(s.square_posts)+' постов на Площади · '+n(s.clubs)+' клубов · '+n(s.organizations)+' организаций · '+n(s.projects)+' проектов · '+n(s.events)+' событий · '+n(s.articles)+' опубликованных статей.</p></div><div class="path-card"><div class="ico">💍</div><h3>Личная жизнь</h3><p>'+(latestMarriage?('Брак с '+esc(latestMarriage.partner_nickname)+' · №'+esc(latestMarriage.partner_number)+(latestMarriage.divorced_at?' · расторгнут':' · действует')):'Семейная история пока не началась.')+'</p></div></div>';
html+='<div class="actions"><a class="btn" href="achievements.html'+(isOwn?'':'?id='+encodeURIComponent(c.number||publicId))+'">🏆 Достижения</a>'+(isOwn?'<a class="btn secondary" href="family.html">💍 Браки и семья</a><a class="btn secondary" href="market.html">💼 Экономика</a>':'')+'</div><h2 class="section-title">Хронология</h2><div class="timeline">'+((model.timeline||[]).length?(model.timeline||[]).map(e=>'<article class="event '+esc(e.kind||'')+'"><div class="when">'+esc(date(e.at))+'</div><h3><span class="icon">'+esc(e.icon||'•')+'</span>'+esc(e.title||'Событие')+'</h3><p>'+esc(e.description||'')+'</p></article>').join(''):'<div class="empty">История пока только начинается.</div>')+'</div>';a.innerHTML=html}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='registration.html';return}const call=isOwn?sb.rpc('my_citizen_path'):sb.rpc('public_citizen_path',{p_citizen_number:Number(publicId)});const {data,error}=await call;if(error){document.getElementById('app').innerHTML='<div class="error">Не удалось загрузить путь: '+esc(error.message)+'</div>';return}model=data;render();if(isOwn)await founderEditor(user)}
async function founderEditor(user){const {data:founder}=await sb.from('founders').select('user_id').eq('user_id',user.id).maybeSingle();if(!founder)return;const a=document.getElementById('app'),box=document.createElement('section');box.className='founder-editor';box.innerHTML='<h2>✍️ Запись Основателя в Путь гражданина</h2><p>Для индивидуальных исторических случаев. Запись станет частью публичной хронологии.</p><div class="founder-form"><input id="fIcon" maxlength="8" value="🏛"><input id="fTitle" maxlength="120" placeholder="Название события"><input id="fDate" type="datetime-local"><textarea id="fDesc" maxlength="1000" placeholder="Что произошло и почему это важно"></textarea><button id="fSave">Добавить в Путь</button></div><p id="fStatus"></p>';a.insertBefore(box,a.querySelector('.section-title'));document.getElementById('fSave').onclick=async()=>{const b=document.getElementById('fSave'),status=document.getElementById('fStatus');b.disabled=true;const dt=document.getElementById('fDate').value;const {error}=await sb.rpc('founder_add_path_entry',{p_citizen_number:Number(model.citizen.number),p_title:document.getElementById('fTitle').value.trim(),p_description:document.getElementById('fDesc').value.trim(),p_icon:document.getElementById('fIcon').value.trim(),p_event_at:dt?new Date(dt).toISOString():new Date().toISOString()});status.textContent=error?'Ошибка: '+error.message:'Запись добавлена.';b.disabled=false;if(!error)setTimeout(()=>location.reload(),500)}}
load();
</script>
