<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Уведомления — Нерия</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#17171c}main{max-width:900px;margin:auto;padding:50px 22px 90px}h1{font-size:38px;margin:0}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.back{color:#6d3fc0;text-decoration:none;display:inline-block;margin-bottom:22px}.btn{border:1px solid #d9cdef;background:#fff;color:#6d3fc0;border-radius:8px;padding:10px 13px;cursor:pointer}.item{display:block;background:#fff;border:1px solid #e5e5e8;border-radius:12px;padding:17px 19px;margin-bottom:9px;color:inherit;text-decoration:none}.item.unread{border-color:#cdbce8;background:#faf8fd}.row{display:flex;justify-content:space-between;gap:12px}.title{font-weight:700}.dot{width:8px;height:8px;background:#6d3fc0;border-radius:50%;flex:none;margin-top:5px}.body{font-size:13px;color:#65656d;line-height:1.5;margin-top:6px}.date{font-size:11px;color:#92929a;margin-top:8px}.empty{background:#fff;border:1px solid #e5e5e8;border-radius:12px;padding:30px;color:#777780;text-align:center}
.neria-global-header{min-height:72px;background:#fff;border-bottom:1px solid #e5e5e8;display:flex;align-items:center;justify-content:space-between;padding:14px 6%;gap:25px}.logo{display:flex;align-items:center;gap:12px;color:#17171c;text-decoration:none;font-size:20px;font-weight:700;letter-spacing:1px}.flag{width:32px;height:42px;display:flex;flex-direction:column;border-radius:3px;overflow:hidden}.p{background:#6d3fc0;flex:1}.w{background:#eee8ff;flex:1}nav{display:flex;gap:26px;flex-wrap:wrap}nav a{color:#55555d;text-decoration:none;font-size:14px}@media(max-width:700px){.neria-global-header{justify-content:center;flex-wrap:wrap}.logo{width:100%;justify-content:center}nav{justify-content:center}.head{align-items:flex-start;flex-direction:column}h1{font-size:32px}}</style></head><body>
<header class="neria-global-header"><a href="index.html" class="logo"><span class="flag"><span class="p"></span><span class="w"></span><span class="p"></span></span>НЕРИЯ</a><nav><a href="profile.html">Личный кабинет</a><a href="citizens.html">Граждане Нерии</a><a href="state.html">Государство</a><a href="treasury.html">Экономика</a><a href="market.html">Объявления</a><a href="laws.html">Законы</a></nav></header>
<main><a class="back" href="index.html">← На главную</a><div class="head"><h1>Уведомления</h1><button class="btn" onclick="readAll()">Прочитать все</button></div><div id="list"><div class="empty">Загрузка…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");let channel=null;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data,error}=await sb.rpc("my_notifications",{p_limit:100});const el=document.getElementById("list");if(error){el.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const rows=data||[];el.innerHTML=rows.length?rows.map(x=>'<a class="item '+(!x.is_read?'unread':'')+'" href="'+esc(x.link||"#")+'" onclick="markRead('+x.id+')"><div class="row"><div class="title">'+esc(x.title)+'</div>'+(!x.is_read?'<span class="dot"></span>':'')+'</div>'+(x.body?'<div class="body">'+esc(x.body)+'</div>':'')+'<div class="date">'+new Date(x.created_at).toLocaleString("ru-RU")+'</div></a>').join(""):'<div class="empty">Уведомлений пока нет.</div>';if(!channel)channel=sb.channel("my-notifications").on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+user.id},()=>load()).subscribe()}
async function markRead(id){await sb.rpc("mark_notification_read",{p_id:id})}async function readAll(){await sb.rpc("mark_all_notifications_read");await load()}load();
</script></body></html>
