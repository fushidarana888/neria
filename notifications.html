<main><a class="back" href="index.html">← На главную</a><div class="head"><h1>Уведомления</h1><button class="btn" onclick="readAll()">Прочитать все</button></div><div id="list"><div class="empty">Загрузка…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://rictvznkxkeygbrlcymn.supabase.co","sb_publishable_SVwKto14tbMtsmcDOagvCw_TVqg7he7");let channel=null;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="registration.html";return}const {data,error}=await sb.rpc("my_notifications",{p_limit:100});const el=document.getElementById("list");if(error){el.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const rows=data||[];el.innerHTML=rows.length?rows.map(x=>'<a class="item '+(!x.is_read?'unread':'')+'" href="'+esc(x.link||"#")+'" onclick="markRead('+x.id+')"><div class="row"><div class="title">'+esc(x.title)+'</div>'+(!x.is_read?'<span class="dot"></span>':'')+'</div>'+(x.body?'<div class="body">'+esc(x.body)+'</div>':'')+'<div class="date">'+new Date(x.created_at).toLocaleString("ru-RU")+'</div></a>').join(""):'<div class="empty">Уведомлений пока нет.</div>';if(!channel)channel=sb.channel("my-notifications").on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+user.id},()=>load()).subscribe()}
async function markRead(id){await sb.rpc("mark_notification_read",{p_id:id})}async function readAll(){await sb.rpc("mark_all_notifications_read");await load()}load();
</script></body></html>
